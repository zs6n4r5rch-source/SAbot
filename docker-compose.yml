services:
  postgres:
    image: postgres:16
    container_name: strike-arena-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-langame_bot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langame} -d ${POSTGRES_DB:-langame_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: strike-arena-bot
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  postgres_data:
