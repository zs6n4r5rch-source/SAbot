[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "langame-club-bot"
version = "0.1.0"
description = "Telegram bot for administrators, inventory control and owner analytics"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]
