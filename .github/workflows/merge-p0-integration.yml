name: Integrate P0 E2E

on:
  push:
    branches: [integration/p0-e2e-merge]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge P0 branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin fix/p0-e2e-clean
          git merge --no-edit -X theirs origin/fix/p0-e2e-clean

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile
        run: python -m compileall -q .

      - name: Tests
        run: pytest -q

      - name: Push integrated branch
        run: git push origin HEAD:integration/p0-e2e-merge
