name: repair app guard syntax

on:
  push:
    branches: [fix-v11-app-guard-syntax]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed salary renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/webapp/static/app-guard.js')
          s = p.read_text(encoding='utf-8')
          old = "+'</div>')}function workScreen"
          new = "+'</div>'}function workScreen"
          if old not in s:
              raise SystemExit('target syntax defect not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check app/webapp/static/app-guard.js
      - name: Commit repaired file and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/webapp/static/app-guard.js .github/workflows/repair-app-guard-syntax.yml
          git rm .github/workflows/repair-app-guard-syntax.yml
          git commit -m 'fix: repair app guard salary renderer syntax'
          git push
