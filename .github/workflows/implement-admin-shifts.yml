name: Implement admin shift control
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update owner admin screen and API
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('app/webapp/app.py')
          s = app.read_text()
          old_import = 'Employee, TelegramUser, UserRole, Shift, InventoryBalance, Product,\n    SalaryViolation'
          new_import = 'Employee, TelegramUser, UserRole, Shift, ShiftCloseReport, InventoryBalance, Product,\n    SalaryViolation'
          if old_import in s and 'ShiftCloseReport' not in s.split('from app.models import (', 1)[1].split(')', 1)[0]:
              s = s.replace(old_import, new_import, 1)

          old = re.compile(r'@app\.get\("/api/admins"\)\nasync def admins\(request: Request\):.*?\n\n\n@app\.get\("/api/clients"\)', re.S)
          new = '''@app.get("/api/admins")
async def admins(request: Request):
    user, _ = await current_user(request)
    owner_required(user)
    now = datetime.now(timezone.utc)
    day_start = now.replace(hour=0, minute=0, second=0, microsecond=0)
    async with SessionLocal() as session:
        employees = (await session.execute(
            select(Employee, TelegramUser)
            .outerjoin(TelegramUser, TelegramUser.employee_id == Employee.id)
            .where(Employee.active.is_(True))
            .order_by(Employee.full_name)
        )).all()
        shift_rows = (await session.execute(
            select(Shift, Employee, ShiftCloseReport)
            .outerjoin(Employee, Employee.id == Shift.employee_id)
            .outerjoin(ShiftCloseReport, ShiftCloseReport.shift_id == Shift.id)
            .where(Shift.started_at >= day_start)
            .order_by(Shift.started_at.desc())
        )).all()

    by_employee = {}
    for shift, employee, report in shift_rows:
        if not shift.employee_id:
            continue
        current = by_employee.get(shift.employee_id)
        if current is None or shift.started_at > current["started_at"]:
            by_employee[shift.employee_id] = {
                "shift_id": shift.id,
                "langame_shift_id": shift.langame_shift_id,
                "started_at": iso(shift.started_at),
                "ended_at": iso(shift.ended_at),
                "status": "open" if shift.ended_at is None else "closed",
                "cash_sales": dec(shift.cash_sales),
                "card_sales": dec(shift.card_sales),
                "mobile_sales": dec(shift.mobile_sales),
                "sales": dec(shift.cash_sales) + dec(shift.card_sales) + dec(shift.mobile_sales),
                "refunds": dec(shift.refunds_cash) + dec(shift.refunds_card),
                "collection": dec(shift.collection),
                "cash_difference": dec(shift.cash_difference) if shift.cash_difference is not None else None,
                "report_status": report.status if report else "missing",
                "report_submitted_at": iso(report.submitted_at) if report else None,
                "stock_discrepancies_count": (report.stock_discrepancies_count or 0) if report else None,
            }

    items = []
    for e, tu in employees:
        shift = by_employee.get(e.id)
        items.append({
            "id": e.id,
            "name": e.full_name or f"Сотрудник #{e.id}",
            "phone": e.phone,
            "telegram_id": tu.telegram_id if tu else None,
            "role": tu.role if tu else "not_linked",
            "access_active": bool(tu and tu.active),
            "langame_user_id": e.langame_user_id,
            "shift": shift,
        })
    return {"items": items, "today": {"date": day_start.date().isoformat()}}


@app.get("/api/admins/{employee_id}/shifts")
async def admin_shifts(request: Request, employee_id: int, days: int = 30):
    user, _ = await current_user(request)
    owner_required(user)
    days = min(max(days, 1), 90)
    start = datetime.now(timezone.utc) - timedelta(days=days)
    async with SessionLocal() as session:
        employee = await session.get(Employee, employee_id)
        if not employee:
            raise HTTPException(404, "Employee not found")
        rows = (await session.execute(
            select(Shift, ShiftCloseReport)
            .outerjoin(ShiftCloseReport, ShiftCloseReport.shift_id == Shift.id)
            .where(Shift.employee_id == employee_id, Shift.started_at >= start)
            .order_by(Shift.started_at.desc())
            .limit(200)
        )).all()
    return {
        "employee": {"id": employee.id, "name": employee.full_name or f"Сотрудник #{employee.id}"},
        "days": days,
        "items": [{
            "id": s.id,
            "langame_shift_id": s.langame_shift_id,
            "started_at": iso(s.started_at),
            "ended_at": iso(s.ended_at),
            "status": "open" if s.ended_at is None else "closed",
            "sales": dec(s.cash_sales) + dec(s.card_sales) + dec(s.mobile_sales),
            "cash_sales": dec(s.cash_sales),
            "card_sales": dec(s.card_sales),
            "mobile_sales": dec(s.mobile_sales),
            "refunds": dec(s.refunds_cash) + dec(s.refunds_card),
            "collection": dec(s.collection),
            "cash_difference": dec(s.cash_difference) if s.cash_difference is not None else None,
            "handover_note": s.handover_note,
            "report_status": r.status if r else "missing",
            "report_submitted_at": iso(r.submitted_at) if r else None,
            "stock_items_count": r.stock_items_count if r else None,
            "stock_discrepancies_count": r.stock_discrepancies_count if r else None,
            "cash_shortage_reason": r.cash_shortage_reason if r else None,
            "cash_comment": r.cash_comment if r else None,
            "cleaning_confirmed_at": iso(r.cleaning_confirmed_at) if r else None,
        } for s, r in rows],
    }


@app.get("/api/clients")'''
          s2, n = old.subn(new, s, count=1)
          if n != 1:
              raise SystemExit('Could not locate /api/admins block')
          app.write_text(s2)

          html = Path('app/webapp/static/index.html')
          h = html.read_text()
          pattern = re.compile(r'async function admins\(\)\{.*?\}\nasync function clients\(\)', re.S)
          replacement = '''async function admins(){clear();setBottom(false);back();const d=await api('/api/admins');const items=d.items||[];const active=items.filter(x=>x.shift&&x.shift.status==='open').length;const submitted=items.filter(x=>x.shift&&x.shift.status==='closed'&&x.shift.report_status==='submitted').length;const reportProblems=items.filter(x=>x.shift&&x.shift.status==='closed'&&x.shift.report_status!=='submitted').length;const html=items.length?items.map(x=>{const s=x.shift;let state='⚪ Нет смены',badge='';if(s?.status==='open'){state='🟢 На смене';badge=`<span class="badge good">На смене</span>`}else if(s?.status==='closed'&&s.report_status==='submitted'){state='⚪ Смена закрыта';badge=`<span class="badge good">Отчёт сдан</span>`}else if(s?.status==='closed'){state='🟠 Отчёт не сдан';badge=`<span class="badge warn">Отчёт</span>`}else{badge=`<span class="badge ${x.access_active?'good':'warn'}">${x.access_active?'Доступ':'Нет доступа'}</span>`}return `<section class="card admin-card" data-admin="${x.id}"><div class="admin-head"><div><div class="admin-name">${x.name}</div><div class="admin-meta">${state} · ${x.telegram_id?'Telegram привязан':'Telegram не привязан'}</div></div>${badge}</div>${s?`<div class="admin-main"><div class="mini"><div class="mini-label">Смена</div><div class="mini-value">${s.status==='open'?'Открыта':'Закрыта'}</div></div><div class="mini"><div class="mini-label">Продажи</div><div class="mini-value">${money(s.sales)}</div></div><div class="mini"><div class="mini-label">Отчёт</div><div class="mini-value">${s.report_status==='submitted'?'Сдан':'Не сдан'}</div></div><div class="mini"><div class="mini-label">Касса</div><div class="mini-value">${s.cash_difference===null?'—':money(s.cash_difference)}</div></div></div>`:`<div class="admin-main"><div class="mini"><div class="mini-label">Telegram</div><div class="mini-value">${x.telegram_id?'Есть':'Нет'}</div></div><div class="mini"><div class="mini-label">Langame</div><div class="mini-value">${x.langame_user_id||'—'}</div></div></div>`}<button class="secondary" style="margin-top:10px" onclick="adminDetail(${x.id})">Открыть смены и отчёты →</button></section>`}).join(''):'<div class="empty">Сотрудников пока нет</div>';root.insertAdjacentHTML('beforeend',`<div class="section-title"><h2>Администраторы</h2><span>${items.length}</span></div><div class="kpis"><div class="kpi"><div class="kpi-label">Сейчас на смене</div><div class="kpi-value good">${active}</div></div><div class="kpi"><div class="kpi-label">Отчётов сдано сегодня</div><div class="kpi-value">${submitted}</div></div><div class="kpi"><div class="kpi-label">Отчётов требуют внимания</div><div class="kpi-value ${reportProblems?'warn':''}">${reportProblems}</div></div><div class="kpi"><div class="kpi-label">Всего администраторов</div><div class="kpi-value">${items.length}</div></div></div>${html}`)}
async function adminDetail(id){clear();setBottom(false);back();const d=await api(`/api/admins/${id}/shifts?days=30`);const items=d.items||[];const fmt=(v)=>v?new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';const report=(s)=>s.report_status==='submitted'?'<span class="badge good">Отчёт сдан</span>':s.report_status==='missing'?'<span class="badge warn">Отчёта нет</span>':'<span class="badge warn">Отчёт не завершён</span>';const html=items.length?items.map(s=>`<section class="card"><div class="admin-head"><div><div class="admin-name">${fmt(s.started_at)} · смена #${s.langame_shift_id}</div><div class="admin-meta">${s.status==='open'?'🟢 Открыта':'⚪ Закрыта'}${s.ended_at?' · '+fmt(s.ended_at):''}</div></div>${report(s)}</div><div class="admin-main"><div class="mini"><div class="mini-label">Продажи</div><div class="mini-value">${money(s.sales)}</div></div><div class="mini"><div class="mini-label">Наличные</div><div class="mini-value">${money(s.cash_sales)}</div></div><div class="mini"><div class="mini-label">Карта</div><div class="mini-value">${money(s.card_sales)}</div></div><div class="mini"><div class="mini-label">Онлайн</div><div class="mini-value">${money(s.mobile_sales)}</div></div></div><div class="row"><div class="row-main"><div class="row-title">Расхождение кассы</div></div><div class="row-value">${s.cash_difference===null?'—':money(s.cash_difference)}</div></div><div class="row"><div class="row-main"><div class="row-title">Товары в отчёте</div><div class="row-sub">Расхождения по остаткам</div></div><div class="row-value">${s.stock_items_count??'—'} / ${s.stock_discrepancies_count??0}</div></div>${s.cash_shortage_reason?`<div class="row"><div class="row-main"><div class="row-title">Причина недостачи</div><div class="row-sub">${s.cash_shortage_reason}</div></div></div>`:''}${s.handover_note?`<div class="row"><div class="row-main"><div class="row-title">Передача смены</div><div class="row-sub">${s.handover_note}</div></div></div>`:''}</section>`).join(''):'<div class="empty">За последние 30 дней смен не найдено</div>';root.insertAdjacentHTML('beforeend',`<div class="section-title"><h2>${d.employee.name}</h2><span>30 дней</span></div>${html}`)}
async function clients()'''
          h2, n = pattern.subn(replacement, h, count=1)
          if n != 1:
              raise SystemExit('Could not locate Mini App admins block')
          html.write_text(h2)

          # Add a focused regression test for the new owner shift contract.
          test = Path('tests/test_owner_admin_shifts.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_owner_admin_shift_screen_contract():\n    app = Path("app/webapp/app.py").read_text()\n    html = Path("app/webapp/static/index.html").read_text()\n    assert "ShiftCloseReport" in app\n    assert "@app.get(\"/api/admins/{employee_id}/shifts\")" in app\n    assert "Сейчас на смене" in html\n    assert "Отчётов сдано сегодня" in html\n    assert "adminDetail" in html\n''')

      - name: Validate syntax
        run: |
          python -m py_compile app/webapp/app.py
          node --check <(python -c "from pathlib import Path; import re; s=Path('app/webapp/static/index.html').read_text(); print(re.search(r'<script>(.*?)</script>', s, re.S).group(1))")
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/webapp/app.py app/webapp/static/index.html tests/test_owner_admin_shifts.py
          git commit -m "feat: add shift and report control to admin list"
          git push
      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/implement-admin-shifts.yml
          git commit -m "chore: remove one-shot admin shift workflow"
          git push
