name: repair-owner-clients
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch owner client cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/bot/owner_data_menu.py')
          s=p.read_text()
          old='callback_data=f"client:noop:{gid}"'
          new='callback_data=f"client:view:{gid}"'
          if old not in s:
              raise SystemExit('expected client callback pattern not found')
          s=s.replace(old,new,1)
          old_handler='''@router.callback_query(F.data == "client:noop")\nasync def client_noop(call: CallbackQuery):\n    await call.answer("Карточка клиента будет открыта отдельным экраном.")\n'''
          new_handler='''@router.callback_query(F.data.startswith("client:view:"))\nasync def client_view(call: CallbackQuery):\n    if not await is_owner(call):\n        await call.answer("Нет доступа", show_alert=True)\n        return\n    try:\n        guest_id = int(call.data.split(":", 2)[2])\n        data = await langame_client.guest_by_id(guest_id)\n        items = data.get("items") or data.get("data") or []\n        if isinstance(items, dict):\n            items = items.get("items") or items.get("data") or []\n        x = items[0] if items else {}\n        fio = x.get("fio") or x.get("name") or "Без имени"\n        phone = x.get("phone") or "—"\n        balance = x.get("balance")\n        bonus = x.get("bonus_balance")\n        blacklist = x.get("black_list")\n        text = (\n            f"👤 <b>{fio}</b>\\n\\n"\n            f"Телефон: {phone}\\n"\n            f"LANGAME ID: {guest_id}\\n"\n            f"Баланс: {balance if balance is not None else '—'}\\n"\n            f"Бонусы: {bonus if bonus is not None else '—'}\\n"\n            f"Чёрный список: {'да' if blacklist else 'нет'}"\n        )\n    except Exception as exc:\n        text = f"❌ Не удалось загрузить карточку клиента.\\n{str(exc)[:300]}"\n    await call.message.edit_text(text, reply_markup=owner_back())\n    await call.answer()\n'''
          if old_handler not in s:
              raise SystemExit('expected client noop handler not found')
          s=s.replace(old_handler,new_handler,1)
          p.write_text(s)
          PY
      - name: Validate Python
        run: python -m py_compile app/bot/owner_data_menu.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/bot/owner_data_menu.py .github/workflows/repair-owner-clients.yml
          git commit -m 'fix: open owner client cards' || exit 0
          git push
