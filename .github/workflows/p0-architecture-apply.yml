name: Apply P0 architecture fix
on:
  push:
    branches: [p0-architecture-fix]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-architecture-fix
      - name: Apply deterministic root composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('app/webapp/app.py'); s=p.read_text()
          s=s.replace('from fastapi.responses import FileResponse','from fastapi.responses import FileResponse, HTMLResponse')
          old='@app.get("/")\nasync def index():\n    return FileResponse(STATIC_DIR / "index.html")\n'
          new='@app.get("/")\nasync def index():\n    from app.webapp.page_composer import compose_page\n    html = (STATIC_DIR / "index.html").read_text(encoding="utf-8")\n    return HTMLResponse(compose_page(html))\n'
          if old not in s: raise SystemExit('app.py root handler not found')
          p.write_text(s.replace(old,new,1))

          p=Path('app/main.py'); s=p.read_text()
          if 'from app.webapp.page_composer import install as install_page_composer' not in s:
              s=s.replace('from app.webapp.work_center_v3 import install as install_work_center_v3\n','from app.webapp.work_center_v3 import install as install_work_center_v3\nfrom app.webapp.page_composer import install as install_page_composer\n')
          old='apply_admin_shift_control_fix(); install_current_summary(web_app); install_management_dashboard(web_app); install_current_summary_v2(web_app); install_current_summary_v3(web_app); install_work_center_v3(web_app); install_admin_shift_control(web_app); install_admin_penalties(web_app); install_admin_penalties_ui(web_app)'
          if old not in s: raise SystemExit('main install line not found')
          p.write_text(s.replace(old,old+'; install_page_composer(web_app)',1))

          p=Path('app/webapp/work_center_v3.py'); s=p.read_text()
          old='"hall": {"active_guests": None if sessions_error else len({int(s["guest_id"]) for s in active})}'
          new='"hall": {"active_guests": None if sessions_error else len(active), "active_sessions": None if sessions_error else len(active)}'
          if old not in s: raise SystemExit('work hall payload not found')
          p.write_text(s.replace(old,new,1))

          p=Path('app/webapp/current_summary_v3.py'); s=p.read_text()
          old='try: count=int((await langame_client.guests_search(groups=[int(g["id"])],size=1,page=1).get("pagination",{})).get("total",0))'
          new='try:\n                    payload = await langame_client.guests_search(groups=[int(g["id"])], size=1, page=1)\n                    count = int((payload.get("pagination") or {}).get("total", 0))'
          if old not in s: raise SystemExit('loyalty count bug not found')
          s=s.replace(old,new,1)
          old2='<div class="section-title"><h2>Гости</h2></div><section class="card">${svR(\'Гости сейчас\',d.guests.active??\'—\')}${svR(\'Гости сегодня\',d.guests.today??\'—\')}</section>'
          if old2 not in s: raise SystemExit('duplicate guests block not found')
          p.write_text(s.replace(old2,'',1))

          Path('app/webapp/page_composer.py').write_text('''from fastapi.routing import APIRoute\n\n\ndef compose_page(html: str) -> str:\n    from app.webapp.work_center_v3 import JS as work_js\n    from app.webapp.management_dashboard import JS as management_js\n    from app.webapp.current_summary import JS as summary_js\n    from app.webapp.current_summary_v3 import JS as summary_v3_js\n    from app.webapp.admin_shift_control import JS as admin_js\n    from app.webapp.admin_penalties_ui import JS as penalties_ui_js\n    admin_guard = r\'''<script>\n(function(){\n  const ownerHome=window.home;\n  window.home=async function(){\n    if(me?.role!=="admin") return ownerHome?.();\n    clear();setBottom(true);\n    try{\n      const d=await api("/api/shifts?days=30"); const rows=d.items||[]; const current=rows.find(x=>x.status==="open");\n      root.innerHTML=`<section class="hero"><div class="eyebrow">МОИ СМЕНЫ</div><div class="hero-title">${me.display_name||"Администратор"}</div><div class="hero-sub">Только ваши смены, отчёты, начисления и нарушения.</div></section>`;\n      root.insertAdjacentHTML("beforeend",`<div class="section-title"><h2>Текущая смена</h2></div><section class="card">${current?row("Статус","Открыта",current.started_at||"")+row("Наличные",money(current.cash_sales))+row("Карта",money(current.card_sales))+row("Онлайн",money(current.mobile_sales))+row("Разница кассы",current.cash_difference==null?"—":money(current.cash_difference)):"<div class=\\"empty\\">Открытой смены нет</div>"}</section>`);\n      root.insertAdjacentHTML("beforeend",`<div class="section-title"><h2>Мои разделы</h2></div><div class="nav-card"><button class="nav-btn" onclick="shifts()"><span class="nav-icon">📋</span><span class="nav-copy"><span class="nav-label">Мои смены</span><span class="nav-hint">История и статусы</span></span><span class="nav-arrow">›</span></button><button class="nav-btn" onclick="salary()"><span class="nav-icon">₽</span><span class="nav-copy"><span class="nav-label">Моя зарплата</span><span class="nav-hint">Начисления</span></span><span class="nav-arrow">›</span></button><button class="nav-btn" onclick="bonuses()"><span class="nav-icon">+</span><span class="nav-copy"><span class="nav-label">Мои бонусы</span><span class="nav-hint">Поощрения</span></span><span class="nav-arrow">›</span></button></div>`);\n      root.insertAdjacentHTML("beforeend",`<div class="card muted">Закрытие смены и обязательный отчёт выполняются штатным сценарием Telegram; в приложении администратор видит только собственные данные.</div>`);\n    }catch(e){fail(e)}\n  };\n  window.goNav=function(which){if(which==="home")return window.home();if(which==="work")return me?.role==="owner"?(window.workCenter?window.workCenter():window.home()):window.shifts();if(which==="more")return me?.role==="owner"?(window.settings?window.settings():window.home()):(window.bonuses?window.bonuses():window.home())};\n})();\n</script>\'''\n    return html.replace('</body>', '\\n'.join((work_js, management_js, summary_js, summary_v3_js, admin_js, penalties_ui_js, admin_guard))+'</body>', 1)\n\n\ndef install(web_app):\n    for route in list(web_app.routes):\n        if isinstance(route, APIRoute) and route.path == '/':\n            web_app.routes.remove(route)\n    from app.webapp.app import index\n    web_app.add_api_route('/', index, methods=['GET'], include_in_schema=False)\n''')
          PY
          python -m compileall -q app
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/webapp/app.py app/main.py app/webapp/work_center_v3.py app/webapp/current_summary_v3.py app/webapp/page_composer.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: centralize mini-app root composition'
          git push
