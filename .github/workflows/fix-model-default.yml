name: Fix model default
on:
  push:
    branches:
      - fix/p0-shift-salary-e2e
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch model
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/models/base.py')
          s = p.read_text(encoding='utf-8')
          old = 'quantity: Mapped[Decimal] = mapped_column(Numeric(14, 3), default=0, server_default="5")'
          new = 'quantity: Mapped[Decimal] = mapped_column(Numeric(14, 3), default=0, server_default="0")'
          assert old in s
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q app
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/models/base.py
          git commit -m 'Fix inventory quantity model default'
          git push
