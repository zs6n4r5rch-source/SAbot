name: Test

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sabot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sabot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sabot
      LANGAME_API_KEY: ci-test-key
      TELEGRAM_BOT_TOKEN: "000000000:ci-test-token"
      OWNER_TELEGRAM_IDS: "1"
      LANGAME_READ_ONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest
          pip check

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Temporary diagnostic — min_stock checkpoints
        run: |
          set -euo pipefail
          PGURL="$(printf '%s' "$DATABASE_URL" | sed 's#^postgresql+asyncpg://#postgresql://#')"
          [[ "$PGURL" == postgresql://* ]] || { echo "Unsupported DATABASE_URL format"; exit 1; }

          echo "=== inventory_balances references in migration history ==="
          grep -RniE 'inventory_balances|batch_alter_table|DROP TABLE|rename_table' alembic/versions/*.py || true

          check_default() {
            local label="$1"
            echo "=== ${label} ==="
            psql "$PGURL" -v ON_ERROR_STOP=1 -t -A -F '|' -c "
              SELECT
                COALESCE((
                  SELECT 'present' FROM pg_tables
                  WHERE schemaname = 'public' AND tablename = 'inventory_balances'
                ), 'absent') AS table_state;

              SELECT
                COALESCE(c.column_default, '<no column>') AS column_default,
                COALESCE(pg_get_expr(d.adbin, d.adrelid), '<no pg_attrdef>') AS pg_default_expr,
                CASE WHEN d.oid IS NULL THEN 'no_pg_attrdef' ELSE 'has_pg_attrdef' END AS attrdef_state
              FROM (SELECT 'inventory_balances'::text AS table_name, 'min_stock'::text AS column_name) target
              LEFT JOIN information_schema.columns c
                ON c.table_schema = 'public'
               AND c.table_name = target.table_name
               AND c.column_name = target.column_name
              LEFT JOIN pg_namespace n
                ON n.nspname = 'public'
              LEFT JOIN pg_class cls
                ON cls.relnamespace = n.oid
               AND cls.relname = target.table_name
              LEFT JOIN pg_attribute a
                ON a.attrelid = cls.oid
               AND a.attname = target.column_name
               AND a.attnum > 0
               AND NOT a.attisdropped
              LEFT JOIN pg_attrdef d
                ON d.adrelid = a.attrelid
               AND d.adnum = a.attnum;
            "
          }

          alembic upgrade 0001_initial
          check_default "after 0001"
          alembic upgrade 0021_inventory_min_stock_five
          check_default "after 0021"
          alembic upgrade 0024_bonus_record_source
          check_default "after 0024"
          alembic upgrade 0025_inventory_min_stock_reconciliation
          check_default "after 0025"

      - name: Run migrations on a fresh database
        run: alembic upgrade head

      - name: Run full pytest suite
        run: pytest -q

      - name: Verify handler surface
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path('app/bot/handlers.py').read_text(encoding='utf-8')
          start_src = Path('app/bot/start.py').read_text(encoding='utf-8')
          tree = ast.parse(src)
          funcs = {n.name for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          required = {'admins', 'my_shifts', 'my_stats', 'is_owner', 'owner_menu_dispatch'}
          missing = required - funcs
          assert not missing, f'Missing handlers: {sorted(missing)}'
          start_tree = ast.parse(start_src)
          start_funcs = {n.name for n in ast.walk(start_tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          assert 'start_entry' in start_funcs, 'Canonical /start handler missing'
          assert 'CommandStart()' in start_src, 'Canonical /start decorator missing'
          assert '"📅 Ежедневная сводка"' in src
          assert 'callback.from_user.id' in src
          print('Handler surface OK; canonical start_entry present')
          PY
