name: Repair handlers and test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair callback actor context and daily summary label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/bot/handlers.py')
          s = p.read_text(encoding='utf-8')
          original = s
          s = s.replace('"👑 Панель владельца",', '"📅 Ежедневная сводка",')
          s = s.replace('if text == "👑 Панель владельца":', 'if text == "📅 Ежедневная сводка":')
          s = s.replace('if not await is_owner(callback.message):', 'if not await owner_dashboard_is_owner(callback.from_user.id if callback.from_user else None):')
          s = s.replace('user = await get_access(callback.message)', 'user = await get_access(callback.message.model_copy(update={"from_user": callback.from_user}))')
          s = s.replace('    message = callback.message\n', '    message = callback.message.model_copy(update={"from_user": callback.from_user})\n', 2)
          s = s.replace('if not await is_owner(callback.message):', 'if not await owner_dashboard_is_owner(callback.from_user.id if callback.from_user else None):')
          if s != original:
              p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run full pytest suite
        run: pytest -q

      - name: Verify handler surface
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path('app/bot/handlers.py').read_text(encoding='utf-8')
          tree = ast.parse(src)
          funcs = {n.name for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          required = {'start', 'admins', 'my_shifts', 'my_stats', 'is_owner', 'owner_menu_dispatch'}
          missing = required - funcs
          assert not missing, f'Missing handlers: {sorted(missing)}'
          assert '"📅 Ежедневная сводка"' in src
          assert 'callback.from_user.id' in src
          print('Handler surface OK:', ', '.join(sorted(required)))
          PY

      - name: Commit repaired handlers
        run: |
          if git diff --quiet -- app/bot/handlers.py; then
            echo 'No handler repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/bot/handlers.py
          git commit -m 'Repair handler surface and callback actor context'
          git push
