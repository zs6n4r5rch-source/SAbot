name: Add deep stats endpoint
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/add_deep_stats_endpoint.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/add_deep_stats_endpoint.py
      - name: Commit patch
        run: |
          git config user.name 'strike-arena-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/webapp/app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Expose deep statistics API'
          git push
