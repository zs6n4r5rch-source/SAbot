name: Render health monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render health endpoint
        run: |
          set -eu
          url="https://strike-arena.onrender.com/healthz"
          for attempt in 1 2 3; do
            echo "Health check attempt ${attempt}: ${url}"
            if curl --fail --silent --show-error --location --max-time 30 --output /dev/null --write-out 'HTTP %{http_code} in %{time_total}s\n' "$url"; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          echo "Render health check failed after 3 attempts"
          exit 1
