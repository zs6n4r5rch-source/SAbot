name: Connect unified statistics API

on:
  push:
    branches: [main]
    paths:
      - 'app/webapp/statistics_api.py'
      - '.github/workflows/connect-statistics-api.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect router
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/webapp/app.py')
          text = p.read_text()
          marker = 'from app.webapp.statistics_api import router as statistics_router\napp.include_router(statistics_router)\n'
          if marker not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '\n' + marker
              p.write_text(text)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/webapp/app.py
          git diff --cached --quiet || git commit -m 'Connect unified statistics API'
          git push
