name: P0 E2E patch

on:
  push:
    branches: [fix/p0-shift-salary-e2e]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply P0 changes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Fix accidental model default: quantity is data, min_stock is the critical threshold.
          p = Path('app/models/base.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('quantity: Mapped[Decimal] = mapped_column(Numeric(14, 3), default=0, server_default="5")',
                        'quantity: Mapped[Decimal] = mapped_column(Numeric(14, 3), default=0, server_default="0")')
          p.write_text(s, encoding='utf-8')

          p = Path('app/webapp/app.py')
          s = p.read_text(encoding='utf-8')
          marker = '\n\nclass PenaltyRequest(BaseModel):'
          if '/api/my-shift' not in s:
              block = r'''

class ShiftCloseStockPayload(BaseModel):
    product_id: int
    actual_quantity: float
    comment: str = Field(default="", max_length=4000)


class ShiftClosePayload(BaseModel):
    actual_cash: float
    stock_items: list[ShiftCloseStockPayload] = Field(default_factory=list)
    cash_comment: str = Field(default="", max_length=4000)
    cleaning_performed_by: str = Field(default="", max_length=255)


@app.get("/api/my-shift")
async def my_shift(request: Request):
    user, _ = await current_user(request)
    if user.role != UserRole.ADMIN.value or not user.employee_id:
        raise HTTPException(403, "ADMIN access required")
    # LANGAME remains the source of truth for whether the working shift itself is open.
    from app.bot.salary import sync_shifts_data
    await sync_shifts_data()
    async with SessionLocal() as session:
        result = await session.execute(
            select(Shift).where(Shift.employee_id == user.employee_id).order_by(Shift.started_at.desc()).limit(1)
        )
        shift = result.scalar_one_or_none()
        if shift is None:
            return {"state": "none"}
        report = await session.scalar(select(__import__('app.models', fromlist=['ShiftCloseReport']).ShiftCloseReport).where(
            __import__('app.models', fromlist=['ShiftCloseReport']).ShiftCloseReport.shift_id == shift.id
        ))
        state = "open" if shift.ended_at is None else ("closed" if report and report.status == "submitted" else "awaiting_report")
        return {
            "state": state, "id": shift.id, "langame_shift_id": shift.langame_shift_id,
            "started_at": iso(shift.started_at), "ended_at": iso(shift.ended_at),
            "cash_sales": dec(shift.cash_sales), "card_sales": dec(shift.card_sales),
            "mobile_sales": dec(shift.mobile_sales), "refunds_cash": dec(shift.refunds_cash),
            "refunds_card": dec(shift.refunds_card), "collection": dec(shift.collection),
            "actual_cash": dec(shift.actual_cash), "cash_difference": dec(shift.cash_difference),
            "report_id": report.id if report else None,
            "report_status": report.status if report else None,
        }


@app.get("/api/my-shift-close")
async def my_shift_close(request: Request):
    user, _ = await current_user(request)
    if user.role != UserRole.ADMIN.value or not user.employee_id:
        raise HTTPException(403, "ADMIN access required")
    from app.bot.salary import sync_shifts_data
    await sync_shifts_data()
    from app.bot.shift_closing import _load_langame_stock, _get_or_create_report
    from app.models import ShiftCloseReport, ShiftCloseStockItem, Product
    async with SessionLocal() as session:
        shift = (await session.execute(select(Shift).where(Shift.employee_id == user.employee_id).order_by(Shift.started_at.desc()).limit(1))).scalar_one_or_none()
        if shift is None:
            raise HTTPException(404, "Shift not found")
        report = await _get_or_create_report(session, shift)
        expected = await _load_langame_stock(shift, session) if shift.status == "closed" else []
        await session.commit()
        return {
            "shift": {"id": shift.id, "langame_shift_id": shift.langame_shift_id, "started_at": iso(shift.started_at), "ended_at": iso(shift.ended_at)},
            "report": {"id": report.id, "status": report.status, "cash_expected": dec(report.cash_expected), "cash_actual": dec(report.cash_actual), "cash_difference": dec(report.cash_difference), "stock_discrepancies_count": report.stock_discrepancies_count or 0, "cleaning_required": False},
            "expected_stock": expected,
        }


@app.post("/api/my-shift-close")
async def submit_my_shift_close(request: Request, payload: ShiftClosePayload):
    user, _ = await current_user(request)
    if user.role != UserRole.ADMIN.value or not user.employee_id:
        raise HTTPException(403, "ADMIN access required")
    from app.bot.salary import sync_shifts_data
    from app.bot.shift_closing import _load_langame_stock, _get_or_create_report, cleaning_required_for_shift, _submit_report, _money, _qty
    from app.models import ShiftCloseStockItem, Product
    await sync_shifts_data()
    async with SessionLocal() as session:
        shift = (await session.execute(select(Shift).where(Shift.employee_id == user.employee_id).order_by(Shift.started_at.desc()).limit(1))).scalar_one_or_none()
        if shift is None:
            raise HTTPException(404, "Shift not found")
        if shift.ended_at is None or shift.status != "closed":
            raise HTTPException(409, "Смена ещё открыта в LANGAME. Сначала завершите смену там.")
        report = await _get_or_create_report(session, shift)
        if report.status == "submitted":
            return {"ok": True, "state": "already_submitted", "report_id": report.id, "shift_id": shift.id, "cash_difference": dec(report.cash_difference)}
        if report.cash_expected is None:
            report.cash_expected = _money((shift.cash_sales or 0) - (shift.refunds_cash or 0) - (shift.collection or 0))
        report.cash_actual = _money(payload.actual_cash)
        report.cash_difference = _money(report.cash_actual - _money(report.cash_expected))
        shift.actual_cash = report.cash_actual
        shift.cash_difference = report.cash_difference
        report.cash_comment = payload.cash_comment.strip()[:4000] or None

        expected = await _load_langame_stock(shift, session)
        supplied = {int(x.product_id): x for x in payload.stock_items}
        missing = [x for x in expected if int(x['product_id']) not in supplied]
        if missing:
            raise HTTPException(400, {"message": "Укажите фактический остаток по всем товарам.", "missing": missing})
        for item in expected:
            data = supplied[int(item['product_id'])]
            row = await session.scalar(select(ShiftCloseStockItem).where(ShiftCloseStockItem.report_id == report.id, ShiftCloseStockItem.product_id == int(item['product_id'])))
            if row is None:
                row = ShiftCloseStockItem(report_id=report.id, product_id=int(item['product_id']), langame_quantity=_qty(item['expected']))
                session.add(row)
            row.actual_quantity = _qty(data.actual_quantity)
            row.difference = row.actual_quantity - row.langame_quantity
            row.comment = data.comment.strip()[:4000] or None
        report.stock_items_count = len(expected)
        report.stock_discrepancies_count = sum(1 for x in supplied.values() if _qty(x.actual_quantity) != next(e['expected'] for e in expected if int(e['product_id']) == int(x.product_id)) )
        if await cleaning_required_for_shift(session, shift):
            if not payload.cleaning_performed_by.strip():
                raise HTTPException(400, "Для этой смены нужно указать, кто выполнил уборку.")
            report.cleaning_confirmed_at = datetime.now(timezone.utc)
            report.cleaning_performed_by = payload.cleaning_performed_by.strip()[:255]
        await _submit_report(session, report, shift, user.telegram_id)
        await session.commit()
        return {"ok": True, "state": "submitted", "report_id": report.id, "shift_id": shift.id, "cash_expected": dec(report.cash_expected), "cash_actual": dec(report.cash_actual), "cash_difference": dec(report.cash_difference), "stock_discrepancies_count": report.stock_discrepancies_count or 0, "cleaning_performed_by": report.cleaning_performed_by}
'''
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding='utf-8')

          # UX copy: violations are personnel/control, not operations.
          p = Path('app/webapp/static/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("['Операции','Бар и контроль смен',['▣','Бар и снеки','Остатки и критические позиции',inventory],['!','Штрафы','Нарушения и решения',penalties]]",
                        "['Операции','Бар и контроль',['▣','Бар и снеки','Остатки и критические позиции',inventory]],['Люди','Сотрудники и контроль',['👥','Администраторы','Управление доступом',admins],['!','Нарушения','Нарушения и решения',penalties]]")
          s = s.replace("['✓','Закрытие смены','Завершить рабочий день',()=>alert('Закрытие смены выполняется через рабочий экран бота.')]]",
                        "['✓','Закрытие смены','Завершить рабочий день',closeShift]]")
          if 'async function closeShift()' not in s:
              anchor = '\nfunction goNav(which)'
              fn = r'''
async function closeShift(){
  clear();setBottom(false);back();
  try{
    const d=await api('/api/my-shift');
    if(d.state==='none'){root.insertAdjacentHTML('beforeend',card('Смена','Нет смены за текущим период.'));return}
    if(d.state==='open'){root.insertAdjacentHTML('beforeend',card('Смена открыта',`<div class="row"><div class="row-main"><div class="row-title">Смена #${d.langame_shift_id}</div><div class="row-sub">${d.started_at||''}</div></div><div class="row-value">В работе</div></div><p class="muted">Завершение самой смены выполняется в LANGAME. После этого здесь появится отчёт о закрытии.</p>`));return}
    if(d.state==='closed'&&d.report_status==='submitted'){root.insertAdjacentHTML('beforeend',card('Смена закрыта',`<p>Отчёт уже принят.</p>${row('Разница по кассе',money(d.cash_difference))}`));return}
    const close=await api('/api/my-shift-close');
    let stock=close.expected_stock||[];
    root.innerHTML=`<section class="hero"><div class="eyebrow">Закрытие</div><div class="hero-title">Отчёт по смене #${close.shift.langame_shift_id}</div><div class="hero-sub">Сначала фактическая касса, затем остатки.</div></section><section class="card"><label>Фактическая наличность, ₽</label><input id="close-cash" type="number" min="0" step="0.01" value="${close.report.cash_expected||0}"><label>Комментарий по кассе</label><textarea id="close-cash-comment" placeholder="Необязательно"></textarea></section><section class="card"><div class="section-title"><h2>Остатки товаров</h2><span>${stock.length} поз.</span></div>${stock.map(x=>`<label>${x.name} · LANGAME ${x.expected}</label><input class="close-stock" data-product="${x.product_id}" data-expected="${x.expected}" type="number" min="0" step="0.001" placeholder="Факт"></input>`).join('')}</section><button id="submit-close" class="primary">Принять отчёт</button>`;
    document.getElementById('submit-close').onclick=async()=>{try{const items=[...document.querySelectorAll('.close-stock')].map(x=>({product_id:Number(x.dataset.product),actual_quantity:Number(x.value)}));if(items.some(x=>!Number.isFinite(x.actual_quantity))){alert('Заполните фактический остаток по всем товарам.');return}const r=await api('/api/my-shift-close',{method:'POST',body:JSON.stringify({actual_cash:Number(document.getElementById('close-cash').value),stock_items:items,cash_comment:document.getElementById('close-cash-comment').value})});root.innerHTML=card('Смена закрыта',`${row('Разница по кассе',money(r.cash_difference))}${row('Расхождения товаров',r.stock_discrepancies_count)}`)}catch(e){fail(e)}};
  }catch(e){fail(e)}
}
'''
              s = s.replace(anchor, '\n'+fn+anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate and test
        run: |
          python -m compileall -q app tests
          python - <<'PY'
          from app.models import SalaryPeriod, SalaryViolation, ShiftCloseReport
          assert SalaryPeriod and SalaryViolation and ShiftCloseReport
          print('P0 model surface OK')
          PY
          pytest -q
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/p0-e2e-patch.yml
          git add app/models/base.py app/webapp/app.py app/webapp/static/index.html .github/workflows/p0-e2e-patch.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Implement P0 shift report flow and fix UX IA'
          git push
