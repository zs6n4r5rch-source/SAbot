name: Min stock diagnostic

on:
  push:
    branches: [main, 'fix/**', 'diag/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sabot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sabot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sabot
      LANGAME_API_KEY: ci-test-key
      TELEGRAM_BOT_TOKEN: "000000000:ci-test-token"
      OWNER_TELEGRAM_IDS: "1"
      LANGAME_READ_ONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run minimal min_stock diagnostic
        run: python min_stock_diag.py

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: min-stock-diagnostic
          path: min-stock-diagnostic.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Post diagnostic as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f min-stock-diagnostic.txt ]; then
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f "body=$(cat min-stock-diagnostic.txt)"
          else
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f "body=Diagnostic script did not produce min-stock-diagnostic.txt"
          fi
