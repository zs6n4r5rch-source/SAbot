<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strike Arena · Глубокая статистика</title><script src="https://telegram.org/js/telegram-web-app.js?63"></script><style>
:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#0d0f12);--s:var(--tg-theme-secondary-bg-color,#171a20);--s2:var(--tg-theme-section-bg-color,#1d2129);--t:var(--tg-theme-text-color,#f5f7fa);--m:var(--tg-theme-hint-color,#8b929e);--a:#8b5cf6;--g:#22c55e;--line:rgba(255,255,255,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(32px + env(safe-area-inset-bottom))}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title{font-size:22px;font-weight:850}.sub{font-size:12px;color:var(--m);margin-top:4px}.btn{border:1px solid var(--line);background:var(--s);color:var(--t);border-radius:13px;padding:10px 12px;font-weight:750}.period{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.period button{border:1px solid var(--line);background:var(--s);color:var(--m);border-radius:12px;padding:10px;font-weight:750}.period button.active{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.45);color:#c4b5fd}.card{background:var(--s);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.h{font-size:14px;font-weight:800;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{background:var(--s2);border-radius:13px;padding:11px}.kl{font-size:10px;color:var(--m)}.kv{font-size:19px;font-weight:850;margin-top:4px}.good{color:var(--g)}.muted{color:var(--m)}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.row:last-child{border-bottom:0}.badge{font-size:10px;padding:4px 7px;border-radius:999px;background:var(--s2);color:var(--m)}.ok{color:#4ade80}.na{color:#f5b84b}.note{font-size:11px;color:var(--m);line-height:1.45}.error{color:#ff6b6b}.bar{height:8px;border-radius:999px;background:var(--s2);overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#22c55e);border-radius:999px}
</style></head><body><div class="wrap"><div class="head"><div><div class="title">Глубокая статистика</div><div class="sub" id="periodLabel">последние 30 дней · LANGAME</div></div><button class="btn" onclick="load()">↻</button></div><div class="period"><button data-d="7">7 дней</button><button data-d="30" class="active">30 дней</button><button data-d="90">90 дней</button></div><div id="root"></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const headers={'X-Telegram-Init-Data':tg?.initData||''};let days=30;const root=document.getElementById('root');document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{days=+b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('active',x===b));load()});
async function api(){const r=await fetch('/api/analytics?days='+days,{headers});if(!r.ok)throw new Error(await r.text());return r.json()}function money(x){return Number(x||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽'}function n(x){return Number(x||0).toLocaleString('ru-RU',{maximumFractionDigits:2})}function val(o,...keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return null}
function metric(label,value,cls=''){return `<div class="k"><div class="kl">${label}</div><div class="kv ${cls}">${value}</div></div>`}
function render(d){const rows=d.sales_rows||[],rank=d.ranking||[];let sales=0,units=0,tariffCount=0,purchasedHours=0,tariffs={};for(const r of rows){const cancel=Number(r.cancel||0);if(cancel===1)continue;const q=Number(val(r,'count','quantity')||0);const p=Number(val(r,'price_sale','price')||0);sales+=q*p;units+=q;const tariff=val(r,'tariff_name','tariff','package_name','rate_name','name');const hours=Number(val(r,'hours','hour_count','duration_hours')||0);const minutes=Number(val(r,'minutes','duration_minutes')||0);if(tariff){tariffCount+=q;tariffs[tariff]=(tariffs[tariff]||0)+q}if(hours)purchasedHours+=q*hours;else if(minutes)purchasedHours+=q*minutes/60}
const adminHours=rank.reduce((s,x)=>s+Number(x.hours||0),0),adminSales=rank.reduce((s,x)=>s+Number(x.sales||0),0),salesPerHour=adminHours?adminSales/adminHours:0;const tariffRows=Object.entries(tariffs).sort((a,b)=>b[1]-a[1]).slice(0,12);root.innerHTML=`<div class="card"><div class="h">Экономика времени</div><div class="grid">${metric('Продажи товаров',money(sales))}${metric('Продано единиц',n(units))}${metric('Часы администраторов',n(adminHours))}${metric('Продажи / час админа',money(salesPerHour),'good')}</div></div><div class="card"><div class="h">Тарифы и купленные часы</div>${tariffCount?`<div class="grid">${metric('Продано тарифов',n(tariffCount))}${metric('Куплено часов',n(purchasedHours),'good')}</div><div style="margin-top:12px">${tariffRows.map(([name,q])=>`<div class="row"><span>${name}</span><b>${n(q)}</b></div>`).join('')}</div>`:`<div class="note">В текущем ответе LANGAME нет полей покупки/активации тарифов. Я не подменяю их продажами товаров — поэтому показатель честно помечен как недоступный. В API клиенте сейчас подключён только read-only набор методов, включая продажи товаров и поиск гостей.</div>`}</div><div class="card"><div class="h">Возвращаемость гостей</div><div class="note">Rolling Retention и Sticky Factor — отдельные метрики LANGAME. Они требуют данных регистрации + последующих сессий по гостю. Текущий API-слой бота их пока не получает, поэтому здесь не показывается выдуманный процент.</div><div class="row"><span>Rolling Retention</span><span class="badge na">ожидает API-источник</span></div><div class="row"><span>Sticky Factor</span><span class="badge na">ожидает API-источник</span></div></div><div class="card"><div class="h">Эффективность администраторов</div>${rank.slice(0,15).map((x,i)=>{const h=Number(x.hours||0),s=Number(x.sales||0),ph=h?s/h:0;return `<div class="row"><span>${i+1}. ${x.name}</span><b>${money(ph)}/ч</b></div>`}).join('')||'<div class="note">Нет данных</div>'}</div><div class="card"><div class="h">Важно</div><div class="note">Стандартный LANGAME Dashboard уже содержит средние чеки, гостей, регистрации, сессии и загрузку устройств. Здесь оставлены глубокие показатели, чтобы не дублировать основной дашборд. Покупки пакетов и Rolling Retention в LANGAME действительно являются отдельными аналитическими отчётами.</div></div>`}
async function load(){document.getElementById('periodLabel').textContent=`последние ${days} дней · LANGAME`;root.innerHTML='<div class="card muted">Загрузка…</div>';try{render(await api())}catch(e){root.innerHTML=`<div class="card error">Не удалось загрузить статистику: ${e.message}</div>`}}load();
</script></body></html>
