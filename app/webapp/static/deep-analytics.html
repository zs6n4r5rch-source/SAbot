<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strike Arena · Статистика</title><script src="https://telegram.org/js/telegram-web-app.js?63"></script><style>
:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#0d0f12);--s:var(--tg-theme-secondary-bg-color,#171a20);--s2:var(--tg-theme-section-bg-color,#1d2129);--t:var(--tg-theme-text-color,#f5f7fa);--m:var(--tg-theme-hint-color,#8b929e);--a:#8b5cf6;--g:#22c55e;--line:rgba(255,255,255,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title{font-size:23px;font-weight:850}.sub{font-size:12px;color:var(--m);margin-top:4px}.btn{border:1px solid var(--line);background:var(--s);color:var(--t);border-radius:13px;padding:10px 12px;font-weight:750}.period{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}.period button{border:1px solid var(--line);background:var(--s);color:var(--m);border-radius:12px;padding:10px 5px;font-weight:750}.period button.active{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.45);color:#c4b5fd}.export{width:100%;border:0;background:linear-gradient(90deg,#8b5cf6,#6d4be8);color:white;border-radius:14px;padding:12px;font-weight:850;margin:4px 0 8px}.card{background:var(--s);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.h{font-size:14px;font-weight:800;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{background:var(--s2);border-radius:13px;padding:11px}.kl{font-size:10px;color:var(--m)}.kv{font-size:18px;font-weight:850;margin-top:4px}.good{color:var(--g)}.muted{color:var(--m)}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.row:last-child{border-bottom:0}.badge{font-size:10px;padding:4px 7px;border-radius:999px;background:var(--s2);color:var(--m)}.note{font-size:11px;color:var(--m);line-height:1.45}.error{color:#ff6b6b}.section{display:flex;justify-content:space-between;align-items:center}.link{color:#c4b5fd;font-size:11px}.bar{height:7px;border-radius:999px;background:var(--s2);overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#22c55e);border-radius:999px}
</style></head><body><div class="wrap"><div class="head"><div><div class="title">Статистика</div><div class="sub" id="periodLabel">30 дней · Strike Arena + LANGAME</div></div><button class="btn" onclick="load()">↻</button></div><div class="period"><button data-d="7">7 дней</button><button data-d="30" class="active">30 дней</button><button data-d="90">90 дней</button><button data-d="all">Всё время</button></div><button class="export" onclick="exportExcel()">Скачать полный Excel-отчёт</button><div id="root"></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const headers={'X-Telegram-Init-Data':tg?.initData||''};let period='30',root=document.getElementById('root');document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{period=b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('active',x===b));load()});function q(){return period==='all'?'days=0':'days='+period}async function api(){const r=await fetch('/api/statistics?'+q(),{headers});if(!r.ok)throw new Error(await r.text());return r.json()}function money(x){return Number(x||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽'}function n(x){return Number(x||0).toLocaleString('ru-RU',{maximumFractionDigits:2})}function hours(a,b){if(!a||!b)return 0;return Math.max(0,(new Date(b)-new Date(a))/3600000)}function render(d){const shifts=d.shifts||[],rank=d.admin_ranking||[],viol=d.violations||[],bon=d.bonuses||[],sal=d.salaries||[],inv=d.inventory||[];const ah=shifts.reduce((s,x)=>s+hours(x.started_at,x.ended_at),0),sp=ah?d.sales/ah:0,pen=viol.reduce((s,x)=>s+Number(x.amount||0),0),salary=sal.reduce((s,x)=>s+Number(x.total||0),0),critical=inv.filter(x=>x.critical).length;const top=rank.slice(0,10);root.innerHTML=`<div class="card"><div class="h">Сводка периода</div><div class="grid"><div class="k"><div class="kl">Продажи</div><div class="kv">${money(d.sales)}</div></div><div class="k"><div class="kl">Продано единиц</div><div class="kv">${n(d.units)}</div></div><div class="k"><div class="kl">Часы смен</div><div class="kv">${n(ah)}</div></div><div class="k"><div class="kl">Продажи / час</div><div class="kv good">${money(sp)}</div></div><div class="k"><div class="kl">Штрафы</div><div class="kv">${money(pen)}</div></div><div class="k"><div class="kl">Зарплата</div><div class="kv">${money(salary)}</div></div><div class="k"><div class="kl">Списания/остатки</div><div class="kv">${n(critical)} крит.</div></div><div class="k"><div class="kl">Смены</div><div class="kv">${n(shifts.length)}</div></div></div></div><div class="card"><div class="section"><div class="h">Администраторы</div><span class="link">рейтинг ₽/ч</span></div>${top.map((x,i)=>{const h=Number(x.hours||0),s=Number(x.sales||0),p=h?s/h:0;return `<div class="row"><span>${i+1}. ${x.name}</span><b>${money(p)}/ч</b></div>`}).join('')||'<div class="note">Нет данных</div>'}</div><div class="card"><div class="h">Смены и контроль</div><div class="row"><span>Закрытых</span><b>${shifts.filter(x=>x.status==='closed').length}</b></div><div class="row"><span>Открытых</span><b>${shifts.filter(x=>x.status==='open').length}</b></div><div class="row"><span>Нарушений</span><b>${viol.length}</b></div><div class="row"><span>Бонусов</span><b>${bon.length}</b></div></div><div class="card"><div class="h">Тарифы и глубокая статистика</div><div class="note">Покупки тарифов, купленные часы, средняя стоимость часа, использование пакетов, Rolling Retention, Sticky Factor, ARPU, частота посещений и реактивация подключаются только из подтверждённых источников LANGAME. Текущий read-only API бота пока не получает эти отчёты, поэтому значения не подменяются продажами.</div></div><div class="card"><div class="h">Источник и неповторяемость</div><div class="note">Этот экран объединяет доступные данные Strike Arena. Стандартные показатели LANGAME Dashboard не копируются сюда как отдельные дубли; глубокие клиентские и тарифные метрики будут добавляться отдельными блоками после подключения соответствующих API-источников.</div></div>`}
async function load(){document.getElementById('periodLabel').textContent=(period==='all'?'Всё время':period+' дней')+' · Strike Arena + LANGAME';root.innerHTML='<div class="card muted">Загрузка статистики…</div>';try{render(await api())}catch(e){root.innerHTML=`<div class="card error">Не удалось загрузить статистику: ${e.message}</div>`}}async function exportExcel(){const r=await fetch('/api/statistics/export?'+q(),{headers});if(!r.ok){alert('Не удалось сформировать Excel');return}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='strike_arena_statistics.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}load();
</script></body></html>
