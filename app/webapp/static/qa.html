<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strike Arena QA</title>
<style>
:root{color-scheme:dark;--bg:#07080b;--panel:#11141a;--line:#292e37;--text:#f4f6f7;--muted:#969da5;--accent:#b7ff32;--bad:#ff6670;--good:#8de45b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px 14px 120px}.wrap{max-width:980px;margin:auto}h1{margin:0 0 6px;font-size:32px}h2{font-size:18px}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 14px;font-weight:750}.toolbar button.active{border-color:var(--accent);color:var(--accent)}.qa-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.pass{color:var(--good)}.fail{color:var(--bad)}.test{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.test:last-child{border:0}.stage{margin-top:16px;border:1px dashed var(--line);border-radius:18px;min-height:480px;overflow:hidden}.stage #app{min-height:480px;padding:16px}.stage .app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 16px}.stage .brand-row{display:flex;gap:10px;align-items:center}.stage .mark{width:22px;height:22px;background:var(--accent);transform:rotate(45deg);border-radius:4px}.stage .brand-name{font-weight:900}.stage .small{font-size:12px;color:var(--muted)}.stage .role{border:1px solid var(--accent);border-radius:999px;padding:6px 9px;color:var(--accent);font-size:11px}.stage .section-head h1{font-size:28px;margin:0}.stage .section-head p{color:var(--muted)}.stage .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stage .stat,.stage .card{background:#171a21;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.stage .stat .label{font-size:11px;color:var(--muted)}.stage .stat .value{font-size:20px;font-weight:900;margin-top:5px}.stage .bottom{position:sticky!important;bottom:0!important;left:auto!important;right:auto!important;transform:none!important;width:100%!important;margin-top:18px}.stage .drawer{position:fixed}.stage button{font:inherit}.stage .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.stage .loading{padding:30px;text-align:center;color:var(--muted)}.stage .empty{padding:20px;text-align:center;color:var(--muted)}.stage .error{padding:14px;border:1px solid rgba(255,102,112,.4);border-radius:14px}.drawer-close{font-size:13px!important}
</style></head><body><main class="wrap"><h1>Strike Arena — QA контур</h1><div class="muted">Изолированная проверка интерфейса без Telegram и без доступа к рабочим данным. Используется реальный <code>app-guard.js</code> текущей ветки.</div>
<div class="toolbar" id="roles"></div><div class="qa-card"><button id="run" style="padding:12px 16px">Запустить полный прогон</button><span id="summary" class="muted" style="margin-left:10px">не запускался</span><div id="results"></div></div>
<div class="stage"><div id="drawerBackdrop" class="drawer-backdrop"></div><aside id="drawer" class="drawer"><h2>Все разделы</h2><div id="drawerBody"></div></aside><div id="app"><div class="loading">QA запускается…</div></div></div></main>
<script>
(function(){'use strict';
var roles=['owner','admin','smm','guest'],current='admin',tests=[];
var fixtures={owner:{role:'owner',revenue:{total:12345,products:3456},kpi:{guests:42,open_shifts:2},items:[{name:'Товар A',quantity:10}]},admin:{role:'admin',open_shifts:2,critical_stock:3,pending_writeoffs:1,open_discrepancies:1,items:[{name:'Товар A',quantity:2,critical:true}]},smm:{role:'smm',guests:42,campaigns:4,telegram_links:12,marketing_consent:9,items:[{name:'Кампания',status:'draft',recipients:9}]},guest:{role:'guest',name:'Тестовый гость',phone:'+7 900 000-00-00',marketing_consent:true}};
var routeKeys={overview:'owner',work:'admin',finance:'owner',warehouse:'admin',crm:'admin',crmSearch:'admin',localLinks:'admin',analytics:'owner',shifts:'admin',previous:'admin',closeReports:'admin',penalties:'admin',salary:'admin',admin:'admin',profiles:'admin',settings:'admin',campaigns:'smm',guest:'guest',warehouseCritical:'admin',warehouseCategories:'admin',warehouseArrivals:'admin',warehouseSales:'admin',warehouseHistory:'admin',warehouseWriteoffs:'admin',warehouseInventories:'admin',warehouseDiscrepancies:'admin'};
var roleAllowed={owner:Object.keys(routeKeys),admin:Object.keys(routeKeys).filter(function(k){return routeKeys[k]==='admin'||k==='overview';}),smm:['overview','crm','crmSearch','localLinks','campaigns'],guest:['overview','guest']};
function test(name,ok,detail){tests.push({name:name,ok:!!ok,detail:detail||''});}
function showTests(){document.getElementById('results').innerHTML=tests.map(function(t){return '<div class="test"><span class="'+(t.ok?'pass':'fail')+'">'+(t.ok?'PASS':'FAIL')+' — '+t.name+'</span><span class="muted">'+(t.detail||'')+'</span></div>';}).join('');var bad=tests.filter(function(t){return !t.ok}).length;document.getElementById('summary').textContent=(tests.length-bad)+'/'+tests.length+' passed';}
function fixture(path){var p=path.split('?')[0];var map={};map['/api/app/overview']=fixtures[current];map['/api/app/work-center']=fixtures[current];map['/api/app/finance']=fixtures.owner;map['/api/app/warehouse']=fixtures.admin;map['/api/app/crm/groups']=fixtures.smm;map['/api/app/crm']=fixtures.smm;map['/api/app/crm/local-links']=fixtures.smm;map['/api/app/analytics']=fixtures.owner;map['/api/app/shifts']=fixtures.admin;map['/api/app/shifts/previous']=fixtures.admin;map['/api/app/shifts/close-reports']=fixtures.admin;map['/api/app/penalties']=fixtures.admin;map['/api/app/salary']=fixtures.admin;map['/api/app/admin/me']=fixtures.admin;map['/api/app/admin/profiles']=fixtures.admin;map['/api/app/settings']=fixtures.admin;map['/api/app/smm/campaigns']=fixtures.smm;map['/api/app/guest/me']=fixtures.guest;Object.keys(map).filter(function(k){return k.indexOf('/api/app/warehouse/')===0;}).forEach(function(k){map[k]=fixtures.admin;});return map[p]||fixtures[current];}
var realFetch=window.fetch;window.fetch=function(input,opts){var url=typeof input==='string'?input:input.url;if(url.indexOf('/api/app/')===0){return Promise.resolve(new Response(JSON.stringify(fixture(url)),{status:200,headers:{'Content-Type':'application/json'}}));}return realFetch.apply(this,arguments);};
window.Telegram={WebApp:{initData:'qa',ready:function(){},expand:function(){}}};
function loadGuard(){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src='app-guard.js?v=qa2';s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}
function visibleNav(){return Array.prototype.map.call(document.querySelectorAll('#app .bottom button'),function(b){return (b.textContent||'').trim();}).filter(Boolean);}
async function start(role){current=role;tests=[];await window.__SA_START_APP__(role);await new Promise(function(r){setTimeout(r,40);});}
async function runRole(role){await start(role);var nav=visibleNav().join('|');var expected=role==='owner'?['Главная','Работа','Финансы','Ещё']:role==='admin'?['Главная','Работа','Склад','Ещё']:role==='smm'?['Главная','Работа','CRM','Ещё']:['Главная','Профиль','Ещё'];test(role.toUpperCase()+': роль',document.querySelector('#app .role')&&document.querySelector('#app .role').textContent.trim()===role.toUpperCase(),nav);test(role.toUpperCase()+': нижняя навигация',expected.every(function(x){return nav.indexOf(x)>=0})&&nav.indexOf('Финансы')===-1||role==='owner',nav);
var more=document.querySelector('#app [data-more]');test(role.toUpperCase()+': кнопка «Ещё»',!!more);if(more){more.click();await new Promise(function(r){setTimeout(r,10);});test(role.toUpperCase()+': drawer открывается',document.getElementById('drawer').classList.contains('open'));var close=document.querySelector('#drawer [data-drawer-close]');if(close){close.click();}else{document.getElementById('drawerBackdrop').click();}await new Promise(function(r){setTimeout(r,10);});test(role.toUpperCase()+': drawer закрывается',!document.getElementById('drawer').classList.contains('open'));}
var expectedRoutes=roleAllowed[role]||[];expectedRoutes.slice(0,Math.min(8,expectedRoutes.length)).forEach(function(p){test(role.toUpperCase()+': маршрут '+p,!!window.__SA_QA_CAN__?window.__SA_QA_CAN__(role,p):true);});
}
async function run(){tests=[];for(var i=0;i<roles.length;i++){await runRole(roles[i]);}showTests();}
document.getElementById('roles').innerHTML=roles.map(function(r){return '<button class="'+(r===current?'active':'')+'" data-role="'+r+'">'+r.toUpperCase()+'</button>';}).join('');document.querySelectorAll('[data-role]').forEach(function(b){b.onclick=function(){current=b.dataset.role;document.querySelectorAll('[data-role]').forEach(function(x){x.classList.toggle('active',x===b);});start(current).then(showTests);};});
loadGuard().then(function(){run();}).catch(function(e){document.getElementById('summary').textContent='QA bootstrap failed: '+e.message;});document.getElementById('run').onclick=run;
})();
</script></body></html>
