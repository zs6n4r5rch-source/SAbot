<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>SMM</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#11131a;color:#f5f6fa;margin:0;padding:18px}h1{font-size:24px}.card{background:#1b1e28;border-radius:16px;padding:16px;margin:12px 0}.muted{color:#9da3b4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{font-size:24px;font-weight:700}.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:13px;background:#2b6cff;color:#fff;font-size:15px;margin-top:10px}.task{padding:10px 0;border-bottom:1px solid #303442}</style></head><body><h1>📱 SMM кабинет</h1><div id="app">Загрузка…</div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const H={'X-Telegram-Init-Data':tg?.initData||''};async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H,'Content-Type':'application/json',...(o.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.json()}async function load(){try{const [me,a,t]=await Promise.all([api('/api/smm/me'),api('/api/smm/analytics?days=30'),api('/api/smm/tasks?days=30')]);document.getElementById('app').innerHTML=`<div class="card"><b>${me.display_name}</b><div class="muted">Роль: SMM</div><div class="muted">Доступ: ${me.analytics.join(', ')}</div></div><div class="grid"><div class="card"><div class="muted">Задач</div><div class="k">${a.tasks}</div></div><div class="card"><div class="muted">Подтверждено</div><div class="k">${a.approved_tasks}</div></div><div class="card"><div class="muted">Начислено</div><div class="k">${a.earned} ₽</div></div><div class="card"><div class="muted">Кампаний</div><div class="k">${a.campaigns??'—'}</div></div></div><div class="card"><b>Мои работы</b>${t.items.map(x=>`<div class="task"><b>#${x.id} ${x.title}</b><br><span class="muted">${x.quantity} ${x.unit} × ${x.rate} ₽ · ${x.amount} ₽ · ${x.status}</span></div>`).join('')||'<div class="muted">Пока нет работ</div>'}</div>`}catch(e){document.getElementById('app').innerHTML='<div class="card">Нет доступа или Telegram-авторизация недоступна.</div>'}}load()</script></body></html>
