<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SAbot</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{--bg:var(--tg-theme-bg-color,#0f1115);--card:var(--tg-theme-secondary-bg-color,#191c22);--text:var(--tg-theme-text-color,#f5f7fa);--muted:var(--tg-theme-hint-color,#8d95a3);--line:var(--tg-theme-section-separator-color,#292e37);--accent:#8b5cf6;--good:#36d27b;--warn:#f5b84b;--bad:#ff6363}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:850;font-size:20px}.sub,.hint{color:var(--muted);font-size:12px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.hero{background:linear-gradient(145deg,rgba(139,92,246,.2),var(--card))}.hero h1{margin:4px 0;font-size:27px}.eyebrow{color:#b9a3ff;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}.value{font-size:22px;font-weight:850;margin-top:5px}.section{font-weight:850;margin:20px 2px 8px}.btn{width:100%;border:0;background:transparent;color:var(--text);text-align:left;padding:13px 4px;border-bottom:1px solid var(--line);font-weight:750}.btn:last-child{border-bottom:0}.btn small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.primary,.secondary{width:100%;padding:13px;border-radius:13px;font-weight:800}.primary{border:0;background:var(--accent);color:white}.secondary{border:1px solid var(--line);background:var(--card);color:var(--text)}.back{border:0;background:none;color:var(--muted);padding:5px 0;font-weight:750}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#242933;color:var(--muted);font-size:11px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.empty{text-align:center;padding:25px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--line);padding:8px calc(10px + env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}.bottom>div{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav{border:0;background:transparent;color:var(--muted);padding:8px 4px;font-size:11px;font-weight:750}.nav.active{color:var(--text);background:var(--card);border-radius:12px}.nav span{display:block;font-size:17px;margin-bottom:2px}input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);margin:6px 0 10px}@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">SAbot</div><div class="sub" id="who">Загрузка…</div></div><button class="secondary" style="width:auto;padding:9px 12px" onclick="go('home')">⌂</button></div><div id="app"></div></main><nav class="bottom"><div><button class="nav active" id="n-home" onclick="go('home')"><span>⌂</span>Summary</button><button class="nav" id="n-work" onclick="go('work')"><span>◈</span>Work Center</button><button class="nav" id="n-crm" onclick="go('crm')"><span>♙</span>CRM</button></div></nav><script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand()} const app=document.getElementById('app'); const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m])); const money=v=>v==null?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(v)+' ₽'; const api=async p=>{const r=await fetch('/api/app/'+p,{headers:{'X-Telegram-Init-Data':tg?.initData||''}});if(!r.ok)throw new Error(await r.text());return r.json()};
function nav(active){['home','work','crm'].forEach(x=>document.getElementById('n-'+x)?.classList.toggle('active',x===active))}
async function go(page){nav(page==='home'?'home':page==='work'?'work':'crm');try{if(page==='home')return home();if(page==='work')return work();if(page==='crm')return crm();}catch(e){app.innerHTML='<div class="card bad">Ошибка: '+esc(e.message)+'</div>'}}
async function home(){const d=await api('overview');document.getElementById('who').textContent=d.role||'Пользователь';app.innerHTML=`<section class="hero"><div class="eyebrow">TODAY</div><h1>${d.club.status==='ok'?'Клуб работает':'Данные LANGAME недоступны'}</h1><div class="sub">Активных сессий: ${d.club.active_sessions||0}</div></section><div class="grid"><div class="kpi"><div class="hint">Товарная выручка</div><div class="value">${money(d.revenue.products)}</div></div><div class="kpi"><div class="hint">Продано единиц</div><div class="value">${d.revenue.product_units??'—'}</div></div><div class="kpi"><div class="hint">Гости</div><div class="value">${d.kpi.guests??'—'}</div></div><div class="kpi"><div class="hint">Критический склад</div><div class="value ${d.attention.length?'bad':'good'}">${d.attention.length?d.attention[0].count:0}</div></div></div><div class="section">Требует внимания</div><div class="card">${d.attention.length?d.attention.map(x=>`<button class="btn" onclick="go('warehouse')">🔴 ${esc(x.title)}<small>${x.count} позиций требуют проверки</small></button>`).join(''):'<div class="good">✓ Критичных проблем не найдено</div>'}</div><div class="section">Быстрый доступ</div><div class="card"><button class="btn" onclick="go('work')">Work Center<small>Зал · Гости · Финансы · Склад · Контроль</small></button><button class="btn" onclick="go('crm')">CRM<small>Группы · гости · профили</small></button></div>`}
async function work(){const d=await api('work-center');app.innerHTML=`<button class="back" onclick="go('home')">← Summary</button><div class="hero"><div class="eyebrow">WORK CENTER</div><h1>Центр управления</h1><div class="sub">Открытых смен: ${d.open_shifts} · Критичный склад: ${d.critical_stock}</div></div><div class="card">${[['hall','🖥','Зал','Состояние клуба и сессии'],['guests','♙','Гости и лояльность','Группы и реальные гости'],['finance','₽','Финансы','Выручка, себестоимость, результат'],['warehouse','▣','Склад','Категории, остатки, критичные позиции'],['previous','◷','Предыдущая смена','Итоги последней закрытой смены'],['control','✓','Контроль','Штрафы и административные действия']].map(x=>`<button class="btn" onclick="go('${x[0]}')">${x[1]} ${x[2]}<small>${x[3]}</small></button>`).join('')}</div>`}
async function crm(){const d=await api('crm/groups');app.innerHTML=`<button class="back" onclick="go('home')">← Summary</button><div class="hero"><div class="eyebrow">CRM</div><h1>Гости и лояльность</h1><div class="sub">Группы загружаются непосредственно из LANGAME.</div></div><div class="card">${d.items.length?d.items.map(g=>`<button class="btn" onclick="group(${Number(g.id)})">${esc(g.name)}<small>${g.count==null?'Количество не подтверждено':g.count+' гостей'}</small></button>`).join(''):'<div class="empty">Группы не найдены</div>'}</div>`}
async function group(id){const d=await api('crm/groups/'+id+'/guests');app.innerHTML=`<button class="back" onclick="go('crm')">← CRM</button><div class="section">Гости группы</div><div class="card">${d.items.length?d.items.map(g=>{const id=g.guest_id??g.id;return `<button class="btn" onclick="guest(${Number(id)})">${esc(g.fio||g.name||('Гость #'+id))}<small>${esc(g.phone||'')} · ID ${esc(id)}</small></button>`}).join(''):'<div class="empty">В группе нет гостей или LANGAME не вернул список.</div>'}</div>`}
async function guest(id){const d=await api('crm/guests/'+id);const g=d.guest||{};app.innerHTML=`<button class="back" onclick="go('crm')">← CRM</button><div class="hero"><div class="eyebrow">GUEST PROFILE</div><h1>${esc(g.fio||'Гость #'+id)}</h1><div class="sub">ID ${esc(g.guest_id||id)} · ${esc(g.phone||'')}</div></div><div class="grid"><div class="kpi"><div class="hint">Баланс</div><div class="value">${money(g.balance)}</div></div><div class="kpi"><div class="hint">Бонусы</div><div class="value">${money(g.bonus_balance)}</div></div></div><div class="section">История сессий</div><div class="card">${d.sessions?.length?d.sessions.slice(0,30).map(s=>`<div class="row"><div>${esc(s.started_at||s.start_at||'Сессия')}</div><div>${esc(s.ended_at||s.end_at||'—')}</div></div>`).join(''):'<div class="empty">Сессии не найдены</div>'}</div>`}
async function finance(){const d=await api('finance?days=30');app.innerHTML=`<button class="back" onclick="go('work')">← Work Center</button><div class="hero"><div class="eyebrow">FINANCE · 30 DAYS</div><h1>${money(d.revenue.total)}</h1><div class="sub">Подтверждённая товарная выручка</div></div><div class="grid"><div class="kpi"><div class="hint">Товары</div><div class="value">${money(d.products.revenue)}</div></div><div class="kpi"><div class="hint">Себестоимость</div><div class="value">${money(d.products.cogs)}</div></div><div class="kpi"><div class="hint">Прибыль</div><div class="value">${money(d.products.profit)}</div></div><div class="kpi"><div class="hint">Маржа</div><div class="value">${d.products.margin==null?'—':d.products.margin.toFixed(1)+'%'}</div></div></div><div class="card"><div class="hint">Не подтверждено текущим контрактом</div><div class="row"><b>Gaming</b><b>—</b></div><div class="row"><b>Прочие расходы</b><b>—</b></div></div>`}
async function warehouse(){const d=await api('warehouse');const groups={};d.items.forEach(x=>{const n=x.category_name||x.category||x.group_name||'Без категории';(groups[n]??=[]).push(x)});app.innerHTML=`<button class="back" onclick="go('work')">← Work Center</button><div class="hero"><div class="eyebrow">WAREHOUSE</div><h1>Склад</h1><div class="sub">Источник: LANGAME</div></div>${Object.entries(groups).map(([n,items])=>`<div class="section">${esc(n)} <span class="badge">${items.length}</span></div><div class="card">${items.slice(0,50).map(x=>`<div class="row"><div>${esc(x.name||x.product_name||x.title||'Товар')}<div class="hint">${esc(x.club_name||'')}</div></div><b>${esc(x.quantity??x.amount??'—')}</b></div>`).join('')}</div>`).join('')||'<div class="empty">Склад не найден</div>'}`}
async function previous(){const d=await api('shifts/previous');app.innerHTML=`<button class="back" onclick="go('work')">← Work Center</button><div class="section">Предыдущая смена</div><div class="card">${d.item?`<div class="row"><b>Администратор</b><span>${esc(d.item.employee||'—')}</span></div><div class="row"><b>Период</b><span>${esc(d.item.started_at)} — ${esc(d.item.ended_at)}</span></div><div class="row"><b>Разница кассы</b><span>${money(d.item.cash_difference)}</span></div>`:'<div class="empty">Закрытых смен нет</div>'}</div>`}
async function control(){app.innerHTML=`<button class="back" onclick="go('work')">← Work Center</button><div class="hero"><div class="eyebrow">CONTROL</div><h1>Контроль</h1></div><div class="card"><button class="btn">⚠️ Штрафы<small>Начисление ранее утверждённых типов — доступно владельцу через административный контур.</small></button></div>`}
async function routeSpecial(p){if(p==='finance')return finance();if(p==='warehouse')return warehouse();if(p==='previous')return previous();if(p==='control')return control();if(p==='hall'){return work()}if(p==='guests')return crm()} const oldGo=go; go=async p=>{if(['finance','warehouse','previous','control','hall','guests'].includes(p))return routeSpecial(p);return oldGo(p)};
go('home');
</script></body></html>
