<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Strike Arena</title>
<style>
:root{color-scheme:dark;--bg:#08090c;--card:#111318;--line:rgba(255,255,255,.08);--text:#f5f7f7;--muted:#8e9599;--accent:#b7ff32}
*{box-sizing:border-box}html,body{min-height:100%;background:var(--bg)}body{margin:0;padding:12px 14px 110px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{max-width:980px;margin:auto;min-height:70vh}.loading{text-align:center;color:var(--muted);padding:58px 20px}button{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--card);color:var(--text);font-weight:700}button.primary{background:var(--accent);color:#090a0b;border-color:var(--accent)}button:disabled{opacity:.5}
nav,.actions,.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.actions{flex-wrap:wrap;overflow:visible}.actions button{flex:1;min-width:140px;text-align:left}.top{display:flex;justify-content:space-between;align-items:center;margin:10px 0 18px}.brand{font-size:25px;font-weight:850}.sub,.muted,.small{color:var(--muted)}.sub{font-size:12px}.badge{font-size:11px;padding:6px 9px;border-radius:99px;background:rgba(183,255,50,.12);color:var(--accent)}h1{font-size:30px;margin:8px 0}h2{font-size:18px;margin:22px 0 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card,.item,.error{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.grid .card{min-height:78px}.value{font-size:24px;font-weight:820}.label{font-size:11px;color:var(--muted);text-transform:uppercase}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:12px}.item span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}.notice{margin-top:12px;padding:12px;border-radius:14px;background:#0e1014;color:var(--muted);font-size:13px}.boot-fallback{min-height:70vh;display:grid;place-items:center}.boot-card{width:min(100%,520px);padding:24px;border:1px solid var(--line);border-radius:22px;background:var(--card);text-align:center}.boot-card h1{margin-top:0}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="boot-fallback"><div class="boot-card"><div class="brand">Strike Arena</div><h1>Запуск приложения</h1><p class="muted">Инициализация защищённого контура…</p><div class="loading">Загрузка…</div></div></div></div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var state={page:'overview',role:'',stack:[],ready:false};
var routes={overview:'/api/app/overview',work:'/api/app/work-center',finance:'/api/app/finance',warehouse:'/api/app/warehouse',crm:'/api/app/crm/groups',analytics:'/api/app/analytics',shifts:'/api/app/shifts',previous:'/api/app/shifts/previous',closeReports:'/api/app/shifts/close-reports',penalties:'/api/app/penalties',salary:'/api/app/salary',admin:'/api/app/admin/me',profiles:'/api/app/admin/profiles',settings:'/api/app/settings',campaigns:'/api/app/smm/campaigns',guest:'/api/app/guest/me',crmSearch:'/api/app/crm',localLinks:'/api/app/crm/local-links'};
var names={overview:'Главная',work:'Work Center',finance:'Финансы',warehouse:'Склад',crm:'CRM',analytics:'Аналитика'};
var moreNames={shifts:'Смены',previous:'Предыдущая смена',closeReports:'Закрытия смен',penalties:'Штрафы',salary:'Зарплата',admin:'Контроль администратора',profiles:'Профили доступа',settings:'Настройки',campaigns:'SMM',localLinks:'Telegram / consent',crmSearch:'Поиск гостей',warehouseCritical:'Критические остатки',warehouseCategories:'Категории склада',warehouseArrivals:'Приходы',warehouseSales:'Продажи товаров',warehouseHistory:'История склада',warehouseWriteoffs:'Списания',warehouseInventories:'Инвентаризации',warehouseDiscrepancies:'Расхождения'};
function esc(v){return String(v==null?'':v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];});}
function num(v){if(v==null||v==='')return '—';var x=Number(v);return Number.isFinite(x)?new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(x):esc(v);}
function rub(v){return v==null?'—':num(v)+' ₽';}
function nav(){var s='<nav>';if(state.stack.length)s+='<button data-back type="button">← Назад</button>';Object.keys(names).forEach(function(k){s+='<button type="button" data-page="'+k+'" class="'+(state.page===k?'primary':'')+'">'+names[k]+'</button>';});return s+'</nav>';}
function shell(body){return nav()+'<div class="top"><div><div class="brand">Strike Arena</div><div class="sub">Единый центр управления клубом</div></div><span class="badge">'+esc(String(state.role||'').toUpperCase())+'</span></div>'+body;}
function actions(a){return '<div class="actions">'+a.map(function(x){return '<button type="button" data-open="'+esc(x[0])+'"'+(x[2]?' class="primary"':'')+'>'+esc(x[1])+'</button>';}).join('')+'</div>';}
function list(a,e){return a&&a.length?'<div class="list">'+a.join('')+'</div>':'<div class="notice">'+esc(e||'Нет данных')+'</div>';}
function renderError(e){app.innerHTML=shell('<div class="error"><h1>Раздел недоступен</h1><p class="muted">'+esc(e)+'</p><button class="primary" type="button" data-retry>Повторить</button></div>');bind();signal('error');}
function overview(d){var r=d.revenue||{},k=d.kpi||{};return shell('<h1>Главная</h1><p class="muted">Операционная сводка и контроль клуба</p><div class="grid"><div class="card"><div class="label">Выручка</div><div class="value">'+rub(r.total)+'</div></div><div class="card"><div class="label">Продажи</div><div class="value">'+num(r.product_units)+'</div></div><div class="card"><div class="label">Клиенты</div><div class="value">'+num(k.guests)+'</div></div><div class="card"><div class="label">Открытые смены</div><div class="value">'+num(k.open_shifts)+'</div></div></div><h2>Быстрые действия</h2>'+actions([['work','Work Center',1],['finance','Финансы'],['warehouse','Склад'],['crm','CRM'],['analytics','Аналитика']])+'<div class="notice">LANGAME: '+esc((d.source_status||{}).langame||'—')+' · '+esc(d.timezone||'—')+'</div>');}
function work(d){return shell('<h1>Work Center</h1><p class="muted">Смены, касса, склад, контроль, зарплата и SMM</p><div class="grid"><div class="card"><div class="label">Открытые смены</div><div class="value">'+num(d.open_shifts)+'</div></div><div class="card"><div class="label">Критический склад</div><div class="value">'+num(d.critical_stock)+'</div></div><div class="card"><div class="label">Ожидают списания</div><div class="value">'+num(d.pending_writeoffs)+'</div></div><div class="card"><div class="label">Расхождения</div><div class="value">'+num(d.open_discrepancies)+'</div></div></div><h2>Разделы</h2>'+actions([['shifts','Смены',1],['previous','Предыдущая смена'],['closeReports','Закрытия смен'],['warehouse','Склад'],['penalties','Штрафы'],['salary','Зарплата'],['admin','Контроль администратора'],['profiles','Профили доступа'],['campaigns','SMM'],['settings','Настройки']])+'</div>');}
function finance(d){var r=d.revenue||{},p=d.products||{},m=d.payments||{};return shell('<h1>Финансы</h1><p class="muted">Последние '+num(d.days)+' дней</p><div class="grid"><div class="card"><div class="label">Итого</div><div class="value">'+rub(r.total)+'</div></div><div class="card"><div class="label">Товары</div><div class="value">'+rub(r.products)+'</div></div><div class="card"><div class="label">Единиц</div><div class="value">'+num(p.units)+'</div></div><div class="card"><div class="label">Разница кассы</div><div class="value">'+rub(m.cash_difference)+'</div></div></div><h2>Платежи</h2><div class="card"><div class="stat"><span>Наличные</span><b>'+rub(m.cash)+'</b></div><div class="stat"><span>Карта</span><b>'+rub(m.card)+'</b></div><div class="stat"><span>Безнал</span><b>'+rub(m.mobile)+'</b></div></div>');}
function warehouse(d){var a=d.items||[];return shell('<h1>Склад</h1><p class="muted">Остатки и движение</p>'+actions([['warehouse','Остатки',1],['warehouseCritical','Критические'],['warehouseCategories','Категории'],['warehouseArrivals','Приходы'],['warehouseSales','Продажи'],['warehouseHistory','История'],['warehouseWriteoffs','Списания'],['warehouseInventories','Инвентаризации'],['warehouseDiscrepancies','Расхождения']])+'<h2>Остатки</h2>'+list(a.map(function(x){return '<div class="item"><div><b>'+esc(x.product)+'</b><span>'+esc(x.category||'Без категории')+(x.critical?' · критический':'')+'</span></div><b>'+num(x.quantity)+'</b></div>'; }),'Остатки не найдены'));}
function guest(d){var g=d.guest||d.profile||d;return shell('<h1>Личный кабинет</h1><p class="muted">Гостевой контур Strike Arena</p><div class="card"><div class="stat"><span>Имя</span><b>'+esc(g.name||g.fio||g.first_name||'Гость')+'</b></div><div class="stat"><span>Телефон</span><b>'+esc(g.phone||'—')+'</b></div><div class="stat"><span>Лояльность</span><b>'+esc(g.loyalty_group||g.group||'—')+'</b></div></div>');}
function generic(title,d){var items=d.items||d.admins||d.permissions||d.rows||[];var keys=items.length?Object.keys(items[0]||{}):[];return shell('<h1>'+esc(title)+'</h1><div class="card">'+keys.slice(0,8).map(function(k){return '<div class="stat"><span>'+esc(k)+'</span><b>'+esc(items[0][k])+'</b></div>';}).join('')+'</div>'+list(items.slice(0,80).map(function(x){return '<div class="item"><div><b>'+esc(x.name||x.employee||x.title||x.product||x.id||'Запись')+'</b><span>'+esc(x.status||x.type||x.role||x.category||'')+'</span></div><span>'+esc(x.amount==null?'':x.amount)+'</span></div>'; }),'Нет данных')+'</div>');}
function render(d){if(state.role==='guest'&&state.page==='guest')return guest(d);if(state.page==='overview')return overview(d);if(state.page==='work')return work(d);if(state.page==='finance')return finance(d);if(state.page==='warehouse')return warehouse(d);if(state.page==='crm')return generic('CRM',d);if(state.page==='analytics')return generic('Аналитика',d);return generic(moreNames[state.page]||names[state.page]||'Раздел',d);}
function signal(kind){try{window.dispatchEvent(new CustomEvent('sa:app-state',{detail:{state:kind,role:state.role,page:state.page}}));}catch(e){}}
function bind(){app.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){load(b.dataset.page);};});var back=app.querySelector('[data-back]');if(back)back.onclick=function(){state.page=state.stack.pop()||'overview';load(state.page,true);};var retry=app.querySelector('[data-retry]');if(retry)retry.onclick=function(){load(state.page,true);};app.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){openView(b.dataset.open);};});}
function tg(){return window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;}
async function api(path,params){var t=tg();if(!t)throw Error('Telegram WebApp SDK не загрузился');try{t.ready();t.expand();}catch(e){}if(!t.initData)throw Error('Telegram initData не получен. Откройте Mini App из Telegram.');var q=params?Object.keys(params).filter(function(k){return params[k]!=null&&params[k]!=='';}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&'):'';var r=await fetch(path+(q?'?'+q:''),{headers:{'X-Telegram-Init-Data':t.initData,'Accept':'application/json'},cache:'no-store'}),text=await r.text(),d;try{d=JSON.parse(text);}catch(e){throw Error('Некорректный ответ сервера HTTP '+r.status);}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d;}
async function load(page,back,params){if(!page||!routes[page]){renderError('Раздел не настроен');return true;}if(page!==state.page&&!back)state.stack.push(state.page);state.page=page;signal('loading');app.innerHTML=shell('<div class="loading">Загрузка…</div>');try{var d=await api(routes[page],params);state.role=d.role||state.role;app.innerHTML=render(d);bind();state.ready=true;signal('ready');return true;}catch(e){renderError(e.message||String(e));return true;}}
async function openView(v){var map={shifts:routes.shifts,previous:routes.previous,closeReports:routes.closeReports,penalties:routes.penalties,salary:routes.salary,admin:routes.admin,profiles:routes.profiles,settings:routes.settings,campaigns:routes.campaigns,localLinks:routes.localLinks,crmSearch:routes.crmSearch,warehouseCritical:'/api/app/warehouse/critical',warehouseCategories:'/api/app/warehouse/categories',warehouseArrivals:'/api/app/warehouse/arrivals',warehouseSales:'/api/app/warehouse/sales',warehouseHistory:'/api/app/warehouse/history',warehouseWriteoffs:'/api/app/warehouse/writeoffs',warehouseInventories:'/api/app/warehouse/inventories',warehouseDiscrepancies:'/api/app/warehouse/discrepancies'};if(!map[v]){renderError('Раздел не настроен');return;}state.stack.push(state.page);state.page=v;signal('loading');app.innerHTML=shell('<div class="loading">Загрузка…</div>');try{var d=await api(map[v]);app.innerHTML=shell('<button data-back type="button">← Назад</button><h1>'+esc(moreNames[v]||v)+'</h1>'+list((d.items||d.admins||d.permissions||d.rows||[]).map(function(x){return '<div class="item"><div><b>'+esc(x.employee||x.name||x.title||x.product||('Запись #'+(x.id||'')))+'</b><span>'+esc(x.status||x.type||x.role||x.category||'')+'</span></div><b>'+esc(x.amount==null?'':x.amount)+'</b></div>'; }),'Нет данных'));bind();state.ready=true;signal('ready');}catch(e){renderError(e.message||String(e));}}
window.__SA_START_APP__=async function(role){state.role=role||'';state.ready=false;return await load(state.role==='guest'?'guest':'overview',true);};
window.__SA_APP_READY__=function(){return state.ready;};
signal('booting');
})();
</script>
</body>
</html>
