<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strike Arena</title><style>:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#0b0b10);--card:var(--tg-theme-secondary-bg-color,#17171f);--text:var(--tg-theme-text-color,#f5f5f7);--muted:var(--tg-theme-hint-color,#9b9ba6);--accent:var(--tg-theme-button-color,#6d36ff);--accentText:var(--tg-theme-button-text-color,#fff)}*{box-sizing:border-box}body{margin:0;padding:12px 14px 24px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{max-width:760px;margin:auto}nav{display:flex;gap:7px;overflow:auto;padding-bottom:14px}button{border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--text);font-size:15px;font-weight:600;white-space:nowrap}.active,.primary{background:var(--accent);color:var(--accentText)}h1{font-size:27px;margin:8px 0 4px}h2{font-size:19px;margin:22px 0 10px}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.brand{font-size:24px;font-weight:800}.sub{font-size:13px;color:var(--muted)}.badge{font-size:11px;padding:6px 9px;border-radius:999px;background:var(--card)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.item{background:var(--card);border-radius:16px;padding:15px}.label{font-size:13px;color:var(--muted);margin-bottom:6px}.value{font-size:24px;font-weight:800}.small{font-size:12px;color:var(--muted);margin-top:5px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center}.item b{display:block}.item span{display:block;font-size:13px;color:var(--muted);margin-top:4px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.error{border:1px solid rgba(255,80,80,.4);border-radius:16px;padding:16px}.loading{text-align:center;color:var(--muted);padding:40px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div id="app"><div class="loading">Загрузка…</div></div><script src="https://telegram.org/js/telegram-web-app.js"></script><script>(()=>{const app=document.getElementById('app'),tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}const H=()=>({'X-Telegram-Init-Data':tg?tg.initData:''}),S={page:'overview',role:'',back:[]},R={overview:'/api/app/overview',work:'/api/app/work-center',finance:'/api/app/finance',warehouse:'/api/app/warehouse',crm:'/api/app/crm/groups',analytics:'/api/app/analytics',previous:'/api/app/shifts/previous'},N={overview:'Главная',work:'Work Center',finance:'Финансы',warehouse:'Склад',crm:'CRM',analytics:'Аналитика'};const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]),n=v=>v==null?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(v),m=v=>v==null?'—':n(v)+' ₽';function nav(){return '<nav>'+Object.entries(N).map(([k,v])=>`<button class="${S.page===k?'active':''}" data-p="${k}">${v}</button>`).join('')+'</nav>'}function shell(x){return nav()+`<div class="top"><div><div class="brand">Strike Arena</div><div class="sub">Центр управления клубом</div></div>${S.role?`<span class="badge">${e(S.role.toUpperCase())}</span>`:''}</div>`+(S.back.length?'<button data-back>← Назад</button>':'')+x}function err(x){app.innerHTML=shell(`<div class="error"><h1>Ошибка загрузки</h1><p class="muted">${e(x)}</p><button class="primary" data-retry>Повторить</button></div>`);bind()}function loadView(d){S.role=d.role||S.role;const r=d.revenue||{},k=d.kpi||{},a=d.attention||[],st=d.source_status||{};if(S.page==='overview')return shell(`<h1>Главная</h1><p class="muted">Сводка за сегодня</p><div class="grid"><div class="card"><div class="label">Выручка</div><div class="value">${m(r.total)}</div><div class="small">Товары: ${m(r.products)}</div></div><div class="card"><div class="label">Продажи</div><div class="value">${n(r.product_units)}</div><div class="small">единиц</div></div><div class="card"><div class="label">Клиенты</div><div class="value">${n(k.guests)}</div></div><div class="card"><div class="label">Внимание</div><div class="value">${n(a.reduce((z,x)=>z+(x.count||0),0))}</div><div class="small">критических позиций</div></div></div><h2>Источники</h2><div class="card">LANGAME: <b>${st.langame==='ok'?'доступен':'недоступен'}</b></div>`);if(S.page==='work')return shell(`<h1>Work Center</h1><p class="muted">Операционный контроль клуба</p><div class="grid"><div class="card"><div class="label">Открытые смены</div><div class="value">${n(d.open_shifts)}</div></div><div class="card"><div class="label">Критический склад</div><div class="value">${n(d.critical_stock)}</div></div></div>`);if(S.page==='finance'){const p=d.products||{};return shell(`<h1>Финансы</h1><p class="muted">За ${n(d.days)} дней</p><div class="grid"><div class="card"><div class="label">Выручка</div><div class="value">${m(r.total)}</div></div><div class="card"><div class="label">Товары</div><div class="value">${m(r.products)}</div></div><div class="card"><div class="label">Продано</div><div class="value">${n(p.units)}</div></div></div>`)}if(S.page==='warehouse')return shell(`<h1>Склад</h1><p class="muted">${n((d.items||[]).length)} позиций</p><div class="list">${(d.items||[]).map(x=>`<div class="item"><div><b>${e(x.product)}</b><span>${e(x.category||'')}${x.critical?' · Критический остаток':''}</span></div><b>${n(x.quantity)}</b></div>`).join('')||'<div class="card muted">Склад пуст</div>'}</div>`);if(S.page==='crm')return shell(`<h1>CRM</h1><p class="muted">Группы клиентов</p><div class="list">${(d.items||[]).map(x=>`<div class="item"><div><b>${e(x.name)}</b><span>${x.count==null?'Количество не указано':n(x.count)+' клиентов'}</span></div><button data-g="${e(x.id)}">Открыть</button></div>`).join('')||'<div class="card muted">Группы не найдены</div>'}</div>`);if(S.page==='analytics'){const k2=d.kpi||{},c=d.comparison||{};return shell(`<h1>Аналитика</h1><p class="muted">За ${n(d.days)} дней</p><div class="grid"><div class="card"><div class="label">Выручка товаров</div><div class="value">${m(k2.product_revenue)}</div></div><div class="card"><div class="label">Продано единиц</div><div class="value">${n(k2.product_units)}</div></div><div class="card"><div class="label">Загрузка</div><div class="value">${c.occupancy==null?'—':e(c.occupancy)+'%'}</div></div><div class="card"><div class="label">ARPU</div><div class="value">${m(c.arpu)}</div></div></div>`)}return shell('<h1>Раздел</h1>')}async function load(p,push=true){if(push&&p!==S.page)S.back.push(S.page);S.page=p;app.innerHTML=shell('<div class="loading">Загрузка…</div>');bind();try{const r=await fetch(R[p],{headers:H()});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));app.innerHTML=loadView(JSON.parse(t));bind()}catch(x){err(x.message||x)}}function bind(){app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>load(b.dataset.p));app.querySelector('[data-retry]')?.addEventListener('click',()=>load(S.page,false));app.querySelector('[data-back]')?.addEventListener('click',()=>{const p=S.back.pop();if(p)load(p,false)});app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>load('crm'))}load('overview',false)})()</script></body></html>
