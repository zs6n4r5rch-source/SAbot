<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Strike Arena</title>
<style>
:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#0b0b10);--card:var(--tg-theme-secondary-bg-color,#17171f);--text:var(--tg-theme-text-color,#f5f5f7);--muted:var(--tg-theme-hint-color,#9b9ba6);--accent:var(--tg-theme-button-color,#6d36ff);--accentText:var(--tg-theme-button-text-color,#fff);--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;padding:12px 14px 28px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{max-width:820px;margin:auto}nav{display:flex;gap:7px;overflow:auto;padding-bottom:12px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}button{border:0;border-radius:12px;padding:10px 13px;background:var(--card);color:var(--text);font-size:14px;font-weight:650;white-space:nowrap;cursor:pointer}.active,.primary{background:var(--accent);color:var(--accentText)}button:disabled{opacity:.5}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 17px}.brand{font-size:24px;font-weight:850}.sub{font-size:13px;color:var(--muted);margin-top:2px}.badge{font-size:11px;padding:6px 9px;border-radius:999px;background:var(--card)}h1{font-size:28px;margin:5px 0 3px}h2{font-size:18px;margin:22px 0 9px}.muted,.small{color:var(--muted)}.muted{font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.value{font-size:23px;font-weight:820}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.small{font-size:12px;margin-top:5px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center}.item span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.section{margin-top:18px}.error{border:1px solid rgba(255,80,80,.4);border-radius:16px;padding:16px}.loading{text-align:center;color:var(--muted);padding:44px}.toolbar{display:flex;gap:7px;overflow:auto;margin:10px 0 12px}.toolbar button{font-size:13px}.back{margin-bottom:8px}.notice{padding:12px 14px;border-radius:13px;background:rgba(255,255,255,.04);font-size:13px;color:var(--muted)}.click{cursor:pointer}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.statline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.statline:last-child{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.07);font-size:11px}.danger{border-color:rgba(255,80,80,.35)}
@media(min-width:650px){.grid4{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div id="app"><div class="loading">Загрузка…</div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){'use strict';
var app=document.getElementById('app');
var state={page:'overview',view:null,role:'',stack:[],cache:{}};
var routes={overview:'/api/app/overview',work:'/api/app/work-center',finance:'/api/app/finance',warehouse:'/api/app/warehouse',crm:'/api/app/crm/groups',analytics:'/api/app/analytics',shifts:'/api/app/shifts',previous:'/api/app/shifts/previous',penalties:'/api/app/penalties',admin:'/api/app/admin/me',campaigns:'/api/app/smm/campaigns',guest:'/api/app/guest/me',crmSearch:'/api/app/crm'};
var names={overview:'Главная',work:'Work Center',finance:'Финансы',warehouse:'Склад',crm:'CRM',analytics:'Аналитика'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function n(v){if(v==null||v==='')return '—';var x=Number(v);return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(Number.isFinite(x)?x:0);}
function rub(v){return v==null?'—':n(v)+' ₽';}
function dt(v){if(!v)return '—';try{return new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return String(v);}}
function nav(){var s='<nav>';if(state.stack.length)s+='<button data-back>← Назад</button>';Object.keys(names).forEach(function(k){s+='<button data-page="'+k+'" class="'+(state.page===k?'active':'')+'">'+names[k]+'</button>';});s+='</nav>';return s;}
function shell(body){return nav()+'<div class="top"><div><div class="brand">Strike Arena</div><div class="sub">Единый центр управления клубом</div></div>'+(state.role?'<span class="badge">'+esc(String(state.role).toUpperCase())+'</span>':'')+'</div>'+body;}
function actions(items){return '<div class="actions">'+items.map(function(x){return '<button data-open="'+esc(x[0])+'"'+(x[2]?' class="primary"':'')+'>'+esc(x[1])+'</button>';}).join('')+'</div>';}
function list(items,empty){return items&&items.length?'<div class="list">'+items.join('')+'</div>':'<div class="notice">'+esc(empty||'Нет данных')+'</div>';}
function error(text){app.innerHTML=shell('<div class="error"><h1>Не удалось загрузить раздел</h1><p class="muted">'+esc(text)+'</p><button class="primary" data-retry>Повторить</button></div>');bind();}
function overview(d){var r=d.revenue||{},k=d.kpi||{},a=d.attention||[],st=d.source_status||{};return shell('<h1>Главная</h1><p class="muted">Операционная сводка и точки внимания</p><div class="grid4"><div class="card"><div class="label">Выручка</div><div class="value">'+rub(r.total)+'</div><div class="small">Товары '+rub(r.products)+'</div></div><div class="card"><div class="label">Продажи</div><div class="value">'+n(r.product_units)+'</div><div class="small">единиц</div></div><div class="card"><div class="label">Клиенты</div><div class="value">'+n(k.guests)+'</div><div class="small">в базе</div></div><div class="card"><div class="label">Внимание</div><div class="value">'+n(a.reduce(function(s,x){return s+(Number(x.count)||0)},0))+'</div><div class="small">критических точек</div></div></div><h2>Быстрые действия</h2>'+actions([['work','Work Center',true],['finance','Финансы'],['warehouse','Склад'],['crm','CRM'],['analytics','Аналитика']])+ '<h2>Источники и качество данных</h2><div class="card"><div class="statline"><span>LANGAME</span><b>'+esc(st.langame==='ok'?'доступен':'недоступен')+'</b></div><div class="statline"><span>Часовой пояс</span><b>'+esc(d.timezone||'—')+'</b></div><div class="statline"><span>Неподтверждённые метрики</span><b>помечены «—»</b></div></div>');}
function work(d){return shell('<h1>Work Center</h1><p class="muted">Смены, склад, контроль и операционные действия</p><div class="grid4"><div class="card"><div class="label">Открытые смены</div><div class="value">'+n(d.open_shifts)+'</div></div><div class="card"><div class="label">Критический склад</div><div class="value">'+n(d.critical_stock)+'</div></div><div class="card"><div class="label">Контур</div><div class="value">'+(d.role==='owner'?'OWNER':'ADMIN')+'</div></div><div class="card"><div class="label">Состояние</div><div class="value">Активен</div></div></div><h2>Операционные разделы</h2>'+actions([['shifts','Все смены',true],['previous','Предыдущая смена'],['warehouse','Остатки и критический склад'],['penalties','Штрафы и нарушения'],['admin','Мой контроль']])+ '<h2>Контроль</h2><div class="card">'+(d.sections||[]).map(function(x){return '<span class="pill">'+esc(x)+'</span> ';}).join('')+'</div>');}
function finance(d){var r=d.revenue||{},p=d.products||{};return shell('<h1>Финансы</h1><p class="muted">Период: последние '+n(d.days)+' дней</p><div class="toolbar"><button data-fin="7">7 дней</button><button data-fin="30">30 дней</button><button data-fin="90">90 дней</button></div><div class="grid4"><div class="card"><div class="label">Общая выручка</div><div class="value">'+rub(r.total)+'</div></div><div class="card"><div class="label">Товары</div><div class="value">'+rub(r.products)+'</div></div><div class="card"><div class="label">Продано</div><div class="value">'+n(p.units)+'</div></div><div class="card"><div class="label">COGS / прибыль</div><div class="value">—</div><div class="small">источник не подтверждён</div></div></div><h2>Финансовый контроль</h2>'+actions([['warehouse','Продажи товаров'],['shifts','Смены и кассовые разницы'],['overview','Сводка']])+'<div class="notice section">'+esc(d.source_note||'Неподтверждённые показатели не подменяются расчётными значениями.')+'</div>');}
function warehouse(d){var items=d.items||[];return shell('<h1>Склад</h1><p class="muted">Остатки, категории и контроль движения</p>'+actions([['warehouseCritical','Критические'],['warehouseCategories','Категории'],['warehouseSales','Продажи'],['warehouse','Все остатки',true]])+'<div class="grid4"><div class="card"><div class="label">Позиций</div><div class="value">'+n(items.length)+'</div></div><div class="card"><div class="label">Критических</div><div class="value">'+n(items.filter(function(x){return x.critical}).length)+'</div></div></div><h2>Остатки</h2>'+list(items.map(function(x){return '<div class="item"><div><b>'+esc(x.product)+'</b><span>'+esc(x.category||'Без категории')+(x.critical?' · Критический остаток':'')+'</span></div><div><b>'+n(x.quantity)+'</b><span>мин. '+n(x.min_stock)+'</span></div></div>';}),'Склад пуст')+'<div class="notice section">Движения, списания и инвентаризации выполняются через локальный контрольный слой; данные LANGAME не изменяются.</div>');}
function crm(d){var items=d.items||[];return shell('<h1>CRM</h1><p class="muted">Группы, поиск гостей и карточки клиентов</p><div class="toolbar"><input data-q placeholder="Поиск гостя" style="min-width:180px;flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px"><button data-search class="primary">Найти</button></div>'+actions([['crm','Группы',true],['crmSearch','Поиск гостей'],['campaigns','Кампании']])+ '<h2>Группы</h2>'+list(items.map(function(x){return '<div class="item click" data-group="'+esc(x.id)+'"><div><b>'+esc(x.name)+'</b><span>'+ (x.count==null?'Количество не указано':n(x.count)+' клиентов')+'</span></div><b>›</b></div>';}),'Группы не найдены'));}
function analytics(d){var k=d.kpi||{},c=d.comparison||{};return shell('<h1>Аналитика</h1><p class="muted">Период: '+n(d.days)+' дней</p><div class="toolbar"><button data-ana="7">7 дней</button><button data-ana="30">30 дней</button><button data-ana="90">90 дней</button></div><div class="grid4"><div class="card"><div class="label">Выручка товаров</div><div class="value">'+rub(k.product_revenue)+'</div></div><div class="card"><div class="label">Продано единиц</div><div class="value">'+n(k.product_units)+'</div></div><div class="card"><div class="label">Загрузка</div><div class="value">'+(c.occupancy==null?'—':esc(c.occupancy)+'%')+'</div></div><div class="card"><div class="label">ARPU</div><div class="value">'+rub(c.arpu)+'</div></div></div><h2>Расширенные показатели</h2><div class="card"><div class="statline"><span>Выручка/час</span><b>'+rub(c.revenue_per_hour)+'</b></div><div class="statline"><span>Выручка/ПК</span><b>'+rub(c.revenue_per_pc)+'</b></div><div class="statline"><span>Retention</span><b>'+esc(c.retention==null?'—':c.retention)+'</b></div></div><h2>Контроль и разрезы</h2>'+actions([['shifts','Смены и сотрудники'],['penalties','Нарушения'],['admin','Контроль администратора'],['crm','Клиенты']])+'<div class="notice section">'+esc(d.note||'Показатели без подтверждённого источника отображаются как «—».')+'</div>');}
function detail(title,body){return shell('<button class="back" data-back>← Назад</button><h1>'+esc(title)+'</h1>'+body);}
function render(d){state.role=d.role||state.role; if(state.page==='overview')return overview(d);if(state.page==='work')return work(d);if(state.page==='finance')return finance(d);if(state.page==='warehouse')return warehouse(d);if(state.page==='crm')return crm(d);if(state.page==='analytics')return analytics(d);return shell('<h1>Раздел</h1>');}
function bind(){
Array.prototype.forEach.call(app.querySelectorAll('[data-page]'),function(b){b.onclick=function(){load(b.getAttribute('data-page'));};});
var back=app.querySelector('[data-back]');if(back)back.onclick=function(){var p=state.stack.pop()||'overview';state.page=p;state.view=null;load(p,true);};
var retry=app.querySelector('[data-retry]');if(retry)retry.onclick=function(){load(state.page,true);};
Array.prototype.forEach.call(app.querySelectorAll('[data-open]'),function(b){b.onclick=function(){openView(b.getAttribute('data-open'));};});
Array.prototype.forEach.call(app.querySelectorAll('[data-fin]'),function(b){b.onclick=function(){load('finance',false,{'days':b.getAttribute('data-fin')});};});
Array.prototype.forEach.call(app.querySelectorAll('[data-ana]'),function(b){b.onclick=function(){load('analytics',false,{'days':b.getAttribute('data-ana')});};});
var sb=app.querySelector('[data-search]');if(sb)sb.onclick=function(){openView('crmSearch',app.querySelector('[data-q]')?app.querySelector('[data-q]').value:'');};
Array.prototype.forEach.call(app.querySelectorAll('[data-group]'),function(b){b.onclick=function(){openView('group:'+b.getAttribute('data-group'));};});
}
function getTelegram(){return window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;}
async function api(path,params){var tg=getTelegram();if(!tg)throw new Error('Telegram WebApp SDK не загрузился.');try{tg.ready();tg.expand();}catch(e){}var initData=typeof tg.initData==='string'?tg.initData:'';if(!initData)throw new Error('Telegram initData не получен. Откройте Mini App из Telegram.');var url=path;if(params){var q=Object.keys(params).filter(function(k){return params[k]!==undefined&&params[k]!==null&&params[k]!==''}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');if(q)url+='?'+q;}var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},15000);try{var response=await fetch(url,{headers:{'X-Telegram-Init-Data':initData,'Accept':'application/json'},cache:'no-store',signal:controller.signal});var text=await response.text();var data;try{data=JSON.parse(text);}catch(e){throw new Error('Некорректный ответ сервера (HTTP '+response.status+').');}if(!response.ok)throw new Error(data.detail||('HTTP '+response.status));return data;}finally{clearTimeout(timer);}}
async function load(page,fromHistory,params){if(page!==state.page&&!fromHistory){state.stack.push(state.page);}state.page=page;state.view=null;app.innerHTML=shell('<div class="loading">Загрузка…</div>');try{var d=await api(routes[page],params);state.cache[page]=d;app.innerHTML=render(d);bind();}catch(e){error(e&&e.name==='AbortError'?'Сервер не ответил за 15 секунд.':(e.message||String(e)));}}
async function openView(v,arg){state.stack.push(state.page);state.view=v;app.innerHTML=shell('<div class="loading">Загрузка…</div>');try{
if(v==='shifts'){var d=await api(routes.shifts);app.innerHTML=detail('Смены','<p class="muted">Последние 100 смен</p>'+list((d.items||[]).map(function(x){return '<div class="item"><div><b>'+esc(x.employee||'Сотрудник не указан')+'</b><span>'+dt(x.started_at)+' → '+(x.ended_at?dt(x.ended_at):'открыта')+'</span></div><span class="pill">'+esc(x.status||'—')+'</span></div>';}),'Смен нет'));}
else if(v==='previous'){var p=await api(routes.previous);var x=p.item;app.innerHTML=detail('Предыдущая смена',x?'<div class="card"><div class="statline"><span>Сотрудник</span><b>'+esc(x.employee||'—')+'</b></div><div class="statline"><span>Начало</span><b>'+dt(x.started_at)+'</b></div><div class="statline"><span>Окончание</span><b>'+dt(x.ended_at)+'</b></div><div class="statline"><span>Кассовая разница</span><b>'+rub(x.cash_difference)+'</b></div></div>':'<div class="notice">Предыдущая закрытая смена не найдена.</div>');}
else if(v==='penalties'){var q=await api(routes.penalties);app.innerHTML=detail('Штрафы и нарушения','<p class="muted">Контур доступный текущей роли</p>'+list((q.items||[]).map(function(x){return '<div class="item"><div><b>'+esc(x.title||x.type)+'</b><span>'+esc(x.employee||'')+' · '+dt(x.created_at)+'</span></div><b>'+rub(x.amount)+'</b></div>';}),'Нарушений нет'));}
else if(v==='admin'){var a=await api(routes.admin);app.innerHTML=detail('Мой контроль','<div class="card"><div class="statline"><span>Employee ID</span><b>'+esc(a.employee_id||'—')+'</b></div><div class="statline"><span>Разрешений</span><b>'+n((a.permissions||[]).length)+'</b></div></div><h2>Разрешения</h2>'+list((a.permissions||[]).map(function(x){return '<div class="item"><b>'+esc(x)+'</b><span>разрешено</span></div>';}),'Нет разрешений'));}
else if(v==='campaigns'){var c=await api(routes.campaigns);app.innerHTML=detail('SMM и кампании','<p class="muted">Локальная очередь кампаний</p>'+list((c.items||[]).map(function(x){return '<div class="item"><div><b>'+esc(x.name)+'</b><span>'+esc(x.status||'—')+(x.scheduled_at?' · '+dt(x.scheduled_at):'')+'</span></div></div>';}),'Кампаний нет')+'<div class="notice section">Доставка: '+esc(c.delivery||'—')+'. Запланированные рассылки не считаются готовыми, пока источник не подтверждён.</div>');}
else if(v==='crmSearch'){var s=await api(routes.crmSearch,{q:arg||''});app.innerHTML=detail('Поиск гостей','<p class="muted">Результат LANGAME</p>'+list((s.items||[]).map(function(x){return '<div class="item"><div><b>'+esc(x.fio||x.name||x.full_name||'Гость')+'</b><span>'+esc(x.phone||x.username||x.id||'')+'</span></div><b>›</b></div>';}),'Гости не найдены'));}
else if(v.indexOf('group:')===0){var id=v.split(':')[1],g=await api('/api/app/crm/groups/'+encodeURIComponent(id)+'/guests');app.innerHTML=detail('Группа клиентов','<p class="muted">Группа #'+esc(id)+'</p>'+list((g.items||[]).map(function(x){return '<div class="item"><div><b>'+esc(x.fio||x.name||x.full_name||'Гость')+'</b><span>'+esc(x.phone||x.username||x.id||'')+'</span></div></div>';}),'В группе нет гостей'));}
else if(v==='warehouseCritical'){var w=await api(routes.warehouse+'/critical');app.innerHTML=detail('Критические остатки',list((w.items||[]).map(function(x){return '<div class="item danger"><div><b>'+esc(x.product)+'</b><span>'+esc(x.category||'')+'</span></div><b>'+n(x.quantity)+' / '+n(x.min_stock)+'</b></div>';}),'Критических позиций нет'));}
else if(v==='warehouseCategories'){var c2=await api(routes.warehouse+'/categories');app.innerHTML=detail('Категории склада',list((c2.items||[]).map(function(x){return '<div class="item"><b>'+esc(x.name)+'</b><span>#'+esc(x.id)+'</span></div>';}),'Категорий нет'));}
else if(v==='warehouseSales'){var ws=await api(routes.warehouse+'/sales',{days:30});app.innerHTML=detail('Продажи товаров','<p class="muted">Последние 30 дней · LANGAME</p>'+list((ws.items||[]).map(function(x){var qty=x.count||x.quantity||0,price=x.price_sale||x.price||0;return '<div class="item"><div><b>'+esc(x.product_name||x.product||x.name||'Товар')+'</b><span>'+n(qty)+' × '+rub(price)+'</span></div><b>'+rub(Number(qty)*Number(price))+'</b></div>';}),'Продаж нет'));}
else {throw new Error('Неизвестный раздел');}
bind();
}catch(e){error(e.message||String(e));}}
load('overview');
})();
</script>
</body>
</html>
