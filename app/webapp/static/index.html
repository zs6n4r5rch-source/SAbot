<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SAbot</title>
</head>
<body>
  <div id="app">Загрузка…</div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
  (() => {
    const app = document.getElementById('app');
    const tg = window.Telegram && window.Telegram.WebApp;
    const headers = () => ({'X-Telegram-Init-Data': tg ? tg.initData : ''});
    const state = {stack: [], page: 'overview'};
    const routes = {
      overview: '/api/app/overview',
      workCenter: '/api/app/work-center',
      finance: '/api/app/finance',
      warehouse: '/api/app/warehouse',
      groups: '/api/app/crm/groups',
      previousShift: '/api/app/shifts/previous',
      analytics: '/api/app/analytics'
    };
    function esc(v){return String(v ?? '').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
    function menu(){return `<nav><button data-go="overview">Главная</button><button data-go="workCenter">Work Center</button><button data-go="finance">Финансы</button><button data-go="warehouse">Склад</button><button data-go="groups">CRM</button><button data-go="analytics">Аналитика</button></nav>`}
    function renderLoading(){app.innerHTML = menu() + '<p>Загрузка…</p>'; bind();}
    function renderError(e){app.innerHTML = menu()+`<h2>Ошибка</h2><p>${esc(e.message || e)}</p><button data-go="${state.page}">Повторить</button>`;bind();}
    function render(data){
      const p=state.page; let body='';
      if(p==='overview') body=`<h1>Summary</h1><pre>${esc(JSON.stringify(data,null,2))}</pre><button data-go="workCenter">Открыть Work Center</button>`;
      else if(p==='workCenter') body=`<h1>Work Center</h1>${(data.sections||[]).map(x=>`<button data-go="${x==='guests'?'groups':x==='previous_shift'?'previousShift':x}">${esc(x)}</button>`).join(' ')}`;
      else if(p==='groups') body=`<h1>Группы</h1>${(data.items||[]).map(x=>`<p><button data-go="groupGuests:${x.id}">${esc(x.name)} — ${esc(x.count ?? 'н/д')}</button></p>`).join('')||'<p>Нет данных</p>'}`;
      else body=`<h1>${esc(p)}</h1><pre>${esc(JSON.stringify(data,null,2))}</pre>`;
      app.innerHTML=menu()+(state.stack.length?'<button id="back">← Назад</button>':'')+body; bind();
    }
    async function load(page, push=true){
      if(push && page!==state.page) state.stack.push(state.page);
      state.page=page; renderLoading();
      let url=routes[page];
      if(page.startsWith('groupGuests:')) url='/api/app/crm/groups/'+page.split(':')[1]+'/guests';
      if(!url){renderError(new Error('Экран пока не имеет подтверждённого API контракта'));return;}
      try{const r=await fetch(url,{headers:headers()}); if(!r.ok) throw new Error((await r.text())||('HTTP '+r.status)); render(await r.json());}
      catch(e){renderError(e)}
    }
    function bind(){app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>load(b.dataset.go)); const back=document.getElementById('back'); if(back) back.onclick=()=>{const p=state.stack.pop(); if(p) load(p,false)};}
    if(tg){tg.ready();tg.expand();} load('overview',false);
  })();
  </script>
</body>
</html>
