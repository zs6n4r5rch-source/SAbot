<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>Strike Arena</title>
<style>
:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#0b0b10);--card:var(--tg-theme-secondary-bg-color,#17171f);--text:var(--tg-theme-text-color,#f5f5f7);--muted:var(--tg-theme-hint-color,#9b9ba6);--accent:var(--tg-theme-button-color,#6d36ff);--line:rgba(255,255,255,.08)}*{box-sizing:border-box}body{margin:0;padding:12px 14px 30px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{max-width:900px;margin:auto}nav,.toolbar,.actions{display:flex;gap:7px;overflow:auto;padding-bottom:8px}button{border:0;border-radius:12px;padding:10px 13px;background:var(--card);color:var(--text);font-size:14px;font-weight:650;white-space:nowrap}button.active,button.primary{background:var(--accent)}button:disabled{opacity:.45}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 17px}.brand{font-size:24px;font-weight:850}.sub,.muted,.small{color:var(--muted)}.sub{font-size:13px}.badge,.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.08)}h1{font-size:28px;margin:5px 0}h2{font-size:18px;margin:22px 0 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card,.item,.error{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.value{font-size:22px;font-weight:820}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.small{font-size:12px;margin-top:5px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center}.item span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.actions{flex-wrap:wrap;overflow:visible}.toolbar{overflow:auto;margin:8px 0}.toolbar input{min-width:190px;flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}.notice{padding:12px;border-radius:13px;background:rgba(255,255,255,.04);font-size:13px;color:var(--muted);margin-top:12px}.loading{text-align:center;color:var(--muted);padding:48px}.danger{border-color:rgba(255,80,80,.4)}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><div id="app"><div class="loading">Загрузка…</div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){'use strict';
var app=document.getElementById('app'), state={page:'overview',role:'',stack:[]};
var routes={overview:'/api/app/overview',work:'/api/app/work-center',finance:'/api/app/finance',warehouse:'/api/app/warehouse',crm:'/api/app/crm/groups',analytics:'/api/app/analytics',shifts:'/api/app/shifts',previous:'/api/app/shifts/previous',closeReports:'/api/app/shifts/close-reports',penalties:'/api/app/penalties',salary:'/api/app/salary',admin:'/api/app/admin/me',profiles:'/api/app/admin/profiles',settings:'/api/app/settings',campaigns:'/api/app/smm/campaigns',guest:'/api/app/guest/me',crmSearch:'/api/app/crm',localLinks:'/api/app/crm/local-links'};
var names={overview:'Главная',work:'Work Center',finance:'Финансы',warehouse:'Склад',crm:'CRM',analytics:'Аналитика'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function n(v){if(v==null||v==='')return '—';var x=Number(v);return Number.isFinite(x)?new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(x):'—';}
function rub(v){return v==null?'—':n(v)+' ₽';}function dt(v){if(!v)return '—';try{return new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return String(v);}}
function nav(){var s='<nav>';if(state.stack.length)s+='<button data-back>← Назад</button>';Object.keys(names).forEach(function(k){s+='<button data-page="'+k+'" class="'+(state.page===k?'active':'')+'">'+names[k]+'</button>';});s+='</nav>';return s;}
function shell(body){return nav()+'<div class="top"><div><div class="brand">Strike Arena</div><div class="sub">Единый центр управления клубом</div></div><span class="badge">'+esc(String(state.role||'').toUpperCase())+'</span></div>'+body;}
function actions(a){return '<div class="actions">'+a.map(function(x){return '<button data-open="'+esc(x[0])+'"'+(x[2]?' class="primary"':'')+'>'+esc(x[1])+'</button>';}).join('')+'</div>';}
function list(a,empty){return a&&a.length?'<div class="list">'+a.join('')+'</div>':'<div class="notice">'+esc(empty||'Нет данных')+'</div>';}
function error(e){app.innerHTML=shell('<div class="error"><h1>Раздел недоступен</h1><p class="muted">'+esc(e)+'</p><button class="primary" data-retry>Повторить</button></div>');bind();}
function overview(d){var r=d.revenue||{},k=d.kpi||{},a=d.attention||[];return shell('<h1>Главная</h1><p class="muted">Операционная сводка, точки внимания и быстрый доступ</p><div class="grid"><div class="card"><div class="label">Выручка</div><div class="value">'+rub(r.total)+'</div><div class="small">Товары '+rub(r.products)+'</div></div><div class="card"><div class="label">Продажи</div><div class="value">'+n(r.product_units)+'</div><div class="small">единиц</div></div><div class="card"><div class="label">Клиенты</div><div class="value">'+n(k.guests)+'</div><div class="small">в базе</div></div><div class="card"><div class="label">Открытые смены</div><div class="value">'+n(k.open_shifts)+'</div></div></div><h2>Быстрые действия</h2>'+actions([['work','Work Center',1],['finance','Финансы'],['warehouse','Склад'],['crm','CRM'],['analytics','Аналитика']])+'<h2>Контроль</h2>'+list(a.map(function(x){return '<div class="item"><div><b>'+esc(x.title)+'</b><span>'+esc(x.key||'')+'</span></div><b>'+n(x.count)+'</b></div>';}),'Критических точек нет')+'<div class="notice">LANGAME: '+esc((d.source_status||{}).langame||'—')+' · Часовой пояс: '+esc(d.timezone||'—')+'. Неподтверждённые метрики не подменяются.</div>');}
function work(d){return shell('<h1>Work Center</h1><p class="muted">Операционный центр: смены, касса, склад, контроль, зарплата и SMM</p><div class="grid"><div class="card"><div class="label">Открытые смены</div><div class="value">'+n(d.open_shifts)+'</div></div><div class="card"><div class="label">Критический склад</div><div class="value">'+n(d.critical_stock)+'</div></div><div class="card"><div class="label">Ожидают списания</div><div class="value">'+n(d.pending_writeoffs)+'</div></div><div class="card"><div class="label">Открытые расхождения</div><div class="value">'+n(d.open_discrepancies)+'</div></div></div><h2>Операционные разделы</h2>'+actions([['shifts','Смены',1],['previous','Предыдущая смена'],['closeReports','Закрытия смен'],['warehouse','Склад'],['penalties','Штрафы'],['salary','Зарплата'],['admin','Контроль администратора'],['profiles','Профили доступа'],['campaigns','SMM']])+ '<h2>Контуры</h2><div class="card">'+(d.sections||[]).map(function(x){return '<span class="pill">'+esc(x)+'</span> ';}).join('')+'</div>'+(state.role==='owner'?actions([['settings','Настройки']]):''));}
function finance(d){var r=d.revenue||{},p=d.products||{},m=d.payments||{};return shell('<h1>Финансы</h1><p class="muted">Последние '+n(d.days)+' дней</p><div class="toolbar"><button data-fin="7">7 дней</button><button data-fin="30">30 дней</button><button data-fin="90">90 дней</button></div><div class="grid"><div class="card"><div class="label">Итого</div><div class="value">'+rub(r.total)+'</div></div><div class="card"><div class="label">Товары</div><div class="value">'+rub(r.products)+'</div></div><div class="card"><div class="label">Единиц</div><div class="value">'+n(p.units)+'</div></div><div class="card"><div class="label">Прибыль / COGS</div><div class="value">—</div></div></div><h2>Платёжные разрезы</h2><div class="card"><div class="stat"><span>Наличные</span><b>'+rub(m.cash)+'</b></div><div class="stat"><span>Карта</span><b>'+rub(m.card)+'</b></div><div class="stat"><span>Безнал/мобильные</span><b>'+rub(m.mobile)+'</b></div><div class="stat"><span>Разница кассы</span><b>'+rub(m.cash_difference)+'</b></div></div><div class="notice">'+esc(d.source_note||'')+'</div>');}
function warehouse(d){var a=d.items||[];return shell('<h1>Склад</h1><p class="muted">Остатки и контроль движения</p>'+actions([['warehouse','Остатки',1],['warehouseCritical','Критические'],['warehouseCategories','Категории'],['warehouseArrivals','Приходы'],['warehouseSales','Продажи'],['warehouseHistory','История'],['warehouseWriteoffs','Списания'],['warehouseInventories','Инвентаризации'],['warehouseDiscrepancies','Расхождения']])+'<div class="grid"><div class="card"><div class="label">Позиций</div><div class="value">'+n(a.length)+'</div></div><div class="card"><div class="label">Критических</div><div class="value">'+n(a.filter(function(x){return x.critical}).length)+'</div></div></div><h2>Остатки</h2>'+list(a.map(function(x){return '<div class="item"><div><b>'+esc(x.product)+'</b><span>'+esc(x.category||'Без категории')+(x.critical?' · критический':'')+'</span></div><div><b>'+n(x.quantity)+'</b><span>мин. '+n(x.min_stock)+'</span></div></div>';}),'Остатки не найдены')+'<div class="notice">Контрольный слой локальный; LANGAME используется как источник и не изменяется.</div>');}
function crm(d){var a=d.items||[];return shell('<h1>CRM</h1><p class="muted">Группы, поиск, карточки гостей, Telegram и согласие на маркетинг</p><div class="toolbar"><input data-q placeholder="ФИО, телефон или другой запрос"><button data-search class="primary">Найти</button></div>'+actions([['crm','Группы',1],['crmSearch','Поиск'],['localLinks','Telegram / consent'],['campaigns','Кампании']])+'<h2>Группы клиентов</h2>'+list(a.map(function(x){return '<div class="item click" data-group="'+esc(x.id)+'"><div><b>'+esc(x.name)+'</b><span>'+esc(x.count==null?'Количество не указано':n(x.count)+' клиентов')+'</span></div><b>›</b></div>';}),'Группы не найдены'));}
function analytics(d){var k=d.kpi||{},c=d.comparison||{};return shell('<h1>Аналитика</h1><p class="muted">Последние '+n(d.days)+' дней</p><div class="toolbar"><button data-ana="7">7 дней</button><button data-ana="30">30 дней</button><button data-ana="90">90 дней</button></div><div class="grid"><div class="card"><div class="label">Продажи товаров</div><div class="value">'+rub(k.product_revenue)+'</div></div><div class="card"><div class="label">Единицы</div><div class="value">'+n(k.product_units)+'</div></div><div class="card"><div class="label">Часы</div><div class="value">'+n(k.hours)+'</div></div><div class="card"><div class="label">Смены</div><div class="value">'+n(k.shifts)+'</div></div></div><h2>Контрольные показатели</h2><div class="card"><div class="stat"><span>Продажи/час</span><b>'+rub(c.revenue_per_hour)+'</b></div><div class="stat"><span>Кассовая разница</span><b>'+rub(k.cash_difference)+'</b></div><div class="stat"><span>Одобренные списания</span><b>'+n(k.approved_writeoffs)+'</b></div><div class="stat"><span>Расхождения</span><b>'+n(k.discrepancies)+'</b></div><div class="stat"><span>Зарплата</span><b>'+rub(k.salary_total)+'</b></div><div class="stat"><span>Загрузка / ПК / ARPU / retention</span><b>—</b></div></div><h2>Разрезы</h2>'+actions([['analyticsAdmins','Администраторы',1],['shifts','Смены'],['salary','Зарплата'],['penalties','Нарушения'],['crm','Клиенты']])+'<div class="notice">'+esc(d.note||'Неподтверждённые метрики остаются NULL.')+'</div>');}
function detail(title,b){return shell('<button data-back>← Назад</button><h1>'+esc(title)+'</h1>'+b);}
function rows(items,fn){return list((items||[]).map(fn),'Нет данных');}
function bind(){Array.prototype.forEach.call(app.querySelectorAll('[data-page]'),function(b){b.onclick=function(){load(b.dataset.page);};});var back=app.querySelector('[data-back]');if(back)back.onclick=function(){var p=state.stack.pop()||'overview';state.page=p;load(p,true);};var retry=app.querySelector('[data-retry]');if(retry)retry.onclick=function(){load(state.page,true);};Array.prototype.forEach.call(app.querySelectorAll('[data-open]'),function(b){b.onclick=function(){openView(b.dataset.open);};});Array.prototype.forEach.call(app.querySelectorAll('[data-fin]'),function(b){b.onclick=function(){load('finance',false,{days:b.dataset.fin});};});Array.prototype.forEach.call(app.querySelectorAll('[data-ana]'),function(b){b.onclick=function(){load('analytics',false,{days:b.dataset.ana});};});var sb=app.querySelector('[data-search]');if(sb)sb.onclick=function(){openView('crmSearch',app.querySelector('[data-q]').value);};Array.prototype.forEach.call(app.querySelectorAll('[data-group]'),function(b){b.onclick=function(){openView('group:'+b.dataset.group);};});}
function tg(){return window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;}
async function api(path,params){var t=tg();if(!t)throw Error('Telegram WebApp SDK не загрузился');try{t.ready();t.expand();}catch(e){}var init=t.initData||'';if(!init)throw Error('Telegram initData не получен. Откройте Mini App из Telegram.');var q='';if(params)q=Object.keys(params).filter(function(k){return params[k]!=null&&params[k]!==''}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');var c=new AbortController(),tm=setTimeout(function(){c.abort();},15000);try{var r=await fetch(path+(q?'?'+q:''),{headers:{'X-Telegram-Init-Data':init,'Accept':'application/json'},cache:'no-store',signal:c.signal});var text=await r.text(),d;try{d=JSON.parse(text);}catch(e){throw Error('Некорректный ответ сервера HTTP '+r.status);}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d;}finally{clearTimeout(tm);}}
async function load(page,history,params){if(page!==state.page&&!history)state.stack.push(state.page);state.page=page;app.innerHTML=shell('<div class="loading">Загрузка…</div>');try{var d=await api(routes[page],params);state.role=d.role||state.role;app.innerHTML=render(d);bind();}catch(e){error(e.name==='AbortError'?'Сервер не ответил за 15 секунд':e.message||String(e));}}
async function openView(v,arg){state.stack.push(state.page);app.innerHTML=shell('<div class="loading">Загрузка…</div>');try{var d,x;
if(v==='shifts'){d=await api(routes.shifts);app.innerHTML=detail('Смены',rows(d.items,function(x){return '<div class="item"><div><b>'+esc(x.employee||'Сотрудник не указан')+'</b><span>'+dt(x.started_at)+' → '+(x.ended_at?dt(x.ended_at):'открыта')+'</span></div><div><b>'+rub(x.cash_difference)+'</b><span>'+esc(x.status)+'</span></div></div>';}));}
else if(v==='previous'){d=await api(routes.previous);x=d.item;app.innerHTML=detail('Предыдущая смена',x?'<div class="card">'+Object.keys(x).map(function(k){return '<div class="stat"><span>'+esc(k)+'</span><b>'+esc(x[k])+'</b></div>';}).join('')+'</div>':'<div class="notice">Закрытых смен нет.</div>');}
else if(v==='closeReports'){d=await api(routes.closeReports);app.innerHTML=detail('Закрытия смен',rows(d.items,function(x){return '<div class="item"><div><b>Отчёт #'+x.id+' · смена '+x.shift_id+'</b><span>'+esc(x.status)+' · '+dt(x.submitted_at||x.created_at)+'</span></div><div><b>'+rub(x.cash_difference)+'</b><span>уборка '+rub(x.cleaning_bonus_amount)+'</span></div></div>';}));}
else if(v==='penalties'){d=await api(routes.penalties);app.innerHTML=detail('Штрафы и нарушения',rows(d.items,function(x){return '<div class="item"><div><b>'+esc(x.title||x.type)+'</b><span>'+esc(x.employee||'')+' · '+dt(x.created_at)+(x.comment?' · '+esc(x.comment):'')+'</span></div><b>'+rub(x.amount)+'</b></div>';}));}
else if(v==='salary'){d=await api(routes.salary);app.innerHTML=detail('Зарплата',rows(d.items,function(x){return '<div class="item"><div><b>'+esc(x.employee||'Сотрудник')+'</b><span>'+esc(x.date_from)+' — '+esc(x.date_to)+' · '+esc(x.status)+'</span></div><div><b>'+rub(x.total_amount)+'</b><span>'+(x.paid?'оплачено':'не оплачено')+'</span></div></div>';}));}
else if(v==='admin'){d=await api(routes.admin);app.innerHTML=detail('Мой контроль','<div class="card"><div class="stat"><span>Employee ID</span><b>'+esc(d.employee_id||'—')+'</b></div><div class="stat"><span>Разрешений</span><b>'+n((d.permissions||[]).length)+'</b></div></div>'+rows(d.permissions,function(x){return '<div class="item"><b>'+esc(x)+'</b><span>разрешено</span></div>';}));}
else if(v==='profiles'){d=await api(routes.profiles);app.innerHTML=detail('Профили доступа',rows(d.items,function(x){return '<div class="item"><div><b>'+esc(x.display_name||x.username)+'</b><span>@'+esc(x.username)+' · '+esc(x.role)+(x.employee_id?' · employee '+x.employee_id:'')+'</span></div><span class="pill">'+(x.active?'active':'disabled')+'</span></div>';}));}
else if(v==='settings'){d=await api(routes.settings);app.innerHTML=detail('Настройки владельца','<div class="card"><div class="stat"><span>Часовой пояс</span><b>'+esc((d.settings&&d.settings.timezone)||d.timezone||'—')+'</b></div><div class="stat"><span>Время отчёта</span><b>'+esc(d.settings?String(d.settings.hour).padStart(2,'0')+':'+String(d.settings.minute).padStart(2,'0'):'—')+'</b></div><div class="stat"><span>Ежедневный отчёт</span><b>'+esc(d.settings?String(d.settings.enabled):'—')+'</b></div></div>');}
else if(v==='campaigns'){d=await api(routes.campaigns);app.innerHTML=detail('SMM и кампании',rows(d.items,function(x){return '<div class="item"><div><b>'+esc(x.name)+'</b><span>'+esc(x.status)+' · '+n(x.recipients)+' получателей · '+n(x.sent)+' отправлено</span></div><span>'+dt(x.scheduled_at)+'</span></div>';} )+'<div class="notice">Доставка: '+esc(d.delivery||'—')+'. Планировщик рассылок остаётся неподтверждённым и не маскируется как готовый.</div>');}
else if(v==='localLinks'){d=await api(routes.localLinks);app.innerHTML=detail('Telegram и маркетинг',rows(d.items,function(x){return '<div class="item"><div><b>'+esc(x.name||'Гость')+'</b><span>'+esc(x.phone||'')+' · TG '+esc(x.telegram_user_id)+'</span></div><span class="pill">'+(x.marketing_consent?'согласие':'нет согласия')+'</span></div>';}));}
else if(v==='crmSearch'){d=await api(routes.crmSearch,{q:arg||''});app.innerHTML=detail('Поиск гостей',rows(d.items,function(x){return '<div class="item"><div><b>'+esc(x.fio||x.name||x.full_name||'Гость')+'</b><span>'+esc(x.phone||x.username||x.id||'')+'</span></div><b>›</b></div>';}));}
else if(v.indexOf('group:')===0){var id=v.split(':')[1];d=await api('/api/app/crm/groups/'+encodeURIComponent(id)+'/guests');app.innerHTML=detail('Группа клиентов #'+esc(id),rows(d.items,function(x){return '<div class="item"><div><b>'+esc(x.fio||x.name||x.full_name||'Гость')+'</b><span>'+esc(x.phone||x.username||x.id||'')+'</span></div></div>';}));}
else if(v==='warehouseCritical'){d=await api('/api/app/warehouse/critical');app.innerHTML=detail('Критические остатки',rows(d.items,function(x){return '<div class="item danger"><div><b>'+esc(x.product)+'</b><span>'+esc(x.category||'')+'</span></div><b>'+n(x.quantity)+' / '+n(x.min_stock)+'</b></div>';}));}
else if(v==='warehouseCategories'){d=await api('/api/app/warehouse/categories');app.innerHTML=detail('Категории склада',rows(d.items,function(x){return '<div class="item"><b>'+esc(x.name)+'</b><span>#'+esc(x.id)+'</span></div>';}));}
else if(v==='warehouseArrivals'){d=await api('/api/app/warehouse/arrivals',{days:30});app.innerHTML=detail('Приходы',rows(d.items,function(x){return '<div class="item"><div><b>'+esc(x.name||x.product_name||x.product||'Товар')+'</b><span>'+esc(x.date||x.created_at||'')+'</span></div><b>+'+n(x.count||x.quantity)+'</b></div>';}));}
else if(v==='warehouseSales'){d=await api('/api/app/warehouse/sales',{days:30});app.innerHTML=detail('Продажи товаров',rows(d.items,function(x){var q=Number(x.count||x.quantity||0),p=Number(x.price_sale||x.price||0);return '<div class="item"><div><b>'+esc(x.name||x.product_name||'Товар')+'</b><span>'+n(q)+' × '+rub(p)+'</span></div><b>'+rub(q*p)+'</b></div>';}));}
else if(v==='warehouseHistory'){d=await api('/api/app/warehouse/history');app.innerHTML=detail('История склада',rows(d.items,function(x){return '<div class="item"><div><b>'+esc(x.product)+'</b><span>'+esc(x.type)+' · '+dt(x.created_at)+' · shift '+esc(x.shift_id||'—')+'</span></div><b>'+n(x.quantity)+'</b></div>';}));}
else if(v==='warehouseWriteoffs'){d=await api('/api/app/warehouse/writeoffs');app.innerHTML=detail('Списания',rows(d.items,function(x){return '<div class="item"><div><b>Списание #'+x.id+'</b><span>'+esc(x.status)+' · '+esc(x.reason||'Без причины')+' · shift '+esc(x.shift_id||'—')+'</span></div><b>'+n((x.items||[]).reduce(function(s,i){return s+Number(i.quantity||0);},0))+'</b></div>';}));}
else if(v==='warehouseInventories'){d=await api('/api/app/warehouse/inventories');app.innerHTML=detail('Инвентаризации',rows(d.items,function(x){return '<div class="item"><div><b>Инвентаризация #'+x.id+'</b><span>'+esc(x.status)+' · '+dt(x.started_at)+'</span></div><div><b>'+n(x.items)+'</b><span>расхождений '+n(x.discrepancies)+'</span></div></div>';}));}
else if(v==='warehouseDiscrepancies'){d=await api('/api/app/warehouse/discrepancies');app.innerHTML=detail('Расхождения',rows(d.items,function(x){return '<div class="item"><div><b>'+esc(x.product)+'</b><span>'+esc(x.status)+' · '+dt(x.created_at)+' · shift '+esc(x.shift_id||'—')+'</span></div><div><b>'+n(x.quantity_difference)+'</b><span>'+rub(x.amount_difference)+'</span></div></div>';}));}
else if(v==='analyticsAdmins'){d=await api(routes.analytics,{days:30});app.innerHTML=detail('Администраторы',rows(d.admins,function(x){return '<div class="item"><div><b>'+esc(x.employee)+'</b><span>'+n(x.shifts)+' смен · '+n(x.hours)+' ч</span></div><b>'+rub(x.hours?Number(d.kpi.product_revenue)/Number(x.hours):null)+'</b></div>';}));}
else throw Error('Неизвестный раздел');bind();
}catch(e){error(e.message||String(e));}}
function render(d){if(state.page==='overview')return overview(d);if(state.page==='work')return work(d);if(state.page==='finance')return finance(d);if(state.page==='warehouse')return warehouse(d);if(state.page==='crm')return crm(d);if(state.page==='analytics')return analytics(d);return shell('<h1>Раздел</h1>');}
load('overview');
})();
</script></body></html>
