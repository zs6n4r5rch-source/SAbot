<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Strike Arena</title>
<style>
:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#0b0b10);--card:var(--tg-theme-secondary-bg-color,#17171f);--text:var(--tg-theme-text-color,#f5f5f7);--muted:var(--tg-theme-hint-color,#9b9ba6);--accent:var(--tg-theme-button-color,#6d36ff);--accentText:var(--tg-theme-button-text-color,#fff)}
*{box-sizing:border-box}body{margin:0;padding:12px 14px 24px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{max-width:760px;margin:auto}nav{display:flex;gap:7px;overflow:auto;padding-bottom:14px}button{border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--text);font-size:15px;font-weight:600;white-space:nowrap}.active,.primary{background:var(--accent);color:var(--accentText)}h1{font-size:27px;margin:8px 0 4px}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.brand{font-size:24px;font-weight:800}.sub{font-size:13px;color:var(--muted)}.badge{font-size:11px;padding:6px 9px;border-radius:999px;background:var(--card)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.item{background:var(--card);border-radius:16px;padding:15px}.label{font-size:13px;color:var(--muted);margin-bottom:6px}.value{font-size:24px;font-weight:800}.small{font-size:12px;color:var(--muted);margin-top:5px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center}.item span{display:block;font-size:13px;color:var(--muted);margin-top:4px}.error{border:1px solid rgba(255,80,80,.4);border-radius:16px;padding:16px}.loading{text-align:center;color:var(--muted);padding:40px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><div id="app"><div class="loading">Загрузка…</div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  'use strict';
  var app=document.getElementById('app');
  var state={page:'overview',role:''};
  var routes={overview:'/api/app/overview',work:'/api/app/work-center',finance:'/api/app/finance',warehouse:'/api/app/warehouse',crm:'/api/app/crm/groups',analytics:'/api/app/analytics'};
  var names={overview:'Главная',work:'Work Center',finance:'Финансы',warehouse:'Склад',crm:'CRM',analytics:'Аналитика'};
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function n(v){if(v==null||v==='')return '—';var x=Number(v);return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number.isFinite(x)?x:0);}
  function rub(v){return v==null?'—':n(v)+' ₽';}
  function nav(){var s='<nav>';Object.keys(names).forEach(function(k){s+='<button data-page="'+k+'" class="'+(state.page===k?'active':'')+'">'+names[k]+'</button>';});return s+'</nav>';}
  function shell(body){return nav()+'<div class="top"><div><div class="brand">Strike Arena</div><div class="sub">Центр управления клубом</div></div>'+(state.role?'<span class="badge">'+esc(state.role.toUpperCase())+'</span>':'')+'</div>'+body;}
  function error(text){app.innerHTML=shell('<div class="error"><h1>Ошибка загрузки</h1><p class="muted">'+esc(text)+'</p><button class="primary" data-retry>Повторить</button></div>');bind();}
  function render(d){
    state.role=d.role||state.role;
    if(state.page==='overview'){
      var r=d.revenue||{},k=d.kpi||{},a=d.attention||[],st=d.source_status||{};
      return shell('<h1>Главная</h1><p class="muted">Сводка за сегодня</p><div class="grid"><div class="card"><div class="label">Выручка</div><div class="value">'+rub(r.total)+'</div><div class="small">Товары: '+rub(r.products)+'</div></div><div class="card"><div class="label">Продажи</div><div class="value">'+n(r.product_units)+'</div><div class="small">единиц</div></div><div class="card"><div class="label">Клиенты</div><div class="value">'+n(k.guests)+'</div></div><div class="card"><div class="label">Внимание</div><div class="value">'+n(a.reduce(function(sum,x){return sum+(Number(x.count)||0);},0))+'</div><div class="small">критических позиций</div></div></div><h2>Источники</h2><div class="card">LANGAME: <b>'+(st.langame==='ok'?'доступен':'недоступен')+'</b></div>');
    }
    if(state.page==='work') return shell('<h1>Work Center</h1><p class="muted">Операционный контроль клуба</p><div class="grid"><div class="card"><div class="label">Открытые смены</div><div class="value">'+n(d.open_shifts)+'</div></div><div class="card"><div class="label">Критический склад</div><div class="value">'+n(d.critical_stock)+'</div></div></div>');
    if(state.page==='finance'){var p=d.products||{},r2=d.revenue||{};return shell('<h1>Финансы</h1><p class="muted">За '+n(d.days)+' дней</p><div class="grid"><div class="card"><div class="label">Выручка</div><div class="value">'+rub(r2.total)+'</div></div><div class="card"><div class="label">Товары</div><div class="value">'+rub(r2.products)+'</div></div><div class="card"><div class="label">Продано</div><div class="value">'+n(p.units)+'</div></div></div>');}
    if(state.page==='warehouse') return shell('<h1>Склад</h1><p class="muted">'+n((d.items||[]).length)+' позиций</p><div class="list">'+(d.items||[]).map(function(x){return '<div class="item"><div><b>'+esc(x.product)+'</b><span>'+esc(x.category||'')+(x.critical?' · Критический остаток':'')+'</span></div><b>'+n(x.quantity)+'</b></div>';}).join('')+(d.items&&d.items.length?'':'<div class="card muted">Склад пуст</div>')+'</div>');
    if(state.page==='crm') return shell('<h1>CRM</h1><p class="muted">Группы клиентов</p><div class="list">'+(d.items||[]).map(function(x){return '<div class="item"><div><b>'+esc(x.name)+'</b><span>'+(x.count==null?'Количество не указано':n(x.count)+' клиентов')+'</span></div></div>';}).join('')+(d.items&&d.items.length?'':'<div class="card muted">Группы не найдены</div>')+'</div>');
    if(state.page==='analytics'){var ak=d.kpi||{},c=d.comparison||{};return shell('<h1>Аналитика</h1><p class="muted">За '+n(d.days)+' дней</p><div class="grid"><div class="card"><div class="label">Выручка товаров</div><div class="value">'+rub(ak.product_revenue)+'</div></div><div class="card"><div class="label">Продано единиц</div><div class="value">'+n(ak.product_units)+'</div></div><div class="card"><div class="label">Загрузка</div><div class="value">'+(c.occupancy==null?'—':esc(c.occupancy)+'%')+'</div></div><div class="card"><div class="label">ARPU</div><div class="value">'+rub(c.arpu)+'</div></div></div>');}
    return shell('<h1>Раздел</h1>');
  }
  function bind(){Array.prototype.forEach.call(app.querySelectorAll('[data-page]'),function(b){b.onclick=function(){load(b.getAttribute('data-page'));};});var r=app.querySelector('[data-retry]');if(r)r.onclick=function(){load(state.page);};}
  function getTelegram(){return window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;}
  async function load(page){
    state.page=page||state.page;
    app.innerHTML=shell('<div class="loading">Загрузка…</div>');
    try{
      var tg=getTelegram();
      if(!tg) throw new Error('Telegram WebApp SDK не загрузился. Перезапустите Mini App из Telegram.');
      try{tg.ready();tg.expand();}catch(ignore){}
      var initData=typeof tg.initData==='string'?tg.initData:'';
      if(!initData) throw new Error('Telegram initData не получен. Закройте Mini App и откройте его из Telegram заново.');
      var controller=new AbortController();
      var timer=setTimeout(function(){controller.abort();},15000);
      var response=await fetch(routes[state.page],{method:'GET',headers:{'X-Telegram-Init-Data':initData,'Accept':'application/json'},cache:'no-store',signal:controller.signal});
      clearTimeout(timer);
      var text=await response.text();
      var data;
      try{data=JSON.parse(text);}catch(e){throw new Error('Сервер вернул некорректный ответ (HTTP '+response.status+').');}
      if(!response.ok) throw new Error(data.detail||('HTTP '+response.status));
      app.innerHTML=render(data);bind();
    }catch(e){error(e&&e.name==='AbortError'?'Сервер не ответил за 15 секунд.':(e.message||String(e)));}
  }
  load('overview');
})();
</script>
</body>
</html>
