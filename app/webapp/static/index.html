<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Strike Arena</title>
<style>
:root{color-scheme:dark;--bg:#07080b;--panel:#11141a;--panel2:#171a21;--line:#292e37;--text:#f4f6f7;--muted:#969da5;--accent:#b7ff32;--danger:#ff6670;--good:#8de45b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom));overflow-x:hidden}button,input{font:inherit}button{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:16px;padding:14px 16px;min-height:50px;font-weight:750;touch-action:manipulation;cursor:pointer}button:active{transform:scale(.985)}button.primary{background:var(--accent);border-color:var(--accent);color:#080a0b}button.ghost{background:transparent}.app{max-width:900px;margin:0 auto}.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px 20px}.brand-row{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:28px;height:28px;flex:0 0 auto;transform:rotate(45deg);background:var(--accent);border-radius:5px}.brand-name{font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small{font-size:13px;color:var(--muted)}.role{flex:0 0 auto;border:1px solid rgba(183,255,50,.4);color:var(--accent);background:rgba(183,255,50,.08);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:850}.section-head{margin:4px 0 18px}.section-head h1{margin:0;font-size:38px;line-height:1.05;letter-spacing:-.03em}.section-head p{margin:8px 0 0;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;min-height:106px}.stat.accent{border-color:rgba(183,255,50,.25)}.stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.stat .value{font-size:27px;font-weight:900;margin-top:9px;overflow-wrap:anywhere}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0}.card-title{font-size:18px;font-weight:850;margin-bottom:12px}.list{display:grid;gap:0}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-main{min-width:0}.row-main b{display:block;overflow-wrap:anywhere}.row-main span{display:block;color:var(--muted);font-size:13px;margin-top:4px;overflow-wrap:anywhere}.row-value{text-align:right;white-space:nowrap;font-weight:800}.actions-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.actions-grid button{text-align:left}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.toolbar input{flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none}.toolbar input:focus{border-color:rgba(183,255,50,.55)}.notice,.error{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0}.error{border-color:rgba(255,102,112,.4)}.error h2{margin:0 0 8px}.source{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}.loading{padding:70px 20px;text-align:center;color:var(--muted)}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.table-scroll{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-weight:650}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px}.pill.good{color:var(--good);border-color:rgba(141,228,91,.35)}.pill.warn{color:#ffd35a;border-color:rgba(255,211,90,.35)}.back{margin:0 0 12px}.periods{display:flex;gap:7px;overflow:auto;margin:-2px 0 14px}.periods button{min-width:62px;padding:10px 12px}.periods button.active{background:rgba(183,255,50,.13);border-color:rgba(183,255,50,.35);color:var(--accent)}.bottom{position:fixed;left:12px;right:12px;bottom:10px;z-index:40;background:rgba(16,18,23,.97);border:1px solid var(--line);border-radius:24px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;box-shadow:0 12px 34px rgba(0,0,0,.42);backdrop-filter:blur(14px)}.bottom button{border:0;background:transparent;min-height:60px;padding:7px 3px;color:var(--muted);font-size:12px}.bottom button.active{background:rgba(183,255,50,.12);color:var(--accent)}.bottom .ico{display:block;font-size:21px;line-height:21px;margin-bottom:4px}.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:none}.drawer-backdrop.open{display:block}.drawer{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#101218;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 14px calc(88px + env(safe-area-inset-bottom));max-height:84vh;overflow:auto;transform:translateY(100%);transition:transform .18s ease}.drawer.open{transform:translateY(0)}.drawer h2{margin:2px 4px 16px}.drawer-group{margin:0 0 17px}.drawer-group-title{font-size:12px;color:var(--muted);text-transform:uppercase;margin:0 4px 7px}.drawer button{display:block;width:100%;text-align:left;margin:5px 0}.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.hero-actions button{min-height:62px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:13px}.detail span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.detail b{display:block;overflow-wrap:anywhere}.writeoff{display:grid;gap:12px}.writeoff-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.boot-fallback{min-height:80vh;display:grid;place-items:center}.boot-card{width:min(100%,520px);padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--panel);text-align:center}
@media(min-width:700px){body{padding-left:28px;padding-right:28px}.grid{grid-template-columns:repeat(4,1fr)}.actions-grid{grid-template-columns:repeat(3,1fr)}.bottom{left:50%;right:auto;transform:translateX(-50%);width:min(680px,calc(100% - 24px))}}
</style>
</head>
<body>
<div id="app"><div class="boot-fallback"><div class="boot-card"><div class="brand-name">Strike Arena</div><h1>Запуск приложения</h1><p class="small">Инициализация защищённого контура…</p><div class="loading">Загрузка…</div></div></div></div>
<div id="drawerBackdrop" class="drawer-backdrop"></div><aside id="drawer" class="drawer"><h2>Все разделы</h2><div id="drawerBody"></div></aside>
<script>
(function(){'use strict';
var app=document.getElementById('app'),drawer=document.getElementById('drawer'),backdrop=document.getElementById('drawerBackdrop');
var state={page:'overview',role:'',stack:[],ready:false,days:30};
var routes={overview:'/api/app/overview',work:'/api/app/work-center',finance:'/api/app/finance',warehouse:'/api/app/warehouse',crm:'/api/app/crm/groups',crmSearch:'/api/app/crm',localLinks:'/api/app/crm/local-links',analytics:'/api/app/analytics',shifts:'/api/app/shifts',previous:'/api/app/shifts/previous',closeReports:'/api/app/shifts/close-reports',penalties:'/api/app/penalties',salary:'/api/app/salary',admin:'/api/app/admin/me',profiles:'/api/app/admin/profiles',settings:'/api/app/settings',campaigns:'/api/app/smm/campaigns',guest:'/api/app/guest/me',warehouseCritical:'/api/app/warehouse/critical',warehouseCategories:'/api/app/warehouse/categories',warehouseArrivals:'/api/app/warehouse/arrivals',warehouseSales:'/api/app/warehouse/sales',warehouseHistory:'/api/app/warehouse/history',warehouseWriteoffs:'/api/app/warehouse/writeoffs',warehouseInventories:'/api/app/warehouse/inventories',warehouseDiscrepancies:'/api/app/warehouse/discrepancies'};
var labels={overview:'Главная',work:'Работа',finance:'Финансы',warehouse:'Склад',crm:'CRM',analytics:'Аналитика',shifts:'Смены',previous:'Предыдущая смена',closeReports:'Закрытия смен',penalties:'Штрафы',salary:'Зарплата',admin:'Контроль администратора',profiles:'Профили доступа',settings:'Настройки',campaigns:'SMM',guest:'Мой профиль',crmSearch:'Поиск гостей',localLinks:'Telegram / consent',warehouseCritical:'Критические остатки',warehouseCategories:'Категории склада',warehouseArrivals:'Приходы',warehouseSales:'Продажи товаров',warehouseHistory:'История склада',warehouseWriteoffs:'Списания',warehouseInventories:'Инвентаризации',warehouseDiscrepancies:'Расхождения'};
var groups={'Работа':['work','shifts','previous','closeReports','penalties','salary'],'Финансы':['finance','analytics'],'Склад':['warehouse','warehouseCritical','warehouseCategories','warehouseArrivals','warehouseSales','warehouseHistory','warehouseWriteoffs','warehouseInventories','warehouseDiscrepancies'],'CRM':['crm','crmSearch','localLinks'],'Администрирование':['admin','profiles','settings'],'Маркетинг':['campaigns'],'Гость':['guest']};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function n(v){if(v==null||v==='')return '—';var x=Number(v);return Number.isFinite(x)?new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(x):esc(v);}
function rub(v){return v==null?'—':n(v)+' ₽';}
function tg(){return window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;}
function can(p){if(state.role==='owner')return true;if(state.role==='admin')return ['overview','work','warehouse','crm','crmSearch','localLinks','shifts','previous','closeReports','penalties','salary','admin','profiles','settings','warehouseCritical','warehouseCategories','warehouseArrivals','warehouseSales','warehouseHistory','warehouseWriteoffs','warehouseInventories','warehouseDiscrepancies'].indexOf(p)>=0;if(state.role==='smm')return ['overview','crm','crmSearch','localLinks','campaigns'].indexOf(p)>=0;return p==='guest'||p==='overview';}
function header(){return '<header class="app-header"><div class="brand-row"><span class="mark"></span><div style="min-width:0"><div class="brand-name">Strike Arena</div><div class="small">Единый центр управления клубом</div></div></div><span class="role">'+esc(String(state.role||'').toUpperCase())+'</span></header>'+(state.stack.length?'<div class="back"><button type="button" data-back>← Назад</button></div>':'');}
function bottom(){return '<nav class="bottom"><button type="button" class="'+(state.page==='overview'?'active':'')+'" data-page="overview"><span class="ico">⌂</span>Главная</button><button type="button" class="'+(state.page==='work'?'active':'')+'" data-page="work"><span class="ico">▣</span>Работа</button><button type="button" class="'+(state.page==='finance'?'active':'')+'" data-page="finance"><span class="ico">₽</span>Финансы</button><button type="button" data-more><span class="ico">•••</span>Ещё</button></nav>';}
function shell(body){return header()+body+bottom();}
function section(title,sub){return '<div class="section-head"><h1>'+esc(title)+'</h1>'+(sub?'<p class="muted">'+esc(sub)+'</p>':'')+'</div>';}
function actions(items){return '<div class="actions-grid">'+items.filter(function(x){return can(x[0]);}).map(function(x){return '<button type="button" data-page="'+x[0]+'"'+(x[2]?' class="primary"':'')+'>'+esc(x[1])+'</button>';}).join('')+'</div>';}
function kv(obj,keys){return '<div class="list">'+keys.filter(function(k){return obj&&obj[k]!==undefined;}).map(function(k){return '<div class="row"><span>'+esc(k)+'</span><b class="row-value">'+esc(obj[k]==null?'—':obj[k])+'</b></div>';}).join('')+'</div>';}
function list(items,empty){if(!items||!items.length)return '<div class="empty">'+esc(empty||'Нет данных')+'</div>';return '<div class="list">'+items.map(function(x){return '<div class="row"><div class="row-main"><b>'+esc(x.name||x.title||x.employee||x.product||x.display_name||('Запись #'+(x.id||'')))+'</b><span>'+esc(x.meta||x.status||x.type||x.category||'')+'</span></div><b class="row-value">'+esc(x.value==null?'':x.value)+'</b></div>';}).join('')+'</div>';}
function periodButtons(){return '<div class="periods">'+[7,30,90].map(function(x){return '<button type="button" class="'+(state.days===x?'active':'')+'" data-days="'+x+'">'+x+' дн.</button>';}).join('')+'</div>';}
function overview(d){var r=d.revenue||{},k=d.kpi||{},s=d.source_status||{};return shell(section('Главная','Операционная сводка. Показатели разделены по источникам.')+'<div class="grid"><div class="stat accent"><div class="label">Выручка сегодня</div><div class="value">'+rub(r.total)+'</div></div><div class="stat"><div class="label">Продажи товаров</div><div class="value">'+rub(r.products)+'</div></div><div class="stat"><div class="label">Гости</div><div class="value">'+n(k.guests)+'</div></div><div class="stat"><div class="label">Открытые смены</div><div class="value">'+n(k.open_shifts)+'</div></div></div><div class="card"><div class="card-title">Быстрый доступ</div>'+actions([['work','Работа',1],['finance','Финансы'],['warehouse','Склад'],['crm','CRM'],['analytics','Аналитика']])+'</div><div class="source">LANGAME: '+esc(s.langame||'—')+' · Часовой пояс: '+esc(d.timezone||'—')+' · Неподтверждённые показатели не подменяются нулями.</div>');}
function work(d){return shell(section('Работа','Смены, контроль и действия')+'<div class="grid"><div class="stat"><div class="label">Открытые смены</div><div class="value">'+n(d.open_shifts)+'</div></div><div class="stat"><div class="label">Критический склад</div><div class="value">'+n(d.critical_stock)+'</div></div><div class="stat"><div class="label">Ожидают списания</div><div class="value">'+n(d.pending_writeoffs)+'</div></div><div class="stat"><div class="label">Расхождения</div><div class="value">'+n(d.open_discrepancies)+'</div></div></div><div class="card"><div class="card-title">Контуры</div>'+actions([['shifts','Смены',1],['previous','Предыдущая смена'],['closeReports','Закрытия смен'],['penalties','Штрафы'],['salary','Зарплата'],['warehouse','Склад'],['admin','Контроль администратора'],['profiles','Профили доступа']])+'</div>');}
function finance(d){var r=d.revenue||{},p=d.products||{},m=d.payments||{};return shell(section('Финансы','Раздельно: продажи товаров и денежные поступления')+periodButtons()+'<div class="grid"><div class="stat accent"><div class="label">Продажи товаров</div><div class="value">'+rub(r.products)+'</div></div><div class="stat"><div class="label">Единиц товара</div><div class="value">'+n(p.units)+'</div></div><div class="stat"><div class="label">Наличные</div><div class="value">'+rub(m.cash)+'</div></div><div class="stat"><div class="label">Карта</div><div class="value">'+rub(m.card)+'</div></div></div><div class="card"><div class="card-title">Поступления</div>'+kv({'Наличные':rub(m.cash),'Карта':rub(m.card),'Безнал':rub(m.mobile),'Разница кассы':rub(m.cash_difference)},['Наличные','Карта','Безнал','Разница кассы'])+'</div><div class="notice">Gaming / COGS / прочие доходы показываются только после подтверждения источника. Они не смешиваются с продажами товаров.</div>'+actions([['penalties','Штрафы'],['salary','Зарплата']])+'</div>');}
function warehouse(d){var items=d.items||[];return shell(section('Склад','Остатки и движение товаров')+'<div class="grid"><div class="stat"><div class="label">Позиций</div><div class="value">'+n(items.length)+'</div></div><div class="stat"><div class="label">Критических</div><div class="value">'+n(items.filter(function(x){return x.critical;}).length)+'</div></div></div><div class="card"><div class="card-title">Операции склада</div>'+actions([['warehouseCritical','Критические',1],['warehouseCategories','Категории'],['warehouseArrivals','Приходы'],['warehouseSales','Продажи товаров'],['warehouseHistory','История'],['warehouseWriteoffs','Списания'],['warehouseInventories','Инвентаризации'],['warehouseDiscrepancies','Расхождения']])+'</div><div class="card"><div class="card-title">Остатки</div>'+list(items.slice(0,100).map(function(x){return {name:x.product,meta:(x.category||'Без категории')+(x.critical?' · КРИТИЧЕСКИЙ':''),value:n(x.quantity)};}),'Остатки не найдены')+'</div>');}
function shifts(d){return shell(section('Смены','Последние смены')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:'Смена #'+(x.langame_shift_id||x.id),meta:(x.employee||'Администратор не указан')+' · '+(x.status||'—'),value:rub(x.cash_sales)};}),'Смен нет')+'</div>');}
function previous(d){var x=d.item;if(!x)return shell(section('Предыдущая смена')+'<div class="empty">Закрытых смен нет.</div>');return shell(section('Предыдущая смена','Полный кассовый и передаточный срез')+'<div class="detail-grid"><div class="detail"><span>Администратор</span><b>'+esc(x.employee||'—')+'</b></div><div class="detail"><span>Статус</span><b>Закрыта</b></div><div class="detail"><span>Системная касса</span><b>'+rub(x.system_cash)+'</b></div><div class="detail"><span>Фактическая касса</span><b>'+rub(x.actual_cash)+'</b></div><div class="detail"><span>Разница</span><b>'+rub(x.cash_difference)+'</b></div><div class="detail"><span>Наличные</span><b>'+rub(x.cash_sales)+'</b></div><div class="detail"><span>Карта</span><b>'+rub(x.card_sales)+'</b></div><div class="detail"><span>Безнал</span><b>'+rub(x.mobile_sales)+'</b></div></div><div class="card">'+kv(x,['started_at','ended_at','collection','handover_note'])+'</div>');}
function closeReports(d){return shell(section('Закрытия смен','Контроль кассы, склада и уборки')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:'Закрытие #'+x.id,meta:'Смена #'+(x.shift_id||'—')+' · '+(x.status||'—')+' · склад '+n(x.stock_items_count)+' поз.',value:rub(x.cash_difference)};}),'Закрытий нет')+'</div>');}
function penalties(d){return shell(section('Штрафы','Нарушения и удержания')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.employee||('Сотрудник #'+x.employee_id),meta:(x.title||x.type||'Нарушение')+' · '+(x.created_at||''),value:rub(x.amount)};}),'Штрафов нет')+'</div>');}
function salary(d){return shell(section('Зарплата','Расчётные периоды и выплаты')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.employee||('Период #'+x.id),meta:(x.date_from||'—')+' — '+(x.date_to||'—')+' · '+(x.status||'—')+(x.paid?' · оплачено':''),value:rub(x.total_amount)};}),'Расчётных периодов нет')+'</div><button type="button" class="primary" data-open="salary">Открыть расчёт и действия</button>');}
function analytics(d){var k=d.kpi||{},rows=d.admins||[];return shell(section('Аналитика','KPI за выбранный период')+periodButtons()+'<div class="grid"><div class="stat accent"><div class="label">Продажи товаров</div><div class="value">'+rub(k.product_revenue)+'</div></div><div class="stat"><div class="label">Единиц</div><div class="value">'+n(k.product_units)+'</div></div><div class="stat"><div class="label">Смен</div><div class="value">'+n(k.shifts)+'</div></div><div class="stat"><div class="label">Часы</div><div class="value">'+n(k.hours)+'</div></div><div class="stat"><div class="label">Списания</div><div class="value">'+n(k.approved_writeoffs)+'</div></div><div class="stat"><div class="label">Расхождения</div><div class="value">'+n(k.discrepancies)+'</div></div><div class="stat"><div class="label">Разница кассы</div><div class="value">'+rub(k.cash_difference)+'</div></div><div class="stat"><div class="label">Зарплата</div><div class="value">'+rub(k.salary_total)+'</div></div></div><div class="card"><div class="card-title">Администраторы</div><div class="table-scroll"><table class="table"><thead><tr><th>Сотрудник</th><th>Смены</th><th>Часы</th></tr></thead><tbody>'+rows.map(function(x){return '<tr><td>'+esc(x.employee)+'</td><td>'+n(x.shifts)+'</td><td>'+n(x.hours)+'</td></tr>';}).join('')+'</tbody></table></div></div><div class="notice">'+esc(d.note||'Неподтверждённые метрики остаются NULL.')+'</div>');}
function crm(d){return shell(section('CRM','Группы лояльности LANGAME')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.name,meta:'Группа · '+n(x.count)+' гостей',value:x.id==null?'':'ID '+x.id};}),'Групп нет')+'</div>'+actions([['crmSearch','Поиск гостей',1],['localLinks','Telegram / consent']]));}
function crmSearch(d){return shell(section('Поиск гостей','Поиск выполняется по LANGAME')+'<div class="toolbar"><input id="guestQuery" value="" placeholder="Имя, телефон или ID"><button type="button" class="primary" data-search>Найти</button></div><div class="card">'+list((d.items||[]).map(function(x){return {name:x.name||x.fio||x.full_name||'Гость',meta:[x.phone,x.email,x.id].filter(Boolean).join(' · '),value:x.balance==null?'':rub(x.balance)};}),'Гости не найдены')+'</div>');}
function localLinks(d){return shell(section('Telegram / consent','Локальные привязки и согласия')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.name||('Гость #'+x.guest_id),meta:(x.phone||'')+' · Telegram '+(x.telegram_user_id||'—'),value:x.marketing_consent?'consent':'нет consent'};}),'Привязок нет')+'</div>');}
function guest(d){var g=d.guest||d.profile||d;return shell(section('Мой профиль','Только собственные данные гостя')+'<div class="card">'+kv(g,['name','phone','loyalty_group','marketing_consent'])+'</div><div class="notice">'+esc(d.source_note||'Доступ ограничен собственным профилем.')+'</div>');}
function guestNotLinked(){return shell(section('Мой профиль','Личный контур гостя')+'<div class="error"><h2>Профиль ещё не привязан</h2><p>Этот Telegram не связан с карточкой гостя клуба.</p><p class="small">Попросите владельца клуба создать персональную ссылку через команду <b>/guest_invite LANGAME_GUEST_ID</b> и откройте её в Telegram.</p><p class="small">После привязки снова откройте «Мой профиль». Данные гостя берутся из LANGAME, а Telegram-привязка хранится локально.</p></div>');}
function profiles(d){return shell(section('Профили доступа','Роли и параметры сотрудников')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.display_name,meta:(x.username?'@'+x.username+' · ':'')+x.role+' · '+(x.active?'активен':'отключён'),value:x.employee_id==null?'':('ID '+x.employee_id)};}),'Профилей нет')+'</div>');}
function admin(d){return shell(section('Контроль администратора','Ваши доступы')+'<div class="card">'+kv({Сотрудник:d.employee_id,Права:(d.permissions||[]).join(', ')},['Сотрудник','Права'])+'</div>');}
function settingsPage(d){var s=d.settings||{};return shell(section('Настройки','Автоотчёт владельца')+'<div class="card">'+kv({Часовой_пояс:s.timezone||d.timezone,Время:(s.hour==null?'—':String(s.hour).padStart(2,'0'))+':'+(s.minute==null?'—':String(s.minute).padStart(2,'0')),Автоотчёт:s.enabled?'включён':'выключен',Excel:s.send_excel?'да':'нет'},['Часовой_пояс','Время','Автоотчёт','Excel'])+'</div><button type="button" class="primary" data-open="settings">Изменить настройки</button>');}
function campaigns(d){return shell(section('SMM','Кампании и рассылки')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.name,meta:(x.status||'—')+' · '+(x.scheduled_at||'без расписания'),value:n(x.sent)+' / '+n(x.recipients)};}),'Кампаний нет')+'</div><div class="notice">Статусы доставки показываются отдельно от планирования. Неподтверждённая отправка не считается успешной.</div>');}
function simple(title,d){var items=d.items||d.rows||[];return shell(section(title)+'<div class="card">'+list(items.map(function(x){return {name:x.name||x.product||x.title||('Запись #'+x.id),meta:Object.keys(x).filter(function(k){return ['name','product','title','id'].indexOf(k)<0;}).slice(0,3).map(function(k){return k+': '+x[k];}).join(' · '),value:x.quantity==null?(x.amount==null?'':rub(x.amount)):n(x.quantity)};}),'Нет данных')+'</div>');}
function render(d){switch(state.page){case'overview':return overview(d);case'work':return work(d);case'finance':return finance(d);case'warehouse':return warehouse(d);case'shifts':return shifts(d);case'previous':return previous(d);case'closeReports':return closeReports(d);case'penalties':return penalties(d);case'salary':return salary(d);case'analytics':return analytics(d);case'crm':return crm(d);case'crmSearch':return crmSearch(d);case'localLinks':return localLinks(d);case'guest':return guest(d);case'profiles':return profiles(d);case'admin':return admin(d);case'settings':return settingsPage(d);case'campaigns':return campaigns(d);default:return simple(labels[state.page]||'Раздел',d);}}
function signal(kind){try{window.dispatchEvent(new CustomEvent('sa:app-state',{detail:{state:kind,role:state.role,page:state.page}}));}catch(e){}}
function api(path,params){var t=tg();if(!t)throw Error('Telegram WebApp SDK не загрузился');try{t.ready();t.expand();}catch(e){}if(!t.initData)throw Error('Telegram initData не получен. Откройте Mini App из Telegram.');var q=params?Object.keys(params).filter(function(k){return params[k]!=null&&params[k]!=='';}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&'):'';return fetch(path+(q?'?'+q:''),{headers:{'X-Telegram-Init-Data':t.initData,'Accept':'application/json'},cache:'no-store'}).then(function(r){return r.text().then(function(text){var d={};try{d=text?JSON.parse(text):{};}catch(e){var parseErr=Error('Некорректный ответ сервера HTTP '+r.status);parseErr.status=r.status;throw parseErr;}if(!r.ok){var err=Error(d.detail||('HTTP '+r.status));err.status=r.status;err.code=d.code||null;throw err;}return d;});});}
function openDrawer(){var html='';Object.keys(groups).forEach(function(g){var items=groups[g].filter(can);if(!items.length)return;html+='<div class="drawer-group"><div class="drawer-group-title">'+esc(g)+'</div>'+items.map(function(k){return '<button type="button" data-drawer-page="'+k+'">'+esc(labels[k])+'</button>';}).join('')+'</div>';});document.getElementById('drawerBody').innerHTML=html;drawer.classList.add('open');backdrop.classList.add('open');}
function closeDrawer(){drawer.classList.remove('open');backdrop.classList.remove('open');}
function go(page,opts){opts=opts||{};if(!page||!routes[page]||!can(page)){renderError('Раздел недоступен для текущей роли');return;}if(page!==state.page&&!opts.replace)state.stack.push(state.page);state.page=page;closeDrawer();load(false,opts.params);}
function back(){var p=state.stack.pop();if(!p){return;}state.page=p;load(true);}
function renderError(msg){app.innerHTML=shell(section('Ошибка','Раздел не удалось загрузить')+'<div class="error"><h2>Ответ сервера недоступен</h2><p class="muted">'+esc(msg)+'</p><button type="button" class="primary" data-retry>Повторить</button></div>');signal('error');}
function bind(){document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){go(b.dataset.page);};});document.querySelectorAll('[data-drawer-page]').forEach(function(b){b.onclick=function(){go(b.dataset.drawerPage);};});document.querySelectorAll('[data-bottom]').forEach(function(b){b.onclick=function(){go(b.dataset.bottom);};});var backBtn=document.querySelector('[data-back]');if(backBtn)backBtn.onclick=back;var retry=document.querySelector('[data-retry]');if(retry)retry.onclick=function(){load(true);};document.querySelectorAll('[data-days]').forEach(function(b){b.onclick=function(){state.days=Number(b.dataset.days);load(true);};});var search=document.querySelector('[data-search]');if(search)search.onclick=function(){var q=(document.getElementById('guestQuery')||{}).value||'';load(true,{q:q});};}
async function load(replace,params){signal('loading');app.innerHTML=header()+'<div class="loading">Загрузка '+esc(labels[state.page]||'раздела')+'…</div>'+bottom();try{var p=Object.assign({},params||{});if((state.page==='finance'||state.page==='analytics')&&!p.days)p.days=state.days;var d=await api(routes[state.page],p);if(d.role)state.role=d.role;app.innerHTML=render(d);state.ready=true;bind();signal('ready');}catch(e){if(state.page==='guest'&&e.status===404&&e.code==='GUEST_NOT_LINKED'){app.innerHTML=guestNotLinked();bind();signal('ready');return;}renderError(e.message||String(e));}}
window.__SA_START_APP__=async function(role){state.role=role||state.role||'guest';state.page=state.role==='guest'?'guest':'overview';state.stack=[];return await load(true);};
backdrop.onclick=closeDrawer;
document.addEventListener('click',function(ev){var b=ev.target.closest&&ev.target.closest('[data-more]');if(b){ev.preventDefault();openDrawer();return;}var o=ev.target.closest&&ev.target.closest('[data-open]');if(o){var key=o.getAttribute('data-open');if(key==='salary'||key==='settings'||key==='warehouseWriteoffs'){ev.preventDefault();ev.stopImmediatePropagation();window.__SA_ACTIONS_OPEN__=key;document.dispatchEvent(new CustomEvent('sa:open-action',{detail:key}));}},true);
document.addEventListener('sa:open-action',function(ev){var key=ev.detail;var target=key==='warehouseWriteoffs'?'writeoffs':key;window.dispatchEvent(new CustomEvent('sa:open-custom',{detail:target}));});
})();
</script>
