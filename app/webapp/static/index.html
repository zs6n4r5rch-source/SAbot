<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strike Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{color-scheme:light dark;--sa-bg:var(--tg-theme-bg-color,#0d0f12);--sa-surface:var(--tg-theme-secondary-bg-color,#171a20);--sa-surface-2:var(--tg-theme-section-bg-color,#1d2129);--sa-text:var(--tg-theme-text-color,#f5f7fa);--sa-muted:var(--tg-theme-hint-color,#8b929e);--sa-accent:#8b5cf6;--sa-accent-2:#22c55e;--sa-danger:var(--tg-theme-destructive-text-color,#ff5d5d);--sa-line:var(--tg-theme-section-separator-color,rgba(255,255,255,.08));--sa-radius:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--sa-bg);color:var(--sa-text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{overflow-x:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 18px}.brand{display:flex;align-items:center;gap:11px;min-width:0}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#a78bfa,#6d28d9);display:grid;place-items:center;box-shadow:0 8px 28px rgba(124,58,237,.28);flex:0 0 auto}.logo svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.brand-name{font-size:18px;font-weight:800;letter-spacing:-.3px}.brand-sub{font-size:12px;color:var(--sa-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.icon-btn{width:40px;height:40px;border:0;border-radius:13px;background:var(--sa-surface);color:var(--sa-text);display:grid;place-items:center;font-size:18px}
.hero{padding:18px;border-radius:22px;background:linear-gradient(145deg,rgba(139,92,246,.18),rgba(34,197,94,.06) 58%,var(--sa-surface));border:1px solid rgba(139,92,246,.18);margin-bottom:12px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:#a78bfa;margin-bottom:7px}.hero-title{font-size:27px;line-height:1.08;font-weight:850;letter-spacing:-.8px}.hero-sub{font-size:13px;color:var(--sa-muted);margin-top:7px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 9px}.section-title h2{font-size:15px;margin:0;font-weight:800}.section-title span{font-size:11px;color:var(--sa-muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:var(--sa-surface);border:1px solid var(--sa-line);border-radius:var(--sa-radius);padding:14px;margin:10px 0}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{background:var(--sa-surface);border:1px solid var(--sa-line);border-radius:16px;padding:13px}.kpi-label{font-size:11px;color:var(--sa-muted);margin-bottom:7px}.kpi-value{font-size:22px;font-weight:850;letter-spacing:-.5px}.kpi-value.good{color:var(--sa-accent-2)}.kpi-value.warn{color:#f5b84b}.kpi-value.bad{color:var(--sa-danger)}
.nav-card{background:var(--sa-surface);border:1px solid var(--sa-line);border-radius:20px;padding:10px}.nav-btn{width:100%;border:0;background:transparent;color:var(--sa-text);border-radius:14px;padding:13px 10px;text-align:left;display:flex;align-items:center;gap:12px;min-height:50px}.nav-btn:active{background:var(--sa-surface-2)}.nav-icon{width:32px;height:32px;border-radius:10px;background:var(--sa-surface-2);display:grid;place-items:center;font-size:14px;color:#c4b5fd}.nav-copy{min-width:0}.nav-label{display:block;font-size:14px;font-weight:750}.nav-hint{display:block;font-size:11px;color:var(--sa-muted);margin-top:2px}.nav-arrow{margin-left:auto;color:var(--sa-muted);font-size:18px}.primary{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;padding:13px 14px;font-weight:800;box-shadow:0 8px 22px rgba(109,40,217,.18)}.secondary{width:100%;border:1px solid var(--sa-line);border-radius:14px;background:var(--sa-surface-2);color:var(--sa-text);padding:12px 14px;font-weight:750}.back{width:100%;margin-bottom:10px;text-align:left;border:0;background:transparent;color:var(--sa-muted);padding:5px 2px;font-size:13px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--sa-line)}.row:last-child{border-bottom:0}.row-main{min-width:0}.row-title{font-size:14px;font-weight:720;overflow:hidden;text-overflow:ellipsis}.row-sub{font-size:11px;color:var(--sa-muted);margin-top:3px}.row-value{font-size:13px;font-weight:800;white-space:nowrap}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;background:var(--sa-surface-2);color:var(--sa-muted)}.badge.good{color:#4ade80}.badge.warn{color:#f5b84b}.admin-card{padding:13px}.admin-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.admin-name{font-size:14px;font-weight:800}.admin-meta{font-size:11px;color:var(--sa-muted);margin-top:3px}.admin-main{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.mini{background:var(--sa-surface-2);border-radius:12px;padding:10px}.mini-label{font-size:10px;color:var(--sa-muted)}.mini-value{font-size:15px;font-weight:800;margin-top:3px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--sa-line);border-radius:13px;background:var(--sa-surface);color:var(--sa-text);font-size:15px;margin:5px 0 10px;outline:none}input:focus,textarea:focus,select:focus{border-color:rgba(139,92,246,.65)}label{display:block;font-size:11px;color:var(--sa-muted);margin:4px 0 3px}.empty{padding:25px 10px;text-align:center;color:var(--sa-muted);font-size:13px}.muted{color:var(--sa-muted)}.error{color:var(--sa-danger);border-color:rgba(255,93,93,.2);background:rgba(255,93,93,.07)}.hidden{display:none!important}
.bottom-nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--sa-bg) 88%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--sa-line)}.bottom-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.bottom-item{border:0;background:transparent;color:var(--sa-muted);padding:7px 4px;border-radius:12px;font-size:10px;font-weight:750}.bottom-item.active{background:var(--sa-surface);color:var(--sa-text)}.bottom-item span{display:block;font-size:16px;margin-bottom:2px}@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}.admin-main{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap"><header class="topbar"><div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 18 9 5l4 8 3-5 4 10"/><path d="M4 18h16"/></svg></div><div><div class="brand-name">Strike Arena</div><div class="brand-sub" id="hello">Подключение…</div></div></div><button class="icon-btn" id="refresh" aria-label="Обновить">↻</button></header><div id="error" class="card error hidden"></div><main id="root"></main></div>
<div id="bottom" class="bottom-nav hidden"><div class="bottom-inner"><button class="bottom-item active" data-nav="home"><span>⌂</span>Главная</button><button class="bottom-item" data-nav="work"><span>▦</span>Работа</button><button class="bottom-item" data-nav="more"><span>•••</span>Ещё</button></div></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();tg.enableClosingConfirmation?.()}const headers={'X-Telegram-Init-Data':tg?.initData||''};const root=document.getElementById('root'),err=document.getElementById('error'),bottom=document.getElementById('bottom');let me=null;
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...headers,...(opt.headers||{}),'Content-Type':'application/json'}});if(!r.ok)throw new Error((await r.text())||r.statusText);return r.json()}function fail(e){err.textContent='Ошибка: '+e.message;err.classList.remove('hidden')}function clear(){err.classList.add('hidden');root.innerHTML=''}function btn(text,fn,cls='secondary'){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}function card(title,body){return `<section class="card"><div class="section-title"><h2>${title}</h2></div>${body}</section>`}function money(x){return Number(x||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽'}function row(a,b,c=''){return `<div class="row"><div class="row-main"><div class="row-title">${a}</div>${c?`<div class="row-sub">${c}</div>`:''}</div><div class="row-value">${b}</div></div>`}function back(){root.prepend(btn('← Назад',home,'back'))}function iconNav(icon,title,hint,fn){const b=document.createElement('button');b.className='nav-btn';b.innerHTML=`<span class="nav-icon">${icon}</span><span class="nav-copy"><span class="nav-label">${title}</span><span class="nav-hint">${hint}</span></span><span class="nav-arrow">›</span>`;b.onclick=fn;return b}function setBottom(show){bottom.classList.toggle('hidden',!show)}
async function home(){clear();setBottom(true);const s=await api('/api/summary');document.getElementById('hello').textContent=`${me.display_name||'Пользователь'} · ${me.role==='owner'?'Владелец':'Администратор'}`;const owner=me.role==='owner';root.innerHTML=`<section class="hero"><div class="eyebrow">${owner?'Owner control':'Admin workspace'}</div><div class="hero-title">${owner?'Ежедневная сводка':'Рабочий кабинет'}</div><div class="hero-sub">Главное — на одном экране. Подробности открываются по запросу.</div></section>`;root.insertAdjacentHTML('beforeend',`<div class="kpis"><div class="kpi"><div class="kpi-label">Сотрудники</div><div class="kpi-value">${s.employees}</div></div><div class="kpi"><div class="kpi-label">Открытые смены</div><div class="kpi-value good">${s.open_shifts}</div></div><div class="kpi"><div class="kpi-label">Штрафы · 30 дней</div><div class="kpi-value ${s.violations_30d?'warn':''}">${s.violations_30d}</div></div><div class="kpi"><div class="kpi-label">Критические остатки</div><div class="kpi-value ${s.critical_stock?'bad':''}">${s.critical_stock}</div></div></div>`);const groups=owner?[['Люди','Сотрудники и клиенты',['👥','Администраторы','Управление доступом',admins],['◌','Клиенты','Поиск в Langame',clients]],['Деньги и контроль','Финансы и операционные показатели',['₽','Финансы','Продажи, зарплата и итог',finance],['↗','Аналитика','Рейтинг и динамика',analytics]],['Операции','Бар и контроль смен',['▣','Бар и снеки','Остатки и критические позиции',inventory],['!','Штрафы','Нарушения и решения',penalties]],['Поощрения','Бонусы и внимание',['+','Бонусы','Результаты администраторов',bonuses],['•','Требует внимания','Проблемы, требующие решения',attention]],['Система','Коммуникации и настройки',['@','Рассылки','Кампании и сообщения',mailings],['⚙','Настройки','Правила ежедневного отчёта',settings]]]:[['Работа','Ваша текущая зона',['▣','Бар и снеки','Остатки и товары',inventory],['◷','Мои смены','История и текущая смена',shifts]],['Результаты','Личная статистика',['↗','Моя статистика','Показатели за 30 дней',analytics],['₽','Моя зарплата','Расчёты и начисления',salary]],['Поощрения','Бонусы администратора',['+','Мои бонусы','Начисления и достижения',bonuses],['✓','Закрытие смены','Завершить рабочий день',()=>alert('Закрытие смены выполняется через рабочий экран бота.')]]];groups.forEach(g=>{root.insertAdjacentHTML('beforeend',`<div class="section-title"><h2>${g[0]}</h2><span>${g[1]}</span></div>`);const box=document.createElement('div');box.className='nav-card';box.appendChild(iconNav(...g[2]));box.appendChild(iconNav(...g[3]));root.appendChild(box)})}
function goNav(which){if(which==='home')home();else if(which==='work')(me.role==='owner'?inventory:shifts)();else if(which==='more')(me.role==='owner'?settings:bonuses)()}document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>goNav(x.dataset.nav));
async function admins(){clear();setBottom(false);back();const d=await api('/api/admins');const html=d.items.length?d.items.map(x=>`<section class="card admin-card"><div class="admin-head"><div><div class="admin-name">${x.name}</div><div class="admin-meta">${x.role==='not_linked'?'Доступ не настроен':x.role.toUpperCase()} · ${x.telegram_id?'Telegram привязан':'Telegram не привязан'}</div></div><span class="badge ${x.access_active?'good':'warn'}">${x.access_active?'Активен':'Нет доступа'}</span></div><div class="admin-main"><div class="mini"><div class="mini-label">Telegram</div><div class="mini-value">${x.telegram_id?'Есть':'Нет'}</div></div><div class="mini"><div class="mini-label">Langame</div><div class="mini-value">${x.langame_user_id||'—'}</div></div></div></section>`).join(''):'<div class="empty">Сотрудников пока нет</div>';root.insertAdjacentHTML('beforeend',`<div class="section-title"><h2>Администраторы</h2><span>${d.items.length}</span></div>${html}`)}
async function clients(){clear();setBottom(false);back();root.insertAdjacentHTML('beforeend',card('Клиенты',`<input id="cq" placeholder="Имя или телефон"><button class="primary" id="cs">Поиск</button><div id="cl"></div>`));document.getElementById('cs').onclick=async()=>{try{const d=await api('/api/clients?q='+encodeURIComponent(document.getElementById('cq').value));const box=document.getElementById('cl');if(d.items)box.innerHTML=d.items.length?d.items.map(x=>row(x.fio||'Без имени',x.phone||'—','Langame ID '+(x.langame_guest_id||x.id))).join(''):'<div class="empty">Ничего не найдено</div>';else box.innerHTML='<div class="empty">Данные получены из Langame.</div><pre style="white-space:pre-wrap;font-size:11px">'+JSON.stringify(d.data,null,2).slice(0,8000)+'</pre>'}catch(e){fail(e)}}}
async function inventory(){clear();setBottom(false);back();const d=await api('/api/inventory');root.insertAdjacentHTML('beforeend',card('Бар и снеки',d.items.length?d.items.map(x=>row(x.product,`${x.quantity} / ${x.min_stock}`,x.club+(x.critical?' · критический остаток':''))).join(''):'<div class="empty">Нет данных</div>'))}async function finance(){clear();setBottom(false);back();const d=await api('/api/finance?days=30');root.insertAdjacentHTML('beforeend',`<div class="section-title"><h2>Финансы</h2><span>30 дней</span></div><div class="kpis"><div class="kpi"><div class="kpi-label">Продажи</div><div class="kpi-value">${money(d.sales)}</div></div><div class="kpi"><div class="kpi-label">Единиц</div><div class="kpi-value">${d.units}</div></div><div class="kpi"><div class="kpi-label">Зарплата</div><div class="kpi-value">${money(d.salary)}</div></div><div class="kpi"><div class="kpi-label">Штрафы</div><div class="kpi-value ${d.penalties?'warn':''}">${money(d.penalties)}</div></div></div>${card('Результат',`<div class="kpi-value">${money(d.net_before_other)}</div><div class="muted" style="margin-top:4px;font-size:11px">Продажи минус зарплата и штрафы</div>`)}`)}
async function analytics(){clear();setBottom(false);back();if(me.role==='admin'){const d=await api('/api/my-stats');root.insertAdjacentHTML('beforeend',`<div class="section-title"><h2>Моя статистика</h2><span>30 дней</span></div><div class="kpis"><div class="kpi"><div class="kpi-label">Смены</div><div class="kpi-value">${d.shifts_30d}</div></div><div class="kpi"><div class="kpi-label">Открытая смена</div><div class="kpi-value ${d.open_shift?'good':''}">${d.open_shift?'Да':'Нет'}</div></div><div class="kpi"><div class="kpi-label">Штрафы</div><div class="kpi-value ${d.penalties?'warn':''}">${money(d.penalties)}</div></div></div>`);return}const d=await api('/api/analytics?days=30');const total=(d.sales_rows||[]).reduce((s,x)=>s+Number(x.amount||x.sales_amount||0),0);root.insertAdjacentHTML('beforeend',`<div class="section-title"><h2>Аналитика</h2><span>30 дней</span></div>${card('Продажи',`<div class="kpi-value">${money(total)}</div>`)}${d.ranking?.length?card('Рейтинг',d.ranking.map((x,i)=>row(`${i+1}. ${x.name||x.full_name||'Администратор'}`,x.score??x.amount??'',x.hours?x.hours+' ч':'')).join('')):''}`)}
async function shifts(){clear();setBottom(false);back();const d=await api('/api/shifts?days=30');root.insertAdjacentHTML('beforeend',card('Смены',d.items.map(x=>row(x.employee,x.status==='open'?'Открыта':'Закрыта',`${x.started_at||''} → ${x.ended_at||''}`)).join('')||'<div class="empty">Смен нет</div>'))}async function salary(){clear();setBottom(false);back();const d=await api('/api/my-salary');root.insertAdjacentHTML('beforeend',card('Моя зарплата',d.items.map(x=>row(`${x.from} — ${x.to}`,money(x.total),`база ${money(x.base)} · бонус ${money(x.bonus)} · ${x.status}`)).join('')||'<div class="empty">Расчётов пока нет</div>'))}async function bonuses(){clear();setBottom(false);back();const d=await api('/api/bonuses');root.insertAdjacentHTML('beforeend',card('Бонусы',d.items.map(x=>row(x.employee,x.title,`${x.type} · ${x.created_at||''}`)).join('')||'<div class="empty">Бонусов нет</div>'))}async function attention(){clear();setBottom(false);back();const d=await api('/api/attention');root.insertAdjacentHTML('beforeend',card('Требует внимания',row('Критические остатки',d.critical_stock,d.critical_stock?'Нужно проверить':'В норме')+row('Решения по увольнению',d.dismissal_required,d.dismissal_required?'Требуют действия':'Нет ожидающих')))}async function penalties(){clear();setBottom(false);back();const d=await api('/api/penalties');root.insertAdjacentHTML('beforeend',card('Штрафы',`<button class="primary" id="newp">Назначить штраф</button><div style="margin-top:8px">${d.items.map(x=>row(x.employee,money(x.amount),`${x.title} · ${x.created_at||''}${x.premium_reduction_percent?' · премия −100%':''}${x.dismissal_required?' · требуется увольнение':''}`)).join('')||'<div class="empty">Штрафов нет</div>'}</div>`));document.getElementById('newp').onclick=penaltyForm)}
async function penaltyForm(){const r=await api('/api/penalty-rules'),a=await api('/api/admins');clear();setBottom(false);back();root.insertAdjacentHTML('beforeend',card('Новый штраф',`<label>Сотрудник</label><select id="pe">${a.items.filter(x=>x.access_active||x.role==='not_linked').map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><label>Нарушение</label><select id="pr">${r.items.map(x=>`<option value="${x.code}">${x.title} — ${money(x.amount)}${x.premium?' · −100% премии':''}</option>`).join('')}</select><label>Комментарий</label><textarea id="pc" maxlength="4000" placeholder="Комментарий"></textarea><button class="primary" id="save">Подтвердить</button>`));document.getElementById('save').onclick=async()=>{if(!confirm('Назначить штраф?'))return;await api('/api/penalties',{method:'POST',body:JSON.stringify({employee_id:Number(pe.value),code:pr.value,comment:pc.value})});alert('Штраф сохранён');penalties()}}
async function mailings(){clear();setBottom(false);back();root.insertAdjacentHTML('beforeend',card('Рассылки','Создание и отправка рассылок будут вынесены в отдельную компактную форму.'))}async function settings(){clear();setBottom(false);back();const d=await api('/api/settings');root.insertAdjacentHTML('beforeend',card('Настройки',d.configured?row('Ежедневный отчёт',d.enabled?'Включён':'Выключен')+row('Часовой пояс',d.timezone)+row('Время',String(d.hour).padStart(2,'0')+':'+String(d.minute).padStart(2,'0')):'<div class="empty">Настройки ещё не созданы</div>')+card('Безопасность','Роль и Telegram ID проверяются на сервере по подписанным данным Telegram.'))}document.getElementById('refresh').onclick=home;(async()=>{try{me=await api('/api/me');await home()}catch(e){setBottom(false);fail(e)}})();
</script>
</body>
</html>
