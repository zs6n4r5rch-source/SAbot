<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Strike Arena</title>
<style>
:root{color-scheme:dark;--bg:#07080b;--panel:#12151b;--panel2:#171a21;--line:#282d35;--text:#f4f6f7;--muted:#9299a1;--accent:#b7ff32;--danger:#ff5c68}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 14px calc(100px + env(safe-area-inset-bottom));overflow-x:hidden}button,input,select{font:inherit}button{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:16px;padding:14px 16px;font-weight:750;min-height:50px;touch-action:manipulation;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#080a0b}button:active{transform:scale(.98)}.boot-fallback{min-height:80vh;display:grid;place-items:center}.boot-card{width:min(100%,520px);padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--panel);text-align:center}.brand{font-size:28px;font-weight:900}.muted{color:var(--muted)}.small{font-size:13px;color:var(--muted)}.loading{text-align:center;color:var(--muted);padding:50px 20px}.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 2px 18px}.brand-row{display:flex;align-items:center;gap:10px}.mark{width:24px;height:24px;transform:rotate(45deg);background:var(--accent);border-radius:4px}.brand-name{font-size:22px;font-weight:900}.role{padding:8px 11px;border:1px solid rgba(183,255,50,.35);border-radius:999px;color:var(--accent);background:rgba(183,255,50,.08);font-size:12px;font-weight:800}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:6px 0 16px}.section-head h1{font-size:34px;line-height:1.05;margin:0}.section-head p{margin:7px 0 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;min-height:100px}.stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.stat .value{font-size:28px;font-weight:900;margin-top:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0}.card-title{font-size:18px;font-weight:850;margin-bottom:12px}.list{display:grid;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-main{min-width:0}.row-main b{display:block;overflow-wrap:anywhere}.row-main span{display:block;color:var(--muted);font-size:13px;margin-top:4px;overflow-wrap:anywhere}.section-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.section-actions button{text-align:left}.notice,.error{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:10px 0}.error{border-color:rgba(255,92,104,.35)}.error h2{margin:0 0 8px}.source{font-size:12px;color:var(--muted);margin-top:12px}.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:none}.drawer-backdrop.open{display:block}.drawer{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#101218;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 14px calc(90px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;transform:translateY(100%);transition:transform .18s ease}.drawer.open{transform:translateY(0)}.drawer h2{margin:4px 4px 14px}.drawer-group{margin:0 0 16px}.drawer-group-title{font-size:12px;color:var(--muted);text-transform:uppercase;margin:0 4px 8px}.drawer button{width:100%;text-align:left;margin:4px 0}.bottom{position:fixed;left:12px;right:12px;bottom:10px;z-index:40;background:rgba(16,18,23,.96);border:1px solid var(--line);border-radius:24px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(14px)}.bottom button{border:0;background:transparent;min-height:62px;padding:8px 4px;color:var(--muted);font-size:12px}.bottom button.active{background:rgba(183,255,50,.12);color:var(--accent)}.bottom .ico{display:block;font-size:22px;line-height:22px;margin-bottom:4px}.empty{text-align:center;padding:26px 12px;color:var(--muted)}.kv{display:grid;gap:0}.kv .row b{max-width:58%;text-align:right}.table-scroll{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-weight:600}.toolbar{display:flex;gap:8px;margin-bottom:12px}.form-grid{display:grid;gap:10px}.form-grid input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
@media(min-width:700px){body{padding-left:28px;padding-right:28px}.grid{grid-template-columns:repeat(4,1fr)}.section-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.bottom{left:50%;right:auto;transform:translateX(-50%);width:min(680px,calc(100% - 24px))}}
</style>
</head>
<body>
<div id="app"><div class="boot-fallback"><div class="boot-card"><div class="brand">Strike Arena</div><h1>Запуск приложения</h1><p class="muted">Инициализация защищённого контура…</p><div class="loading">Загрузка…</div></div></div></div>
<div id="drawerBackdrop" class="drawer-backdrop"></div><div id="drawer" class="drawer"><h2>Все разделы</h2><div id="drawerBody"></div></div>
<script>
(function(){'use strict';
var app=document.getElementById('app'),drawer=document.getElementById('drawer'),backdrop=document.getElementById('drawerBackdrop');
var state={page:'overview',role:'',stack:[],ready:false};
var routes={overview:'/api/app/overview',work:'/api/app/work-center',finance:'/api/app/finance',warehouse:'/api/app/warehouse',crm:'/api/app/crm/groups',crmSearch:'/api/app/crm',localLinks:'/api/app/crm/local-links',analytics:'/api/app/analytics',shifts:'/api/app/shifts',previous:'/api/app/shifts/previous',closeReports:'/api/app/shifts/close-reports',penalties:'/api/app/penalties',salary:'/api/app/salary',admin:'/api/app/admin/me',profiles:'/api/app/admin/profiles',settings:'/api/app/settings',campaigns:'/api/app/smm/campaigns',guest:'/api/app/guest/me',warehouseCritical:'/api/app/warehouse/critical',warehouseCategories:'/api/app/warehouse/categories',warehouseArrivals:'/api/app/warehouse/arrivals',warehouseSales:'/api/app/warehouse/sales',warehouseHistory:'/api/app/warehouse/history',warehouseWriteoffs:'/api/app/warehouse/writeoffs',warehouseInventories:'/api/app/warehouse/inventories',warehouseDiscrepancies:'/api/app/warehouse/discrepancies'};
var labels={overview:'Главная',work:'Работа',finance:'Финансы',warehouse:'Склад',crm:'CRM',analytics:'Аналитика',shifts:'Смены',previous:'Предыдущая смена',closeReports:'Закрытия смен',penalties:'Штрафы',salary:'Зарплата',admin:'Контроль администратора',profiles:'Профили доступа',settings:'Настройки',campaigns:'SMM',guest:'Мой профиль',crmSearch:'Поиск гостей',localLinks:'Telegram / consent',warehouseCritical:'Критические остатки',warehouseCategories:'Категории',warehouseArrivals:'Приходы',warehouseSales:'Продажи товаров',warehouseHistory:'История склада',warehouseWriteoffs:'Списания',warehouseInventories:'Инвентаризации',warehouseDiscrepancies:'Расхождения'};
var groups={'Операции':['work','shifts','previous','closeReports','warehouse','penalties','salary'],'Финансы и контроль':['finance','analytics','admin','profiles','settings'],'CRM':['crm','crmSearch','localLinks'],'Маркетинг':['campaigns'],'Склад':['warehouseCritical','warehouseCategories','warehouseArrivals','warehouseSales','warehouseHistory','warehouseWriteoffs','warehouseInventories','warehouseDiscrepancies'],'Гость':['guest']};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){if(v==null||v==='')return '—';var x=Number(v);return Number.isFinite(x)?new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(x):esc(v);}
function rub(v){return v==null?'—':num(v)+' ₽';}
function tg(){return window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;}
function can(p){if(state.role==='owner')return true;if(state.role==='admin')return ['overview','work','warehouse','crm','crmSearch','localLinks','shifts','previous','closeReports','penalties','salary','admin','profiles','settings','warehouseCritical','warehouseCategories','warehouseArrivals','warehouseSales','warehouseHistory','warehouseWriteoffs','warehouseInventories','warehouseDiscrepancies'].indexOf(p)>=0;if(state.role==='smm')return ['overview','crm','crmSearch','localLinks','campaigns'].indexOf(p)>=0;return p==='guest'||p==='overview';}
function header(){return '<header class="app-header"><div class="brand-row"><span class="mark"></span><div><div class="brand-name">Strike Arena</div><div class="small">Единый центр управления клубом</div></div></div><span class="role">'+esc(String(state.role||'').toUpperCase())+'</span></header>';}
function bottom(){var items=[['overview','⌂','Главная'],['work','▣','Работа'],['finance','₽','Финансы'],['__more','•••','Ещё']];return '<div class="bottom">'+items.map(function(x){var active=x[0]!=='__more'&&state.page===x[0];return '<button type="button" class="'+(active?'active':'')+'" data-bottom="'+x[0]+'"><span class="ico">'+x[1]+'</span>'+x[2]+'</button>';}).join('')+'</div>';}
function shell(body){return header()+body+bottom();}
function section(title,sub){return '<div class="section-head"><div><h1>'+esc(title)+'</h1>'+(sub?'<p class="muted">'+esc(sub)+'</p>':'')+'</div></div>';}
function actions(items){return '<div class="section-actions">'+items.filter(function(x){return can(x[0]);}).map(function(x){return '<button type="button" data-page="'+x[0]+'"'+(x[2]?' class="primary"':'')+'>'+esc(x[1])+'</button>';}).join('')+'</div>';}
function list(items,empty){if(!items||!items.length)return '<div class="empty">'+esc(empty||'Нет данных')+'</div>';return '<div class="list">'+items.map(function(x){return '<div class="row"><div class="row-main"><b>'+esc(x.name||x.title||x.employee||x.product||x.display_name||('Запись #'+(x.id||'')))+'</b><span>'+esc(x.meta||x.status||x.type||x.category||'')+'</span></div><b>'+esc(x.value==null?'':x.value)+'</b></div>';}).join('')+'</div>';}
function kv(obj,keys){return '<div class="kv">'+keys.filter(function(k){return obj&&obj[k]!==undefined;}).map(function(k){return '<div class="row"><span>'+esc(k)+'</span><b>'+esc(obj[k]==null?'—':obj[k])+'</b></div>';}).join('')+'</div>';}
function overview(d){var r=d.revenue||{},k=d.kpi||{},s=d.source_status||{};return shell(section('Главная','Операционная сводка. Только подтверждённые показатели.')+'<div class="grid"><div class="stat"><div class="label">Продажи товаров сегодня</div><div class="value">'+rub(r.total)+'</div></div><div class="stat"><div class="label">Единиц товара</div><div class="value">'+num(r.product_units)+'</div></div><div class="stat"><div class="label">Гости в базе</div><div class="value">'+num(k.guests)+'</div></div><div class="stat"><div class="label">Открытые смены</div><div class="value">'+num(k.open_shifts)+'</div></div></div><div class="card"><div class="card-title">Быстрый доступ</div>'+actions([['work','Работа',1],['warehouse','Склад'],['crm','CRM'],['finance','Финансы'],['analytics','Аналитика']])+'</div><div class="source">Источник товаров: LANGAME · Статус: '+esc(s.langame||'—')+' · Часовой пояс: '+esc(d.timezone||'—')+'</div>');}
function work(d){return shell(section('Работа','Смены и операционный контроль')+'<div class="grid"><div class="stat"><div class="label">Открытые смены</div><div class="value">'+num(d.open_shifts)+'</div></div><div class="stat"><div class="label">Критический склад</div><div class="value">'+num(d.critical_stock)+'</div></div><div class="stat"><div class="label">Ожидают списания</div><div class="value">'+num(d.pending_writeoffs)+'</div></div><div class="stat"><div class="label">Расхождения</div><div class="value">'+num(d.open_discrepancies)+'</div></div></div><div class="card"><div class="card-title">Разделы</div>'+actions([['shifts','Смены',1],['previous','Предыдущая смена'],['closeReports','Закрытия смен'],['warehouse','Склад'],['penalties','Штрафы'],['salary','Зарплата'],['admin','Контроль администратора'],['profiles','Профили доступа'],['settings','Настройки'],['campaigns','SMM']])+'</div>');}
function finance(d){var r=d.revenue||{},p=d.products||{},m=d.payments||{};return shell(section('Финансы','Последние '+num(d.days)+' дней')+'<div class="grid"><div class="stat"><div class="label">Продажи товаров</div><div class="value">'+rub(r.products)+'</div></div><div class="stat"><div class="label">Единиц товара</div><div class="value">'+num(p.units)+'</div></div><div class="stat"><div class="label">Разница кассы</div><div class="value">'+rub(m.cash_difference)+'</div></div><div class="stat"><div class="label">Источник</div><div class="value">LANGAME</div></div></div><div class="card"><div class="card-title">Поступления по сменам</div>'+kv({Наличные:rub(m.cash),Карта:rub(m.card),Безнал:rub(m.mobile)},['Наличные','Карта','Безнал'])+'</div><div class="notice">Продажи товаров и поступления по сменам — разные источники. Они не складываются в один искусственный «итог».</div>'+actions([['penalties','Штрафы'],['salary','Зарплата']]))}
function warehouse(d){var items=d.items||[];return shell(section('Склад','Остатки и движение')+'<div class="card"><div class="card-title">Сводка</div><div class="grid"><div class="stat"><div class="label">Позиций</div><div class="value">'+num(items.length)+'</div></div><div class="stat"><div class="label">Критических</div><div class="value">'+num(items.filter(function(x){return x.critical;}).length)+'</div></div></div></div><div class="card"><div class="card-title">Операции</div>'+actions([['warehouseCritical','Критические',1],['warehouseCategories','Категории'],['warehouseArrivals','Приходы'],['warehouseSales','Продажи товаров'],['warehouseHistory','История'],['warehouseWriteoffs','Списания'],['warehouseInventories','Инвентаризации'],['warehouseDiscrepancies','Расхождения']])+'</div><div class="card"><div class="card-title">Текущие остатки</div>'+list(items.slice(0,100).map(function(x){return {name:x.product,meta:(x.category||'Без категории')+(x.critical?' · КРИТИЧЕСКИЙ':''),value:num(x.quantity)};}),'Остатки не найдены')+'</div>');}
function shifts(d){return shell(section('Смены','Последние 100 смен')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:'Смена #'+(x.langame_shift_id||x.id),meta:(x.employee||'Без администратора')+' · '+(x.status||'—'),value:rub(x.cash_sales)};}),'Смен нет')+'</div>');}
function previous(d){var x=d.item;if(!x)return shell(section('Предыдущая смена')+'<div class="empty">Закрытых смен нет.</div>');return shell(section('Предыдущая смена')+'<div class="card">'+kv(x,['employee','started_at','ended_at','system_cash','actual_cash','cash_difference','cash_sales','card_sales','mobile_sales','collection','handover_note'])+'</div>');}
function closeReports(d){return shell(section('Закрытия смен','Проверка кассы и склада')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:'Запись #'+x.id,meta:(x.status||'—')+' · смена #'+(x.shift_id||'—'),value:rub(x.cash_difference)};}),'Закрытий нет')+'</div>');}
function penalties(d){return shell(section('Штрафы','Контроль нарушений и удержаний')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.employee||('Сотрудник #'+x.employee_id),meta:(x.title||x.type||'Нарушение')+' · '+(x.created_at||''),value:rub(x.amount)};}),'Штрафов нет')+'</div>');}
function salary(d){return shell(section('Зарплата','Расчётные периоды')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.employee||('Период #'+x.id),meta:(x.date_from||'—')+' — '+(x.date_to||'—')+' · '+(x.status||'—'),value:rub(x.total_amount)};}),'Расчётных периодов нет')+'</div>');}
function analytics(d){var k=d.kpi||{},rows=d.admins||[];return shell(section('Аналитика','Период: '+num(d.days)+' дней')+'<div class="grid"><div class="stat"><div class="label">Продажи товаров</div><div class="value">'+rub(k.product_revenue)+'</div></div><div class="stat"><div class="label">Единиц</div><div class="value">'+num(k.product_units)+'</div></div><div class="stat"><div class="label">Смен</div><div class="value">'+num(k.shifts)+'</div></div><div class="stat"><div class="label">Часы</div><div class="value">'+num(k.hours)+'</div></div><div class="stat"><div class="label">Одобренные списания</div><div class="value">'+num(k.approved_writeoffs)+'</div></div><div class="stat"><div class="label">Расхождения</div><div class="value">'+num(k.discrepancies)+'</div></div><div class="stat"><div class="label">Разница кассы</div><div class="value">'+rub(k.cash_difference)+'</div></div><div class="stat"><div class="label">Зарплата</div><div class="value">'+rub(k.salary_total)+'</div></div></div><div class="card"><div class="card-title">Администраторы</div><div class="table-scroll"><table class="table"><thead><tr><th>Сотрудник</th><th>Смены</th><th>Часы</th></tr></thead><tbody>'+rows.map(function(x){return '<tr><td>'+esc(x.employee)+'</td><td>'+num(x.shifts)+'</td><td>'+num(x.hours)+'</td></tr>';}).join('')+'</tbody></table></div></div><div class="notice">'+esc(d.note||'Неподтверждённые метрики не показываются как нулевые.')+'</div>');}
function crm(d){return shell(section('CRM','Группы лояльности LANGAME')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.name,meta:'Группа · '+(x.count==null?'—':num(x.count))+' гостей',value:x.id==null?'':x.id};}),'Групп нет')+'</div>'+actions([['crmSearch','Поиск гостей',1],['localLinks','Telegram / consent']]));}
function crmSearch(d){return shell(section('Поиск гостей','Данные LANGAME')+'<div class="toolbar"><button type="button" data-search>Поиск</button></div><div class="card">'+list((d.items||[]).map(function(x){return {name:x.name||x.fio||x.full_name||'Гость',meta:[x.phone,x.email,x.id].filter(Boolean).join(' · '),value:x.balance==null?'':rub(x.balance)};}),'Гости не найдены')+'</div>');}
function localLinks(d){return shell(section('Telegram / consent','Локальные привязки')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.name||('Гость #'+x.guest_id),meta:(x.phone||'')+' · Telegram '+(x.telegram_user_id||'—'),value:x.marketing_consent?'consent':'нет consent'};}),'Привязок нет')+'</div>');}
function guest(d){var g=d.guest||d.profile||d;return shell(section('Мой профиль','Гостевой контур')+'<div class="card">'+kv(g,['name','phone','loyalty_group','marketing_consent'])+'</div><div class="notice">'+esc(d.source_note||'Доступ ограничен собственным профилем.')+'</div>');}
function profiles(d){return shell(section('Профили доступа','Роли и права')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.display_name,meta:(x.username?'@'+x.username+' · ':'')+x.role+' · '+(x.active?'активен':'отключён'),value:x.employee_id==null?'':('ID '+x.employee_id)};}),'Профилей нет')+'</div>');}
function campaigns(d){return shell(section('SMM','Кампании и рассылки')+'<div class="card">'+list((d.items||[]).map(function(x){return {name:x.name,meta:(x.status||'—')+' · '+(x.scheduled_at||'без расписания'),value:num(x.sent)+' / '+num(x.recipients)};}),'Кампаний нет')+'</div><div class="notice">Планировщик и статусы доставки разделены: неподтверждённые отправки не выдаются за успешные.</div>');}
function settingsPage(d){var s=d.settings||{};return shell(section('Настройки','Автоотчёт владельца')+'<div class="card">'+kv({Часовой_пояс:s.timezone||d.timezone,Время:(s.hour==null?'—':String(s.hour).padStart(2,'0'))+':'+(s.minute==null?'—':String(s.minute).padStart(2,'0')),Автоотчёт:s.enabled?'включён':'выключен',Excel:s.send_excel?'да':'нет'},['Часовой_пояс','Время','Автоотчёт','Excel'])+'</div><button type="button" data-open="settings" class="primary">Изменить настройки</button>');}
function simple(title,d){var items=d.items||d.rows||[];return shell(section(title)+'<div class="card">'+list(items.map(function(x){return {name:x.name||x.product||x.title||('Запись #'+x.id),meta:Object.keys(x).filter(function(k){return ['name','product','title','id'].indexOf(k)<0;}).slice(0,2).map(function(k){return k+': '+x[k];}).join(' · '),value:x.quantity==null?(x.amount==null?'':rub(x.amount)):num(x.quantity)};}),'Нет данных')+'</div>');}
function render(d){if(state.page==='overview')return overview(d);if(state.page==='work')return work(d);if(state.page==='finance')return finance(d);if(state.page==='warehouse')return warehouse(d);if(state.page==='shifts')return shifts(d);if(state.page==='previous')return previous(d);if(state.page==='closeReports')return closeReports(d);if(state.page==='penalties')return penalties(d);if(state.page==='salary')return salary(d);if(state.page==='analytics')return analytics(d);if(state.page==='crm')return crm(d);if(state.page==='crmSearch')return crmSearch(d);if(state.page==='localLinks')return localLinks(d);if(state.page==='guest')return guest(d);if(state.page==='profiles')return profiles(d);if(state.page==='campaigns')return campaigns(d);if(state.page==='settings')return settingsPage(d);return simple(labels[state.page]||'Раздел',d);}
function signal(kind){try{window.dispatchEvent(new CustomEvent('sa:app-state',{detail:{state:kind,role:state.role,page:state.page}}));}catch(e){}}
async function api(path,params){var t=tg();if(!t)throw Error('Telegram WebApp SDK не загрузился');try{t.ready();t.expand();}catch(e){}if(!t.initData)throw Error('Telegram initData не получен. Откройте Mini App из Telegram.');var q=params?Object.keys(params).filter(function(k){return params[k]!=null&&params[k]!=='';}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&'):'';var r=await fetch(path+(q?'?'+q:''),{headers:{'X-Telegram-Init-Data':t.initData,'Accept':'application/json'},cache:'no-store'});var text=await r.text(),d;try{d=text?JSON.parse(text):{};}catch(e){throw Error('Некорректный ответ сервера HTTP '+r.status);}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d;}
function bind(){app.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){closeDrawer();load(b.dataset.page);};});app.querySelectorAll('[data-bottom]').forEach(function(b){b.onclick=function(){if(b.dataset.bottom==='__more'){openDrawer();return;}load(b.dataset.bottom);};});var retry=app.querySelector('[data-retry]');if(retry)retry.onclick=function(){load(state.page,true);};var search=app.querySelector('[data-search]');if(search)search.onclick=function(){load('crmSearch',true,{q:prompt('Поиск гостя','')||''});};}
function renderError(e){app.innerHTML=shell(section('Ошибка','Раздел не удалось загрузить')+'<div class="error"><h2>Ответ сервера недоступен</h2><p class="muted">'+esc(e)+'</p><button class="primary" type="button" data-retry>Повторить</button></div>');bind();signal('error');}
async function load(page,back,params){if(!page||!routes[page]||!can(page)){renderError('Раздел недоступен для текущей роли');return;}if(page!==state.page&&!back)state.stack.push(state.page);state.page=page;signal('loading');app.innerHTML=header()+'<div class="loading">Загрузка '+esc(labels[page]||'раздела')+'…</div>'+bottom();try{var d=await api(routes[page],params);state.role=d.role||state.role;app.innerHTML=render(d);bind();state.ready=true;signal('ready');}catch(e){renderError(e.message||String(e));}}
function openDrawer(){var html='';Object.keys(groups).forEach(function(g){var items=groups[g].filter(can);if(!items.length)return;html+='<div class="drawer-group"><div class="drawer-group-title">'+esc(g)+'</div>'+items.map(function(k){return '<button type="button" data-drawer-page="'+k+'">'+esc(labels[k])+'</button>';}).join('')+'</div>';});document.getElementById('drawerBody').innerHTML=html;drawer.classList.add('open');backdrop.classList.add('open');document.querySelectorAll('[data-drawer-page]').forEach(function(b){b.onclick=function(){closeDrawer();load(b.dataset.drawerPage);};});}
function closeDrawer(){drawer.classList.remove('open');backdrop.classList.remove('open');}backdrop.onclick=closeDrawer;
window.__SA_START_APP__=async function(role){state.role=role||state.role||'guest';state.page=state.role==='guest'?'guest':'overview';state.stack=[];return await load(state.page,true);};
})();
</script>
