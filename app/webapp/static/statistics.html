<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strike Arena · Статистика</title><script src="https://telegram.org/js/telegram-web-app.js?63"></script><style>
:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#0d0f12);--s:var(--tg-theme-secondary-bg-color,#171a20);--s2:var(--tg-theme-section-bg-color,#1d2129);--t:var(--tg-theme-text-color,#f5f7fa);--m:var(--tg-theme-hint-color,#8b929e);--a:#8b5cf6;--g:#22c55e;--line:rgba(255,255,255,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(32px + env(safe-area-inset-bottom))}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.title{font-size:24px;font-weight:850}.sub{font-size:12px;color:var(--m);margin-top:4px}.actions{display:flex;gap:7px}.btn,.period button{border:1px solid var(--line);background:var(--s);color:var(--t);border-radius:12px;padding:10px 11px;font-weight:750}.period{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.period button{color:var(--m)}.period button.active{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.45);color:#c4b5fd}.card{background:var(--s);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.h{font-size:14px;font-weight:800;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.k{background:var(--s2);border-radius:13px;padding:11px}.kl{font-size:10px;color:var(--m)}.kv{font-size:19px;font-weight:850;margin-top:4px}.good{color:var(--g)}.muted,.note{color:var(--m)}.note{font-size:11px;line-height:1.45}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.row:last-child{border-bottom:0}.badge{font-size:10px;padding:4px 7px;border-radius:999px;background:var(--s2);color:var(--m)}.section-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav{padding:13px;background:var(--s);border:1px solid var(--line);border-radius:15px;font-weight:750}.danger{color:#ff8a8a}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="wrap"><div class="head"><div><div class="title">Статистика</div><div class="sub" id="periodLabel">за последние 30 дней</div></div><div class="actions"><button class="btn" onclick="exportXlsx()">Excel</button><button class="btn" onclick="load()">↻</button></div></div><div class="period"><button data-d="7">7 дней</button><button data-d="30" class="active">30 дней</button><button data-d="90">90 дней</button><button data-d="0">Всё время</button></div><div id="root"></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const headers={'X-Telegram-Init-Data':tg?.initData||''};let days=30;const root=document.getElementById('root');document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{days=+b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('active',x===b));load()});
function money(x){return Number(x||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽'}function n(x){return Number(x||0).toLocaleString('ru-RU',{maximumFractionDigits:2})}function metric(label,value,cls=''){return `<div class="k"><div class="kl">${label}</div><div class="kv ${cls}">${value}</div></div>`}async function api(){const r=await fetch('/api/statistics?days='+days,{headers});if(!r.ok)throw new Error(await r.text());return r.json()}
function render(d){const s=d.summary||{},a=d.admins||[];root.innerHTML=`<div class="card"><div class="h">Общая статистика</div><div class="grid">${metric('Выручка товаров',money(s.sales))}${metric('Продано единиц',n(s.units))}${metric('Смен',n(s.shifts))}${metric('Закрыто смен',n(s.closed_shifts))}${metric('Часы администраторов',n(s.admin_hours))}${metric('Продажи / час',money(s.admin_hours?s.sales/s.admin_hours:0),'good')}${metric('Расхождения',n(s.discrepancies))}${metric('Сумма расхождений',money(s.discrepancy_amount))}</div></div><div class="card"><div class="h">Персонал и деньги</div><div class="grid">${metric('Разница по кассе',money(s.cash_difference))}${metric('Штрафы',money(s.penalties))}${metric('Зарплата',money(s.salary))}${metric('Списания, ед.',n(s.writeoff_units))}${metric('Штрафов',n(s.violations_count))}${metric('Бонусов',n(s.bonuses_count))}${metric('Критический остаток',n(s.critical_stock))}</div></div><div class="card"><div class="h">Администраторы</div>${a.length?a.map((x,i)=>`<div class="row"><span>${i+1}. ${x.name}<br><span class="muted">${x.shifts} смен · ${n(x.hours)} ч · касса ${money(x.cash)}</span></span><b>${money(x.sales_per_hour)}/ч</b></div>`).join(''):'<div class="note">Нет данных</div>'}</div><div class="card"><div class="h">Глубокая статистика LANGAME</div><div class="section-nav"><div class="nav">Тарифы и пакеты</div><div class="nav">Купленные часы</div><div class="nav">Средняя цена часа</div><div class="nav">Возвращаемость гостей</div><div class="nav">Rolling Retention</div><div class="nav">Sticky Factor</div><div class="nav">ARPU</div><div class="nav">Частота посещений</div></div><div class="note" style="margin-top:10px">Эти показатели подключаются только из подтверждённых источников LANGAME. Неполные API-данные не подменяются локальными продажами.</div></div><div class="card"><div class="h">Выгрузка</div><div class="note">Кнопка Excel выгружает сводку, администраторов, продажи, штрафы, расхождения, списания и зарплату за выбранный период. Для «Всё время» используется полный доступный период данных.</div></div>`}
async function load(){document.getElementById('periodLabel').textContent=days===0?'за всё время':`за последние ${days} дней`;root.innerHTML='<div class="card muted">Загрузка…</div>';try{render(await api())}catch(e){root.innerHTML=`<div class="card danger">Не удалось загрузить статистику: ${e.message}</div>`}}function exportXlsx(){window.location.href='/api/statistics/export?days='+days}load();
</script></body></html>
