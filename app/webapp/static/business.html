<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strike Arena — Business Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#0d0f12);--surface:var(--tg-theme-secondary-bg-color,#171a20);--surface2:var(--tg-theme-section-bg-color,#1d2129);--text:var(--tg-theme-text-color,#f5f7fa);--muted:var(--tg-theme-hint-color,#8b929e);--accent:#8b5cf6;--good:#22c55e;--warn:#f5b84b;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:19px;font-weight:850}.sub{font-size:11px;color:var(--muted);margin-top:3px}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 12px;font-weight:750}.hero{padding:18px;border-radius:22px;background:linear-gradient(145deg,rgba(139,92,246,.2),rgba(34,197,94,.06),var(--surface));border:1px solid rgba(139,92,246,.18);margin-bottom:12px}.eyebrow{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#b9a5ff;font-weight:850}.title{font-size:27px;font-weight:900;margin-top:6px}.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.periods button{border:0;border-radius:11px;background:var(--surface);color:var(--muted);padding:9px;font-weight:800}.periods button.active{background:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:14px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.value{font-size:23px;font-weight:900;margin-top:6px}.good{color:var(--good)}.warn{color:var(--warn)}.section{margin-top:18px}.section h2{font-size:15px;margin:0 0 9px}.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:13px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-size:13px;font-weight:800}.meta{font-size:10px;color:var(--muted);margin-top:3px}.num{text-align:right;font-weight:850;font-size:12px;white-space:nowrap}.bar{height:6px;background:var(--surface2);border-radius:99px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.foot{font-size:10px;color:var(--muted);line-height:1.4;margin-top:14px}.error{padding:13px;border-radius:14px;background:rgba(255,93,93,.08);color:#ff7b7b;display:none}
</style>
</head>
<body><div class="wrap"><div class="top"><div><div class="brand">Strike Arena</div><div class="sub" id="who">Business Dashboard · Langame</div></div><button class="btn" id="refresh">↻</button></div><div id="error" class="error"></div><section class="hero"><div class="eyebrow">Business Dashboard</div><div class="title">Бизнес за период</div><div class="periods"><button data-days="7">7 дней</button><button data-days="30" class="active">30 дней</button><button data-days="90">90 дней</button></div></section><div id="kpis" class="grid"></div><div class="section"><h2>Администраторы</h2><div id="admins" class="card"></div></div><div class="section"><h2>Контроль</h2><div id="control" class="card"></div></div><div class="foot">Продажи в этом экране — товарные продажи, полученные через API Langame и привязанные к рабочим сменам. Ключ API в браузер не передаётся.</div></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const H={'X-Telegram-Init-Data':tg?.initData||''};let days=30;
const $=id=>document.getElementById(id);const money=x=>Number(x||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';
async function api(p){const r=await fetch(p,{headers:H});if(!r.ok)throw Error((await r.text())||r.statusText);return r.json()}
function showError(e){$('error').textContent='Ошибка загрузки: '+e.message;$('error').style.display='block'}
async function load(){ $('error').style.display='none';try{const [a,f,c]=await Promise.all([api('/api/analytics?days='+days),api('/api/finance?days='+days),api('/api/attention')]);const rows=a.sales_rows||[];let sales=0,units=0,lines=0;for(const x of rows){if(Number(x.cancel||0)===1)continue;const q=Number(x.count||0),p=Number(x.price_sale||0);units+=q;sales+=p*q;lines++}const avg=units? sales/units:0;$('kpis').innerHTML=`<div class="kpi"><div class="label">Продажи Langame</div><div class="value good">${money(sales)}</div></div><div class="kpi"><div class="label">Продано единиц</div><div class="value">${units.toLocaleString('ru-RU')}</div></div><div class="kpi"><div class="label">Строк продаж</div><div class="value">${lines}</div></div><div class="kpi"><div class="label">Цена / единицу</div><div class="value">${money(avg)}</div></div>`;const ranking=a.ranking||[];const max=Math.max(...ranking.map(x=>Number(x.sales||0)),1);$('admins').innerHTML=ranking.length?ranking.slice(0,15).map(x=>{const s=Number(x.sales||0),h=Number(x.hours||0),ph=h?s/h:0;return `<div class="row"><div style="min-width:0"><div class="name">${x.name}</div><div class="meta">${x.shifts||0} смен · ${h.toFixed(1)} ч · ${money(ph)}/ч</div><div class="bar"><i style="width:${Math.max(2,s/max*100)}%"></i></div></div><div class="num">${money(s)}</div></div>`}).join(''):'<div class="meta">Нет данных за период</div>';$('control').innerHTML=`<div class="row"><div><div class="name">Зарплата</div><div class="meta">локальные расчётные периоды</div></div><div class="num">${money(f.salary)}</div></div><div class="row"><div><div class="name">Штрафы</div><div class="meta">локальные нарушения</div></div><div class="num">${money(f.penalties)}</div></div><div class="row"><div><div class="name">Остатки ниже минимума</div></div><div class="num ${c.critical_stock?'warn':''}">${c.critical_stock||0}</div></div><div class="row"><div><div class="name">Требуют решения</div></div><div class="num ${c.dismissal_required?'warn':''}">${c.dismissal_required||0}</div></div>`}catch(e){showError(e)}}
document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('active',x===b));load()});$('refresh').onclick=load;load();
</script></body></html>
